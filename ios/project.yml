name: FaceLiveIOS
options:
  deploymentTarget:
    iOS: "16.0"
  bundleIdPrefix: com.facelive
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  FaceLiveIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FaceLiveIOS
    info:
      path: FaceLiveIOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facelive.ios
        INFOPLIST_FILE: FaceLiveIOS/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - framework: CoreML.framework
      - framework: AVFoundation.framework
      - framework: Vision.framework
      - framework: PhotosUI.framework
