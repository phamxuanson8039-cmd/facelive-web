<body>

autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>


<div id="message">

<b>FaceLive 3.0</b>

<script type="module">

/* =================================================
   MEDIAPIPE
================================================= */

import {
FaceLandmarker,
FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/* =================================================
   ELEMENTS
================================================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const photo =
document.getElementById("photo");

const cameraFPS =
document.getElementById("cameraFPS");

const aiFPS =
document.getElementById("aiFPS");

const latency =
document.getElementById("latency");

const faces =
document.getElementById("faces");

const mode =
document.getElementById("mode");

const photoState =
document.getElementById("photoState");


/* =================================================
   STATE
================================================= */

let landmarker = null;

let stream = null;

let running = false;

let lastVideoTime = -1;

let sourceImage = null;

let cameraFrames = 0;

let aiFrames = 0;

let fpsStart =
performance.now();


/* =================================================
   STATUS
================================================= */

function setStatus(text){

status.textContent =
"● " + text;

}


/* =================================================
   CAMERA
================================================= */

async function startCamera(){

setStatus(
"Đang mở camera..."
);


stream =
await navigator.mediaDevices
.getUserMedia({

audio:false,

video:{

facingMode:"user",

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30
}

}

});


video.srcObject =
stream;

await video.play();


await new Promise(resolve => {

if(video.videoWidth){
resolve();
}else{
video.onloadedmetadata =
resolve;
}

});


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


setStatus(
"CAMERA OK"
);

}


/* =================================================
   AI
================================================= */

async function loadAI(){

setStatus(
"Đang tải MediaPipe..."
);


const vision =
await FilesetResolver.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

);


landmarker =
await FaceLandmarker.createFromOptions(

vision,

{

baseOptions:{

modelAssetPath:

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

delegate:"GPU"

},

runningMode:"VIDEO",

numFaces:1,

minFaceDetectionConfidence:.5,

minFacePresenceConfidence:.5,

minTrackingConfidence:.5,

outputFaceBlendshapes:true,

outputFacialTransformationMatrixes:true

}

);


setStatus(
"MEDIAPIPE OK"
);

}


/* =================================================
   CAMERA POINT
================================================= */

function P(
landmarks,
index
){

const p =
landmarks[index];

return {

x:
(1-p.x) *
canvas.width,

y:
p.y *
canvas.height

};

}


/* =================================================
   PHOTO POINTS
================================================= */

function getPhotoPoints(){

const w =
sourceImage.naturalWidth;

const h =
sourceImage.naturalHeight;


/*
Ảnh mẫu chính diện.

Tỉ lệ tương đối.
*/

return {

forehead:{
x:w*.50,
y:h*.20
},

leftEye:{
x:w*.35,
y:h*.38
},

rightEye:{
x:w*.65,
y:h*.38
},

nose:{
x:w*.50,
y:h*.52
},

leftMouth:{
x:w*.40,
y:h*.65
},

rightMouth:{
x:w*.60,
y:h*.65
},

chin:{
x:w*.50,
y:h*.82
},

leftFace:{
x:w*.18,
y:h*.52
},

rightFace:{
x:w*.82,
y:h*.52
}

};

}


/* =================================================
   AFFINE TRANSFORM
================================================= */

function affine(
s1,s2,s3,
d1,d2,d3
){

const den =

s1.x*(s2.y-s3.y)+
s2.x*(s3.y-s1.y)+
s3.x*(s1.y-s2.y);


if(
Math.abs(den)<0.000001
){
return null;
}


const a =
(
d1.x*(s2.y-s3.y)+
d2.x*(s3.y-s1.y)+
d3.x*(s1.y-s2.y)
)/den;


const c =
(
d1.x*(s3.x-s2.x)+
d2.x*(s1.x-s3.x)+
d3.x*(s2.x-s1.x)
)/den;


const e =
(
d1.x*(s2.x*s3.y-s3.x*s2.y)+
d2.x*(s3.x*s1.y-s1.x*s3.y)+
d3.x*(s1.x*s2.y-s2.x*s1.y)
)/den;


const b =
(
d1.y*(s2.y-s3.y)+
d2.y*(s3.y-s1.y)+
d3.y*(s1.y-s2.y)
)/den;


const d =
(
d1.y*(s3.x-s2.x)+
d2.y*(s1.x-s3.x)+
d3.y*(s2.x-s1.x)
)/den;


const f =
(
d1.y*(s2.x*s3.y-s3.x*s2.y)+
d2.y*(s3.x*s1.y-s1.x*s3.y)+
d3.y*(s1.x*s2.y-s2.x*s1.y)
)/den;


return {
a,b,c,d,e,f
};

}


/* =================================================
   TRIANGLE
================================================= */

function triangle(
image,
s1,s2,s3,
d1,d2,d3
){

const m =
affine(
s1,s2,s3,
d1,d2,d3
);


if(!m){
return;
}


ctx.save();


ctx.beginPath();

ctx.moveTo(
d1.x,
d1.y
);

ctx.lineTo(
d2.x,
d2.y
);

ctx.lineTo(
d3.x,
d3.y
);

ctx.closePath();

ctx.clip();


ctx.setTransform(
m.a,
m.b,
m.c,
m.d,
m.e,
m.f
);


ctx.drawImage(
image,
0,
0
);


ctx.restore();

}


/* =================================================
   FACE WARP
================================================= */

function drawWarp(
landmarks
){

if(!sourceImage){
return;
}


const S =
getPhotoPoints();


const leftEye =
P(landmarks,33);

const rightEye =
P(landmarks,263);

const nose =
P(landmarks,1);

const leftMouth =
P(landmarks,61);

const rightMouth =
P(landmarks,291);

const chin =
P(landmarks,152);

const leftFace =
P(landmarks,234);

const rightFace =
P(landmarks,454);

const forehead =
P(landmarks,10);


/*
Khoảng cách mắt camera.
*/

const dx =
rightEye.x-leftEye.x;

const dy =
rightEye.y-leftEye.y;

const eyeDistance =
Math.sqrt(
dx*dx+dy*dy
);


/*
Nâng nhẹ vùng mặt.
*/

const lift =
eyeDistance*.04;


/*
Target.
*/

const T = {

forehead:{
x:forehead.x,
y:forehead.y-lift
},

leftEye:{
x:leftEye.x,
y:leftEye.y
},

rightEye:{
x:rightEye.x,
y:rightEye.y
},

nose:{
x:nose.x,
y:nose.y-lift*.15
},

leftMouth:{
x:leftMouth.x,
y:leftMouth.y-lift*.25
},

rightMouth:{
x:rightMouth.x,
y:rightMouth.y-lift*.25
},

chin:{
x:chin.x,
y:chin.y-lift*.3
},

leftFace:{
x:leftFace.x,
y:leftFace.y-lift*.35
},

rightFace:{
x:rightFace.x,
y:rightFace.y-lift*.35
}

};


/*
Thu nhỏ nhẹ chiều ngang.
*/

const centerX =
(
T.leftEye.x+
T.rightEye.x
)/2;

const scale =
.97;


for(
const key in T
){

T[key].x =
centerX+
(
T[key].x-centerX
)*scale;

}


/*
Xóa canvas.
*/

ctx.setTransform(
1,0,0,1,0,0
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


/*
Warp 9 vùng.
*/

triangle(
sourceImage,

S.forehead,
S.leftEye,
S.leftFace,

T.forehead,
T.leftEye,
T.leftFace
);


triangle(
sourceImage,

S.forehead,
S.rightFace,
S.rightEye,

T.forehead,
T.rightFace,
T.rightEye
);


triangle(
sourceImage,

S.leftEye,
S.nose,
S.leftFace,

T.leftEye,
T.nose,
T.leftFace
);


triangle(
sourceImage,

S.nose,
S.rightEye,
S.rightFace,

T.nose,
T.rightEye,
T.rightFace
);


triangle(
sourceImage,

S.nose,
S.leftMouth,
S.leftFace,

T.nose,
T.leftMouth,
T.leftFace
);


triangle(
sourceImage,

S.nose,
S.rightFace,
S.rightMouth,

T.nose,
T.rightFace,
T.rightMouth
);


triangle(
sourceImage,

S.leftMouth,
S.chin,
S.leftFace,

T.leftMouth,
T.chin,
T.leftFace
);


triangle(
sourceImage,

S.chin,
S.rightMouth,
S.rightFace,

T.chin,
T.rightMouth,
T.rightFace
);


triangle(
sourceImage,

S.leftEye,
S.rightEye,
S.nose,

T.leftEye,
T.rightEye,
T.nose
);


mode.textContent =
"FACE WARP";

setStatus(
"FACE WARP OK"
);

}


/* =================================================
   NORMAL MESH
================================================= */

function drawTracking(
landmarks
){

ctx.setTransform(
1,0,0,1,0,0
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.fillStyle =
"#34c759";


for(
let i=0;
i<landmarks.length;
i+=3
){

const p =
landmarks[i];


const x =
(1-p.x) *
canvas.width;

const y =
p.y *
canvas.height;


ctx.beginPath();

ctx.arc(
x,
y,
1.5,
0,
Math.PI*2
);

ctx.fill();

}


mode.textContent =
"Tracking";

setStatus(
"FACE MESH OK"
);

}


/* =================================================
   PHOTO SELECT
================================================= */

photo.addEventListener(
"change",
function(event){

const file =
event.target.files[0];

if(!file){
return;
}


const url =
URL.createObjectURL(
file
);

const img =
new Image();


img.onload =
function(){

sourceImage =
img;

photoState.textContent =
"ON";

mode.textContent =
"Photo Warp";


message.innerHTML =

"<b class='green'>" +
"ẢNH MẪU OK" +
"</b><br>" +

"Đưa khuôn mặt vào camera";


message.style.display =
"block";


setStatus(
"Ảnh mẫu đã sẵn sàng"
);

};


img.onerror =
function(){

setStatus(
"Không đọc được ảnh"
);

};


img.src =
url;

});


/* =================================================
   RESULT
================================================= */

function drawResult(
result
){

const detected =
result.faceLandmarks ||
[];


faces.textContent =
detected.length;


if(
detected.length===0
){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

setStatus(
"Đang tìm khuôn mặt..."
);

return;

}


const landmarks =
detected[0];


if(sourceImage){

drawWarp(
landmarks
);

}else{

drawTracking(
landmarks
);

}

}


/* =================================================
   REALTIME
================================================= */

function processFrame(
now
){

if(
!running ||
!landmarker ||
video.readyState<2
){

requestAnimationFrame(
processFrame
);

return;

}


cameraFrames++;


if(
now-fpsStart>=1000
){

cameraFPS.textContent =
cameraFrames;

aiFPS.textContent =
aiFrames;

cameraFrames=0;
aiFrames=0;

fpsStart=now;

}


if(
video.currentTime !==
lastVideoTime
){

lastVideoTime =
video.currentTime;


const t =
performance.now();


try{

const result =
landmarker.detectForVideo(
video,
now
);


latency.textContent =
(
performance.now()-t
).toFixed(1);


drawResult(
result
);


aiFrames++;

}catch(error){

console.error(error);

setStatus(
"FACE ERROR"
);

}

}


requestAnimationFrame(
processFrame
);

}


/* =================================================
   START
================================================= */

start.onclick =
async function(){

start.disabled =
true;


try{

/*
GIỮ NGUYÊN THỨ TỰ
ĐÃ CHẠY Ở BẢN 2.2
*/

await startCamera();

await loadAI();


running =
true;


message.style.display =
"none";

start.style.display =
"none";


requestAnimationFrame(
processFrame
);

}catch(error){

console.error(
error
);

setStatus(
"LỖI: " +
error.name
);


message.innerHTML =

"<b class='red'>" +
"FACELIVE ERROR" +
"</b><br><br>" +

error.name +
"<br>" +

error.message;


message.style.display =
"block";

start.disabled =
false;

}

};

</script>

</body>
</html>
```
