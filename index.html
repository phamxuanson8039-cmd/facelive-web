<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>FaceLive 0.2</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    background: #000;
}

#video {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    background: #000;
}

#canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

.panel {
    background: rgba(0,0,0,.58);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    border-radius: 16px;
}

#top {
    position: absolute;

    top: max(16px, env(safe-area-inset-top));
    left: 14px;
    right: 14px;

    display: flex;
    justify-content: space-between;

    z-index: 20;
}

#title {
    padding: 12px 14px;

    font-size: 20px;
    font-weight: 700;
}

#stats {
    padding: 11px 13px;

    text-align: right;

    font-size: 12px;
    line-height: 1.6;

    font-variant-numeric: tabular-nums;
}

#bottom {
    position: absolute;

    left: 14px;
    right: 14px;

    bottom: max(16px, env(safe-area-inset-bottom));

    z-index: 20;
}

#status {
    display: inline-flex;

    align-items: center;
    gap: 8px;

    padding: 10px 13px;

    margin-bottom: 12px;

    font-size: 13px;
}

#dot {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #ff3b30;
}

#dot.active {
    background: #34c759;

    box-shadow:
        0 0 12px rgba(52,199,89,.8);
}

#start {
    width: 100%;

    border: 0;

    padding: 17px;

    border-radius: 18px;

    background: rgba(255,255,255,.17);

    color: #fff;

    font-size: 17px;
    font-weight: 700;

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}

#start:active {
    transform: scale(.98);
}

#message {
    position: absolute;

    left: 20px;
    right: 20px;

    top: 50%;

    transform: translateY(-50%);

    text-align: center;

    font-size: 16px;

    line-height: 1.5;

    z-index: 10;

    pointer-events: none;
}

.error {
    color: #ff453a;
}
</style>
</head>

<body>

<div id="app">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="canvas"></canvas>

    <div id="message">
        <b>FaceLive 0.2</b><br>
        <span style="opacity:.65">
            AI Face Tracking
        </span>
    </div>

    <div id="top">

        <div id="title" class="panel">
            FaceLive
        </div>

        <div id="stats" class="panel">

            Camera:
            <b id="cameraFPS">--</b> FPS

            <br>

            AI:
            <b id="aiFPS">--</b> FPS

            <br>

            Inference:
            <b id="latency">--</b> ms

            <br>

            Faces:
            <b id="faces">0</b>

            <br>

            Resolution:
            <b id="resolution">--</b>

        </div>

    </div>

    <div id="bottom">

        <div id="status" class="panel">

            <span id="dot"></span>

            <span id="statusText">
                Camera chưa khởi động
            </span>

        </div>

        <button id="start">
            Start FaceLive
        </button>

    </div>

</div>

<script type="module">

import {
    FaceLandmarker,
    FilesetResolver
}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const start =
    document.getElementById("start");

const message =
    document.getElementById("message");

const statusText =
    document.getElementById("statusText");

const dot =
    document.getElementById("dot");

const cameraFPSElement =
    document.getElementById("cameraFPS");

const aiFPSElement =
    document.getElementById("aiFPS");

const latencyElement =
    document.getElementById("latency");

const facesElement =
    document.getElementById("faces");

const resolutionElement =
    document.getElementById("resolution");


let stream = null;

let faceLandmarker = null;

let running = false;

let lastVideoTime = -1;


/*
    FPS measurement
*/

let aiFrames = 0;

let fpsStart =
    performance.now();

let aiFPS = 0;


/*
    Camera FPS
*/

let cameraFrames = 0;

let cameraFPSStart =
    performance.now();

let cameraFPS = 0;


/*
    Load MediaPipe
*/

async function loadFaceLandmarker() {

    statusText.textContent =
        "Đang tải AI model...";

    const vision =
        await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );


    /*
        GPU delegate
    */

    faceLandmarker =
        await FaceLandmarker.createFromOptions(
            vision,
            {

                baseOptions: {

                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate: "GPU"
                },

                runningMode: "VIDEO",

                numFaces: 2,

                minFaceDetectionConfidence: 0.5,

                minFacePresenceConfidence: 0.5,

                minTrackingConfidence: 0.5,

                outputFaceBlendshapes: true,

                outputFacialTransformationMatrixes: true
            }
        );


    statusText.textContent =
        "AI model đã sẵn sàng";
}


/*
    Camera
*/

async function startCamera() {

    statusText.textContent =
        "Đang xin quyền camera...";


    stream =
        await navigator.mediaDevices.getUserMedia({

            audio: false,

            video: {

                facingMode: {
                    ideal: "user"
                },

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                },

                frameRate: {
                    ideal: 30,
                    max: 30
                }
            }
        });


    video.srcObject =
        stream;


    await video.play();


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    resolutionElement.textContent =
        video.videoWidth +
        "×" +
        video.videoHeight;


    running = true;

    dot.classList.add("active");

    message.style.display =
        "none";

    statusText.textContent =
        "FaceLive đang chạy";


    requestAnimationFrame(
        processFrame
    );
}


/*
    Draw face landmarks
*/

function drawResults(results) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const faces =
        results.faceLandmarks || [];


    facesElement.textContent =
        faces.length;


    if (faces.length === 0) {

        statusText.textContent =
            "Đang tìm khuôn mặt...";

        return;
    }


    statusText.textContent =
        faces.length === 1
            ? "1 khuôn mặt được phát hiện"
            : faces.length + " khuôn mặt được phát hiện";


    /*
        Draw landmarks
    */

    for (const landmarks of faces) {

        /*
            Draw every Nth landmark
            to reduce rendering load.
        */

        ctx.fillStyle =
            "#34c759";


        for (
            let i = 0;
            i < landmarks.length;
            i += 4
        ) {

            const point =
                landmarks[i];


            /*
                Mirror X because
                camera preview is mirrored.
            */

            const x =
                (1 - point.x) *
                canvas.width;

            const y =
                point.y *
                canvas.height;


            ctx.beginPath();

            ctx.arc(
                x,
                y,
                1.6,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        /*
            Calculate face bounds
        */

        let minX = 1;
        let minY = 1;

        let maxX = 0;
        let maxY = 0;


        for (
            const point of landmarks
        ) {

            minX =
                Math.min(
                    minX,
                    point.x
                );

            minY =
                Math.min(
                    minY,
                    point.y
                );

            maxX =
                Math.max(
                    maxX,
                    point.x
                );

            maxY =
                Math.max(
                    maxY,
                    point.y
                );
        }


        const x =
            (1 - maxX) *
            canvas.width;

        const y =
            minY *
            canvas.height;

        const width =
            (maxX - minX) *
            canvas.width;

        const height =
            (maxY - minY) *
            canvas.height;


        ctx.strokeStyle =
            "#34c759";

        ctx.lineWidth = 3;


        ctx.beginPath();

        ctx.ellipse(

            x + width / 2,

            y + height / 2,

            Math.abs(width) / 2,

            height / 2,

            0,

            0,

            Math.PI * 2

        );

        ctx.stroke();
    }
}


/*
    Main realtime loop
*/

function processFrame(now) {

    if (
        !running ||
        !faceLandmarker ||
        video.readyState < 2
    ) {

        requestAnimationFrame(
            processFrame
        );

        return;
    }


    /*
        Camera FPS
    */

    cameraFrames++;


    if (
        now -
        cameraFPSStart >=
        1000
    ) {

        cameraFPS =
            cameraFrames /
            ((now -
                cameraFPSStart) /
                1000);


        cameraFPSElement.textContent =
            cameraFPS.toFixed(1);


        cameraFrames = 0;

        cameraFPSStart =
            now;
    }


    /*
        Only process a new video frame.
    */

    if (
        video.currentTime !==
        lastVideoTime
    ) {

        lastVideoTime =
            video.currentTime;


        const inferenceStart =
            performance.now();


        try {

            const results =
                faceLandmarker.detectForVideo(
                    video,
                    now
                );


            const inferenceTime =
                performance.now() -
                inferenceStart;


            latencyElement.textContent =
                inferenceTime.toFixed(1);


            drawResults(
                results
            );


            aiFrames++;


            if (
                now -
                fpsStart >=
                1000
            ) {

                aiFPS =
                    aiFrames /
                    ((now -
                        fpsStart) /
                        1000);


                aiFPSElement.textContent =
                    aiFPS.toFixed(1);


                aiFrames = 0;

                fpsStart =
                    now;
            }

        } catch (error) {

            console.error(
                "FaceLive AI error:",
                error
            );

            statusText.textContent =
                "AI error: " +
                error.message;
        }
    }


    requestAnimationFrame(
        processFrame
    );
}


/*
    START
*/

start.addEventListener(
    "click",
    async () => {

        start.disabled = true;

        try {

            /*
                Camera first.
                This is important for iOS Safari.
            */

            await startCamera();


            /*
                Then load AI.
            */

            await loadFaceLandmarker();


            statusText.textContent =
                "FaceLive AI đang chạy";


            start.style.display =
                "none";

        } catch (error) {

            console.error(
                error
            );


            dot.classList.remove(
                "active"
            );


            statusText.textContent =
                "Lỗi: " +
                error.name;


            message.innerHTML =
                "<b>FaceLive Error</b><br>" +
                "<span class='error'>" +
                error.message +
                "</span>";


            message.style.display =
                "block";


            start.disabled =
                false;
        }
    }
);

</script>

</body>
</html>
