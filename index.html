<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive AI Swap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{z-index:0}canvas{z-index:1;pointer-events:none}.ui{position:fixed;inset:0;z-index:5;padding:12px;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:700}.stats{font-size:11px;line-height:1.55;text-align:right}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:auto}.button,input[type=file]{width:100%;padding:15px;border:0;border-radius:14px;margin-top:8px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}.button:disabled{opacity:.5}input[type=file]{background:#252525;font-weight:400}.notice{font-size:12px;line-height:1.45;margin-top:8px}.hide{display:none!important}#sourcePreview{position:fixed;right:12px;bottom:220px;width:82px;height:104px;object-fit:cover;border:2px solid #34c759;border-radius:12px;z-index:6}input[type=range]{width:100%}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="out"></canvas><img id="sourcePreview" class="hide" alt="Ảnh mẫu"><div class="ui"><div class="top"><div class="panel title">FaceLive AI Swap</div><div class="panel stats">Camera <b id="fps">--</b> FPS<br>Swap <b id="sfps">--</b> FPS<br>AI <b id="lat">--</b> ms<br>Face <b id="face">0</b><br>Engine <b id="engine">AI INSwapper</b></div></div><div class="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" class="button">START CAMERA</button><input id="file" type="file" accept="image/*"><div id="notice" class="panel notice">Chọn ảnh nguồn sau khi camera hoạt động. Pipeline AI theo kiểu Deep-Live-Cam.</div><div id="controls" class="panel hide">Blend <b id="bv">92</b>%<input id="blend" type="range" min="70" max="100" value="92"></div></div></div><script type="module">
const $=id=>document.getElementById(id),video=$('video'),canvas=$('out'),ctx=canvas.getContext('2d',{alpha:true}),start=$('start'),file=$('file'),status=$('status'),preview=$('sourcePreview'),controls=$('controls'),blend=$('blend'),bv=$('bv'),fps=$('fps'),sfps=$('sfps'),lat=$('lat'),face=$('face');
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const ORT_URL='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/+esm';
const ARC_URL='https://huggingface.co/facefusion/models-3.0.0/resolve/main/arcface_w600k_r50.onnx?download=true';
const SWAP_URL='https://huggingface.co/hacksider/deep-live-cam/resolve/main/inswapper_128_fp16.onnx?download=true';
const EMAP_URL='https://raw.githubusercontent.com/somanchiu/ReSwapper/main/emap.npy';
const IDS=[33,263,1,61,291];
const T112=[[38.2946,51.6963],[73.5318,51.5014],[56.0252,71.7366],[41.5493,92.3655],[70.7299,92.2041]],T128=T112.map(p=>[p[0]*128/112,p[1]*128/112]);
let FaceLandmarker,FilesetResolver,vision,ort,arcSession,swapSession,emap,sourceImage,sourceReady=false,running=false,preparing=false,lastVideoTime=-1,lastSwap=0,frames=0,swaps=0,t0=performance.now(),smoothPts=null,sourceEmbedding=null;
const setStatus=s=>status.textContent='● '+s;blend.oninput=()=>bv.textContent=blend.value;
function pts(f,w,h){return IDS.map(i=>[f[i].x*w,f[i].y*h])}
function sim5(src,dst){let sx=0,sy=0,dx=0,dy=0;for(let i=0;i<5;i++){sx+=src[i][0];sy+=src[i][1];dx+=dst[i][0];dy+=dst[i][1]}sx/=5;sy/=5;dx/=5;dy/=5;let a=0,b=0,n=0;for(let i=0;i<5;i++){let x=src[i][0]-sx,y=src[i][1]-sy,X=dst[i][0]-dx,Y=dst[i][1]-dy;a+=x*X+y*Y;b+=x*Y-y*X;n+=x*x+y*y}let c=a/n,d=b/n;return[c,d,-d,c,dx-c*sx+d*sy,dy-d*sx-c*sy]}
function warpFive(img,p,size){let out=document.createElement('canvas');out.width=out.height=size;let g=out.getContext('2d'),scale=size/112,t=T112.map(q=>[q[0]*scale,q[1]*scale]),m=sim5(p,t);g.setTransform(...m);g.drawImage(img,0,0);g.setTransform(1,0,0,1,0,0);return out}
function imageTensor(c,normalize){let g=c.getContext('2d'),id=g.getImageData(0,0,c.width,c.height).data,n=c.width*c.height,x=new Float32Array(3*n);for(let i=0;i<n;i++){let r=id[i*4],gg=id[i*4+1],b=id[i*4+2];if(normalize){x[i]=(b-127.5)/127.5;x[n+i]=(gg-127.5)/127.5;x[2*n+i]=(r-127.5)/127.5}else{x[i]=b/255;x[n+i]=gg/255;x[2*n+i]=r/255}}return new ort.Tensor('float32',x,[1,3,c.height,c.width])}
function l2(a){let s=0;for(let v of a)s+=v*v;s=Math.sqrt(s)||1;let o=new Float32Array(a.length);for(let i=0;i<a.length;i++)o[i]=a[i]/s;return o}
function parseNpy(buf){let u=new Uint8Array(buf);if(u[0]!==147||u[1]!==78||u[2]!==85||u[3]!==77||u[4]!==80||u[5]!==89)throw Error('EMAP NPY không hợp lệ');let ver=u[6],hl=ver===1?u[8]|u[9]<<8:u[8]|u[9]<<8|u[10]<<16|u[11]<<24,hs=ver===1?10:12,header=new TextDecoder().decode(u.slice(hs,hs+hl)),shape=header.match(/'shape':\s*\(([^)]*)\)/)[1].split(',').map(s=>parseInt(s.trim())).filter(Number.isFinite),off=hs+hl,n=shape.reduce((a,b)=>a*b,1);return new Float32Array(new Float32Array(buf,off,n))}
function matVec(v,m,rows,cols){let o=new Float32Array(cols);for(let j=0;j<cols;j++){let s=0;for(let i=0;i<rows;i++)s+=v[i]*m[i*cols+j];o[j]=s}return o}
function outputTensorToCanvas(t){let d=t.data,n=128*128,c=document.createElement('canvas');c.width=c.height=128;let g=c.getContext('2d'),id=g.createImageData(128,128);for(let i=0;i<n;i++){id.data[i*4]=Math.max(0,Math.min(255,Math.round((d[i]+1)*127.5)));id.data[i*4+1]=Math.max(0,Math.min(255,Math.round((d[n+i]+1)*127.5)));id.data[i*4+2]=Math.max(0,Math.min(255,Math.round((d[2*n+i]+1)*127.5)));id.data[i*4+3]=255}g.putImageData(id,0,0);return c}
function invert(m){let a=m[0],b=m[1],c=m[2],d=m[3],e=m[4],f=m[5],det=a*d-b*c;return[d/det,-b/det,-c/det,a/det,(c*f-d*e)/det,(b*e-a*f)/det]}
function corners(q,m){return q.map(p=>[m[0]*p[0]+m[2]*p[1]+m[4],m[1]*p[0]+m[3]*p[1]+m[5]])}
function paste(swapped,targetPts){let m=sim5(T128,targetPts),im=invert(m),q=corners([[0,0],[128,0],[128,128],[0,128]],im),x=Math.max(0,Math.floor(Math.min(...q.map(p=>p[0])))-4),y=Math.max(0,Math.floor(Math.min(...q.map(p=>p[1])))-4),x2=Math.min(canvas.width,Math.ceil(Math.max(...q.map(p=>p[0])))+4),y2=Math.min(canvas.height,Math.ceil(Math.max(...q.map(p=>p[1])))+4),w=x2-x,h=y2-y;if(w<4||h<4)return;let c=document.createElement('canvas');c.width=w;c.height=h;let g=c.getContext('2d');g.setTransform(im[0],im[1],im[2],im[3],im[4]-x,im[5]-y);g.drawImage(swapped,0,0);g.setTransform(1,0,0,1,0,0);let mask=document.createElement('canvas');mask.width=w;mask.height=h;let mg=mask.getContext('2d');mg.save();mg.setTransform(im[0],im[1],im[2],im[3],im[4]-x,im[5]-y);mg.beginPath();mg.ellipse(64,64,59,62,0,0,Math.PI*2);mg.fill();mg.restore();g.globalCompositeOperation='destination-in';g.drawImage(mask,0,0);ctx.globalAlpha=+blend.value/100;ctx.drawImage(c,x,y);ctx.globalAlpha=1}
async function initVision(){if(!FaceLandmarker){let m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');FaceLandmarker=m.FaceLandmarker;FilesetResolver=m.FilesetResolver}if(!vision){setStatus('Đang tải Face Landmarker…');let v=await FilesetResolver.forVisionTasks(MP_WASM);vision=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1})}}
async function initAI(){if(arcSession&&swapSession&&emap)return;ort=ort||await import(ORT_URL);ort.env.wasm.numThreads=1;ort.env.logLevel='error';setStatus('Đang tải ArcFace…');let opts={graphOptimizationLevel:'all',executionProviders:['webgpu','webgl','wasm']};try{arcSession=await ort.InferenceSession.create(ARC_URL,opts)}catch(e){console.warn(e);arcSession=await ort.InferenceSession.create(ARC_URL,{graphOptimizationLevel:'all',executionProviders:['wasm']})}setStatus('Đang tải INSwapper FP16 277MB…');try{swapSession=await ort.InferenceSession.create(SWAP_URL,opts)}catch(e){console.warn(e);swapSession=await ort.InferenceSession.create(SWAP_URL,{graphOptimizationLevel:'all',executionProviders:['wasm']})}let r=await fetch(EMAP_URL);emap=parseNpy(await r.arrayBuffer());if(emap.length!==262144)throw Error('EMAP kích thước không đúng');setStatus('AI models ready')}
async function embeddingFromSource(img,p){let c=warpFive(img,p,112),t=imageTensor(c,true),name=arcSession.inputNames[0],o=await arcSession.run({[name]:t}),e=l2(o[arcSession.outputNames[0]].data),z=matVec(e,emap,512,512);return l2(z)}
async function prepare(){if(!sourceImage||preparing)return;preparing=true;sourceReady=false;smoothPts=null;try{await initVision();await vision.setOptions({runningMode:'IMAGE'});setStatus('Đang nhận diện ảnh nguồn…');let r=vision.detect(sourceImage),fs=r.faceLandmarks||[];if(!fs.length)throw Error('Ảnh nguồn không có khuôn mặt');let p=pts(fs[0],sourceImage.naturalWidth,sourceImage.naturalHeight);await initAI();setStatus('Đang tạo identity embedding…');sourceEmbedding=await embeddingFromSource(sourceImage,p);sourceReady=true;controls.classList.remove('hide');setStatus('AI SOURCE READY — đưa mặt vào camera')}catch(e){console.error(e);setStatus('AI SOURCE ERROR: '+(e.message||e))}finally{preparing=false;try{await vision?.setOptions({runningMode:'VIDEO'})}catch{}}}
file.onchange=()=>{let f=file.files?.[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{sourceImage=im;preview.src=u;preview.classList.remove('hide');prepare()};im.src=u}
function smooth(p){if(!smoothPts){smoothPts=p.map(q=>q.slice());return smoothPts}let k=.42;for(let i=0;i<p.length;i++){smoothPts[i][0]+=((p[i][0]-smoothPts[i][0])*k);smoothPts[i][1]+=((p[i][1]-smoothPts[i][1])*k)}return smoothPts}
async function swapFrame(f){if(!sourceReady||!sourceEmbedding||preparing)return;let t0i=performance.now(),p=smooth(pts(f,canvas.width,canvas.height)),target=warpFive(video,p,128),tensor=imageTensor(target,false),feed={};for(let n of swapSession.inputNames){let md=swapSession.inputMetadata[n],dims=String(md?.dimensions||'');feed[n]=dims.includes('512')?new ort.Tensor('float32',sourceEmbedding,[1,512]):tensor}let out=await swapSession.run(feed),sw=outputTensorToCanvas(out[swapSession.outputNames[0]]);ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);paste(sw,p);lat.textContent=(performance.now()-t0i).toFixed(0);swaps++}
function loop(now){if(!running)return;frames++;if(now-t0>1000){fps.textContent=frames;sfps.textContent=swaps;frames=swaps=0;t0=now}if(video.readyState>=2&&video.currentTime!==lastVideoTime&&!preparing){lastVideoTime=video.currentTime;let fs=vision.detectForVideo(video,now).faceLandmarks||[];face.textContent=fs.length;if(fs.length&&sourceReady){if(now-lastSwap>180){lastSwap=now;swapFrame(fs[0]).catch(e=>setStatus('AI FRAME ERROR: '+e.message))}setStatus('LIVE AI INSwapper')}else if(fs.length){smoothPts=null;setStatus('Camera OK — chọn ảnh nguồn')}else{smoothPts=null;ctx.clearRect(0,0,canvas.width,canvas.height);setStatus('Đang tìm khuôn mặt…')}}requestAnimationFrame(loop)}
start.onclick=async()=>{start.disabled=true;try{setStatus('Đang mở camera…');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:24}}});video.srcObject=s;await video.play();canvas.width=video.videoWidth||960;canvas.height=video.videoHeight||540;await initVision();running=true;start.textContent='CAMERA ON';$('notice').classList.add('hide');requestAnimationFrame(loop)}catch(e){console.error(e);setStatus('LỖI CAMERA/AI: '+e.message);start.disabled=false}};setStatus('Sẵn sàng — START CAMERA rồi chọn ảnh nguồn');
</script></body></html>
