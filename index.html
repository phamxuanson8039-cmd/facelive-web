<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>FaceLive 0.5 Diagnostic</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:-apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

#app{
    padding:20px;
}

h2{
    margin:20px 0;
}

button{
    width:100%;
    padding:18px;
    border:0;
    border-radius:16px;
    background:#fff;
    color:#000;
    font-size:18px;
    font-weight:700;
}

#status{
    margin-top:20px;
    padding:18px;
    background:#181818;
    border-radius:15px;
    line-height:1.7;
    white-space:pre-wrap;
}

#video{
    display:none;
    width:100%;
    margin-top:20px;
    border-radius:15px;
    background:#111;
}
</style>
</head>

<body>

<div id="app">

<h2>FaceLive 0.5</h2>

<button id="start">
START CAMERA
</button>

<div id="status">
CHƯA KIỂM TRA
</div>

<video
id="video"
autoplay
playsinline
muted>
</video>

</div>

<script>

(function(){

var button =
document.getElementById("start");

var status =
document.getElementById("status");

var video =
document.getElementById("video");


function setStatus(text){

status.innerHTML = text;

}


/*
================================
STEP 1
================================
*/

button.addEventListener(
"click",
function(){

setStatus(
"① JAVASCRIPT OK\n\n" +
"Đang kiểm tra Camera API..."
);


/*
================================
STEP 2
================================
*/

if(
!navigator.mediaDevices
){

setStatus(
"❌ CAMERA API KHÔNG TỒN TẠI"
);

return;

}


if(
!navigator.mediaDevices.getUserMedia
){

setStatus(
"❌ getUserMedia KHÔNG TỒN TẠI"
);

return;

}


setStatus(
"② CAMERA API OK\n\n" +
"Đang xin quyền camera..."
);


/*
================================
STEP 3
================================
*/

navigator.mediaDevices
.getUserMedia({

video:{
facingMode:"user"
},

audio:false

})

.then(
function(stream){

video.srcObject =
stream;

video.style.display =
"block";


return video.play();

})

.then(
function(){

setStatus(

"③ CAMERA OK\n\n" +

"JavaScript: OK\n" +

"Camera API: OK\n\n" +

"FaceLive có thể tiếp tục."

);

})

.catch(
function(error){

setStatus(

"❌ CAMERA ERROR\n\n" +

"Name: " +
error.name +

"\n\nMessage: " +
error.message

);

});

});

})();

</script>

</body>
</html>
