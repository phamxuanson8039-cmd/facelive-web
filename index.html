<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,
maximum-scale=1,viewport-fit=cover">

<title>FaceLive TEST</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

#app{
    padding:25px;
}

button,label{
    display:block;
    width:100%;
    padding:18px;
    margin-top:15px;
    border:0;
    border-radius:15px;
    background:#333;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    text-align:center;
}

#result{
    margin-top:30px;
    font-size:18px;
}

input{
    display:none;
}
</style>
</head>

<body>

<div id="app">

<h1>FaceLive TEST</h1>

<button id="start">
START FACELIVE
</button>

<label for="photo">
📷 CHỌN ẢNH
</label>

<input
id="photo"
type="file"
accept="image/*">

<div id="result">
JavaScript đang kiểm tra...
</div>

</div>

<script>

const result =
document.getElementById("result");

const start =
document.getElementById("start");

const photo =
document.getElementById("photo");


result.textContent =
"① JAVASCRIPT OK";


start.onclick =
function(){

result.textContent =
"② BUTTON OK";

};


photo.onchange =
function(){

if(
photo.files &&
photo.files.length
){

result.textContent =
"③ PHOTO INPUT OK: " +
photo.files[0].name;

}else{

result.textContent =
"③ Không có ảnh";

}

};

</script>

</body>
</html>
