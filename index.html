<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FaceLive Camera Test</title>
<style>
body{font-family:-apple-system;background:#111;color:white;padding:20px}
button{font-size:20px;padding:16px;width:100%;border-radius:12px}
video{width:100%;margin-top:20px;border-radius:16px}
#log{white-space:pre-wrap;margin-top:20px;color:#0f0}
</style>
</head>

<body>

<h2>FaceLive Camera Test</h2>

<button id="start">START CAMERA</button>

<video id="video" autoplay playsinline muted></video>

<div id="log">Waiting...</div>

<script>
const button = document.getElementById("start");
const video = document.getElementById("video");
const log = document.getElementById("log");

function show(text){
    log.textContent = text;
}

button.onclick = async function(){

    show("Checking browser...");

    try {

        if (!window.isSecureContext) {
            throw new Error(
                "NOT SECURE: page is not HTTPS"
            );
        }

        if (!navigator.mediaDevices) {
            throw new Error(
                "mediaDevices API unavailable"
            );
        }

        if (!navigator.mediaDevices.getUserMedia) {
            throw new Error(
                "getUserMedia unavailable"
            );
        }

        show("Requesting camera permission...");

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"user",
                    width:{ideal:1280},
                    height:{ideal:720},
                    frameRate:{ideal:30}
                },
                audio:false
            });

        video.srcObject = stream;

        await video.play();

        const track = stream.getVideoTracks()[0];
        const settings = track.getSettings();

        show(
            "CAMERA OK\n\n" +
            "Camera: " + track.label + "\n" +
            "Resolution: " +
            settings.width + " × " +
            settings.height + "\n" +
            "FPS: " +
            (settings.frameRate || "unknown")
        );

    } catch(error) {

        show(
            "CAMERA ERROR\n\n" +
            "Name: " + error.name + "\n" +
            "Message: " + error.message
        );

        console.error(error);
    }
};
</script>

</body>
</html>
