<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FaceLive 3.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}#video,#canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#video{transform:scaleX(-1);background:#000}#canvas{pointer-events:none}#ui{position:fixed;inset:0;z-index:5;padding:14px;pointer-events:none}.panel{background:rgba(0,0,0,.75);border-radius:14px;padding:10px;pointer-events:auto}#head{display:flex;justify-content:space-between;gap:10px}#title{font-weight:700;font-size:18px}#stats{font-size:12px;line-height:1.6;text-align:right}#bottom{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:auto}.status{pointer-events:auto}button,input[type=file]{width:100%;border:0;border-radius:14px;padding:15px;margin-top:8px;font-size:16px;font-weight:700;background:#252525;color:#fff;pointer-events:auto;touch-action:manipulation}button{background:#1769ff}button:disabled{opacity:.5}input[type=file]{font-size:14px;font-weight:400}#controls{display:none;margin-top:8px}.row{font-size:12px;margin-top:6px}input[type=range]{width:100%;pointer-events:auto}#preview{display:none;position:fixed;right:14px;bottom:220px;width:82px;height:104px;object-fit:cover;border-radius:12px;border:2px solid #34c759;z-index:6}#msg{position:fixed;left:20px;right:20px;top:50%;transform:translateY(-50%);text-align:center;line-height:1.5;z-index:4;pointer-events:none}.ok{color:#34c759}.err{color:#ff453a}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><img id="preview" alt="Ảnh mẫu">
<div id="ui"><div id="head"><div id="title" class="panel">FaceLive 3.2</div><div id="stats" class="panel">Camera <b id="cfps">--</b> FPS<br>AI <b id="afps">--</b> FPS<br>Latency <b id="lat">--</b> ms<br>Camera Face <b id="faces">0</b><br>Photo Face <b id="pf">0</b></div></div>
<div id="msg"><b>FaceLive 3.2</b><br><span style="opacity:.7">iPhone Face Warp</span></div>
<div id="bottom"><div id="status" class="panel status">● Sẵn sàng — bấm START</div><button id="start" type="button">START FACELIVE</button><input id="file" type="file" accept="image/*"><div id="controls" class="panel"><div class="row">Warp: <b id="wv">72</b>%</div><input id="warp" type="range" min="0" max="100" value="72"><div class="row">Blend: <b id="bv">82</b>%</div><input id="blend" type="range" min="30" max="100" value="82"><div class="row">Feather: <b id="fv">78</b>%</div><input id="feather" type="range" min="20" max="100" value="78"></div></div></div>
<script>
(function(){
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d'),start=$('start'),file=$('file'),status=$('status'),msg=$('msg'),preview=$('preview'),cfps=$('cfps'),afps=$('afps'),lat=$('lat'),faces=$('faces'),pf=$('pf'),controls=$('controls'),warp=$('warp'),blend=$('blend'),feather=$('feather'),wv=$('wv'),bv=$('bv'),fv=$('fv');
let FL=null,FR=null,cam=null,imgLM=null,stream=null,running=false,last=-1,src=null,srcPts=null,n=0,ai=0,t0=performance.now();
function S(x){status.textContent='● '+x}
warp.oninput=()=>wv.textContent=warp.value;blend.oninput=()=>bv.textContent=blend.value;feather.oninput=()=>fv.textContent=feather.value;
window.addEventListener('error',e=>{S('JS ERROR: '+e.message);msg.innerHTML='<b class="err">JS ERROR</b><br>'+e.message;msg.style.display='block'});
window.addEventListener('unhandledrejection',e=>{const x=e.reason?.message||String(e.reason);S('ERROR: '+x);msg.innerHTML='<b class="err">ERROR</b><br>'+x;msg.style.display='block'});
async function openCamera(){S('Đang xin quyền Camera...');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Camera API không khả dụng. Hãy mở bằng Safari và HTTPS.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}});video.srcObject=stream;await video.play();await new Promise(r=>video.videoWidth?r():video.addEventListener('loadedmetadata',r,{once:true}));canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||720;S('CAMERA OK')}
async function loadAI(){S('Đang tải Face AI...');const m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');FL=m.FaceLandmarker;FR=m.FilesetResolver;if(!FL||!FR)throw Error('Không tải được MediaPipe');const v=await FR.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');const base={modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'};try{S('Đang khởi tạo GPU...');cam=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'GPU'},runningMode:'VIDEO',numFaces:1,minFaceDetectionConfidence:.45,minFacePresenceConfidence:.45,minTrackingConfidence:.45});imgLM=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'GPU'},runningMode:'IMAGE',numFaces:1,minFaceDetectionConfidence:.35,minFacePresenceConfidence:.35,minTrackingConfidence:.35})}catch(e){S('GPU lỗi — thử CPU...');cam=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'CPU'},runningMode:'VIDEO',numFaces:1,minFaceDetectionConfidence:.45,minFacePresenceConfidence:.45,minTrackingConfidence:.45});imgLM=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'CPU'},runningMode:'IMAGE',numFaces:1,minFaceDetectionConfidence:.35,minFacePresenceConfidence:.35,minTrackingConfidence:.35})}S('FACE AI OK')}
function P(a,i,w,h){const p=a[i];return{x:(1-p.x)*w,y:p.y*h}}
function aff(a,b,c,d,e,f){const z=a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y);if(Math.abs(z)<1e-6)return null;return[(d.x*(b.y-c.y)+e.x*(c.y-a.y)+f.x*(a.y-b.y))/z,(d.y*(b.y-c.y)+e.y*(c.y-a.y)+f.y*(a.y-b.y))/z,(d.x*(c.x-b.x)+e.x*(a.x-c.x)+f.x*(b.x-a.x))/z,(d.y*(c.x-b.x)+e.y*(a.x-c.x)+f.y*(b.x-a.x))/z,(d.x*(b.x*c.y-c.x*b.y)+e.x*(c.x*a.y-a.x*c.y)+f.x*(a.x*b.y-b.x*a.y))/z,(d.y*(b.x*c.y-c.x*b.y)+e.y*(c.x*a.y-a.x*c.y)+f.y*(a.x*b.y-b.x*a.y))/z]}
const tris=[[10,33,234],[10,234,93],[10,93,109],[10,109,338],[10,338,297],[10,297,454],[10,454,263],[33,160,1],[160,158,1],[158,133,1],[263,385,1],[385,362,1],[362,387,1],[234,93,132],[93,162,132],[132,58,172],[454,323,361],[323,327,361],[361,288,397],[33,1,234],[263,454,1],[61,91,1],[91,181,1],[181,84,17],[314,405,291],[405,321,291],[291,17,314],[61,152,234],[291,454,152],[152,234,172],[152,172,397],[152,397,454]];
function tri(im,S,T,q,a){const m=aff(S[q[0]],S[q[1]],S[q[2]],T[q[0]],T[q[1]],T[q[2]]);if(!m)return;ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.moveTo(T[q[0]].x,T[q[0]].y);ctx.lineTo(T[q[1]].x,T[q[1]].y);ctx.lineTo(T[q[2]].x,T[q[2]].y);ctx.closePath();ctx.clip();ctx.setTransform(...m);ctx.drawImage(im,0,0);ctx.restore()}
function warpFace(cp){if(!src||!srcPts)return;const S=srcPts.map((_,i)=>P(srcPts,i,src.naturalWidth,src.naturalHeight)),C=cp.map((_,i)=>P(cp,i,canvas.width,canvas.height)),se=Math.hypot(S[263].x-S[33].x,S[263].y-S[33].y),te=Math.hypot(C[263].x-C[33].x,C[263].y-C[33].y);if(se<2||te<2)return;const k=te/se,scx=(S[33].x+S[263].x)/2,scy=(S[33].y+S[263].y)/2,tcx=(C[33].x+C[263].x)/2,tcy=(C[33].y+C[263].y)/2,r=+warp.value/100,T=C.map((p,i)=>{const x=tcx+(S[i].x-scx)*k,y=tcy+(S[i].y-scy)*k;return{x:x*(1-r)+p.x*r,y:y*(1-r)+p.y*r}});for(const q of tris)tri(src,S,T,q,+blend.value/100);const f=+feather.value/100;ctx.save();ctx.globalCompositeOperation='destination-out';const g=ctx.createRadialGradient(tcx,tcy,te*.8,tcx,tcy,te*1.8);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.75,'rgba(0,0,0,0)');g.addColorStop(.9,`rgba(0,0,0,${.5*f})`);g.addColorStop(1,'rgba(0,0,0,1)');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore()}
file.onchange=async()=>{try{const f=file.files&&file.files[0];if(!f||!imgLM)return;S('Đang nhận diện ảnh...');const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{src=im;preview.src=u;preview.style.display='block';const r=imgLM.detect(im),p=r.faceLandmarks||[];pf.textContent=p.length;if(!p.length){srcPts=null;controls.style.display='none';S('Không thấy mặt trong ảnh');return}srcPts=p[0];controls.style.display='block';S('PHOTO FACE OK');msg.innerHTML='<b class="ok">PHOTO FACE OK</b><br>Ảnh mẫu đã sẵn sàng';msg.style.display='block';setTimeout(()=>msg.style.display='none',900)};im.onerror=()=>S('Lỗi đọc ảnh');im.src=u}catch(e){S('PHOTO ERROR: '+e.message)}};
function loop(now){if(!running)return;n++;if(now-t0>=1000){cfps.textContent=n;afps.textContent=ai;n=ai=0;t0=now}if(cam&&video.readyState>=2&&video.currentTime!==last){last=video.currentTime;const t=performance.now();try{const r=cam.detectForVideo(video,now),p=r.faceLandmarks||[];lat.textContent=(performance.now()-t).toFixed(1);faces.textContent=p.length;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);if(p.length&&srcPts){warpFace(p[0]);S('FACE WARP OK')}else if(p.length)S('FACE TRACKING OK');else S('Đang tìm khuôn mặt...');ai++}catch(e){S('AI ERROR: '+e.message)}}requestAnimationFrame(loop)}
start.addEventListener('click',async()=>{if(running)return;start.disabled=true;S('ĐANG KHỞI ĐỘNG...');msg.innerHTML='<b>ĐANG KHỞI ĐỘNG</b><br>Xin quyền camera và tải Face AI...';msg.style.display='block';try{await openCamera();await loadAI();running=true;start.style.display='none';msg.style.display='none';requestAnimationFrame(loop)}catch(e){console.error(e);S('LỖI: '+e.message);msg.innerHTML='<b class="err">FACELIVE ERROR</b><br>'+e.message;msg.style.display='block';start.disabled=false}});
})();
</script>
</body>
</html>
