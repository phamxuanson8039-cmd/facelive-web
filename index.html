<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FaceLive iPhone</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
#video,#canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#video{transform:scaleX(-1)}#canvas{pointer-events:none}
#ui{position:fixed;inset:0;padding:14px;z-index:5;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}
#head{display:flex;justify-content:space-between;gap:8px}#title{font-size:18px;font-weight:700}#stats{font-size:12px;line-height:1.6;text-align:right}
#bottom{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:auto}
button,input[type=file]{width:100%;border:0;border-radius:14px;padding:15px;margin-top:8px;font-size:16px;background:#252525;color:#fff}button{background:#1769ff;font-weight:700}button:disabled{opacity:.5}
#controls{display:none;margin-top:8px}.row{font-size:12px;margin:6px 0}input[type=range]{width:100%}#preview{display:none;position:fixed;right:14px;bottom:220px;width:82px;height:104px;object-fit:cover;border-radius:12px;border:2px solid #34c759;z-index:6}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><img id="preview" alt="Ảnh mẫu">
<div id="ui"><div id="head"><div id="title" class="panel">FaceLive iPhone</div><div id="stats" class="panel">Camera <b id="cfps">--</b> FPS<br>AI <b id="afps">--</b> FPS<br>Latency <b id="lat">--</b> ms<br>Camera Face <b id="faces">0</b><br>Photo Face <b id="pf">0</b><br>Mesh <b id="mesh">--</b></div></div>
<div id="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" type="button">START FACELIVE</button><input id="file" type="file" accept="image/*">
<div id="controls" class="panel"><div class="row">Warp: <b id="wv">72</b>%</div><input id="warp" type="range" min="0" max="100" value="72"><div class="row">Blend: <b id="bv">82</b>%</div><input id="blend" type="range" min="30" max="100" value="82"><div class="row">Feather: <b id="fv">78</b>%</div><input id="feather" type="range" min="20" max="100" value="78"></div></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d'),start=$('start'),file=$('file'),status=$('status'),preview=$('preview'),controls=$('controls'),cfps=$('cfps'),afps=$('afps'),lat=$('lat'),faces=$('faces'),photoFaces=$('pf'),meshLabel=$('mesh'),warpCtl=$('warp'),blendCtl=$('blend'),featherCtl=$('feather'),wv=$('wv'),bv=$('bv'),fv=$('fv');
let FaceLandmarker,FilesetResolver,cameraAI,imageAI,Delaunator=null,sourceImage,sourcePoints,triangles=[],running=false,lastTime=-1,cameraCount=0,aiCount=0,fpsStart=performance.now(),lastWarp=0;
const FACE_OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const FALLBACK_TRIS=[[10,33,234],[10,234,93],[10,93,109],[10,109,338],[10,338,297],[10,297,454],[10,454,263],[33,160,1],[160,158,1],[158,133,1],[263,385,1],[385,362,1],[362,387,1],[234,93,132],[93,162,132],[132,58,172],[454,323,361],[323,327,361],[361,288,397],[33,1,234],[263,454,1],[61,91,1],[91,181,1],[181,84,17],[314,405,291],[405,321,291],[291,17,314],[61,152,234],[291,454,152],[152,234,172],[152,172,397],[152,397,454]];
const setStatus=s=>status.textContent='● '+s;
warpCtl.oninput=()=>wv.textContent=warpCtl.value;blendCtl.oninput=()=>bv.textContent=blendCtl.value;featherCtl.oninput=()=>fv.textContent=featherCtl.value;

async function importAI(){
 setStatus('Đang tải Face AI...');
 const urls=['https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs','https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs','https://esm.sh/@mediapipe/tasks-vision@0.10.14'];
 let mod=null;
 for(const url of urls){try{mod=await import(url);if(mod.FaceLandmarker&&mod.FilesetResolver)break}catch(e){}}
 if(!mod||!mod.FaceLandmarker||!mod.FilesetResolver)throw new Error('Không tải được Face AI trên iPhone.');
 FaceLandmarker=mod.FaceLandmarker;FilesetResolver=mod.FilesetResolver;
 try{const dm=await import('https://esm.sh/delaunator@5.0.1');Delaunator=dm.default||dm}catch(e){Delaunator=null}
 const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
 const model='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
 try{
  cameraAI=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:model,delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});
  imageAI=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:model,delegate:'GPU'},runningMode:'IMAGE',numFaces:1,outputFaceBlendshapes:true});
 }catch(e){
  cameraAI=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:model,delegate:'CPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});
  imageAI=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:model,delegate:'CPU'},runningMode:'IMAGE',numFaces:1,outputFaceBlendshapes:true});
 }
 setStatus('FACE AI OK');
}

async function openCamera(){
 setStatus('Đang mở camera...');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Camera API không được hỗ trợ');
 const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}});
 v.srcObject=stream;await v.play();if(!v.videoWidth)await new Promise(resolve=>v.addEventListener('loadedmetadata',resolve,{once:true}));
 c.width=v.videoWidth||1280;c.height=v.videoHeight||720;setStatus('CAMERA OK');
}
function point(q,i,w,h){return{x:(1-q[i].x)*w,y:q[i].y*h}}
function makeMesh(points,w,h){return points.map((_,i)=>point(points,i,w,h))}
function inside(px,py,poly){let hit=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y,inter=((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi);if(inter)hit=!hit}return hit}
function buildDenseTriangles(){
 triangles=[];
 if(!Delaunator||!sourcePoints){triangles=FALLBACK_TRIS.map(t=>t.slice());return}
 const ids=[];for(let i=0;i<Math.min(468,sourcePoints.length);i+=2)ids.push(i);for(const i of FACE_OVAL){if(i<sourcePoints.length&&!ids.includes(i))ids.push(i)}for(const i of [1,33,61,91,133,152,172,181,234,263,291,314,321,362,385,397,405,454])if(i<sourcePoints.length&&!ids.includes(i))ids.push(i);
 const pts=ids.map(i=>[sourcePoints[i].x,sourcePoints[i].y]);const d=Delaunator.from(pts);const poly=FACE_OVAL.filter(i=>i<sourcePoints.length).map(i=>({x:sourcePoints[i].x,y:sourcePoints[i].y}));
 for(let k=0;k<d.triangles.length;k+=3){const a=ids[d.triangles[k]],b=ids[d.triangles[k+1]],cc=ids[d.triangles[k+2]],cx=(sourcePoints[a].x+sourcePoints[b].x+sourcePoints[cc].x)/3,cy=(sourcePoints[a].y+sourcePoints[b].y+sourcePoints[cc].y)/3;if(inside(cx,cy,poly))triangles.push([a,b,cc])}
 if(triangles.length<100)triangles=FALLBACK_TRIS.map(t=>t.slice());meshLabel.textContent=triangles.length;
}
function affine(s1,s2,s3,d1,d2,d3){const z=s1.x*(s2.y-s3.y)+s2.x*(s3.y-s1.y)+s3.x*(s1.y-s2.y);if(Math.abs(z)<1e-7)return null;return[(d1.x*(s2.y-s3.y)+d2.x*(s3.y-s1.y)+d3.x*(s1.y-s2.y))/z,(d1.y*(s2.y-s3.y)+d2.y*(s3.y-s1.y)+d3.y*(s1.y-s2.y))/z,(d1.x*(s3.x-s2.x)+d2.x*(s1.x-s3.x)+d3.x*(s2.x-s1.x))/z,(d1.y*(s3.x-s2.x)+d2.y*(s1.x-s3.x)+d3.y*(s2.x-s1.x))/z,(d1.x*(s2.x*s3.y-s3.x*s2.y)+d2.x*(s3.x*s1.y-s1.x*s3.y)+d3.x*(s1.x*s2.y-s2.x*s1.y))/z,(d1.y*(s2.x*s3.y-s3.x*s2.y)+d2.y*(s3.x*s1.y-s1.x*s3.y)+d3.y*(s1.x*s2.y-s2.x*s1.y))/z]}
function faceMask(T){ctx.beginPath();for(let i=0;i<FACE_OVAL.length;i++){const p=T[FACE_OVAL[i]];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.closePath();ctx.clip()}
function feather(){const p=FACE_OVAL.map(i=>({x:(1-sourcePoints[i].x)*c.width,y:sourcePoints[i].y*c.height}));let minX=c.width,minY=c.height,maxX=0,maxY=0;for(const q of p){minX=Math.min(minX,q.x);minY=Math.min(minY,q.y);maxX=Math.max(maxX,q.x);maxY=Math.max(maxY,q.y)}const cx=(minX+maxX)/2,cy=(minY+maxY)/2,rx=(maxX-minX)/2,ry=(maxY-minY)/2,a=Number(featherCtl.value)/100;ctx.save();ctx.globalCompositeOperation='destination-in';const g=ctx.createRadialGradient(cx,cy,Math.min(rx,ry)*.55,cx,cy,Math.max(rx,ry)*1.02);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.72,'rgba(0,0,0,1)');g.addColorStop(.88,'rgba(0,0,0,'+(1-.55*a)+')');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(minX-8,minY-8,maxX-minX+16,maxY-minY+16);ctx.restore()}
function warpFace(cam){if(!sourceImage||!sourcePoints)return;const S=makeMesh(sourcePoints,sourceImage.naturalWidth,sourceImage.naturalHeight),T=makeMesh(cam,c.width,c.height);const se=Math.hypot(S[263].x-S[33].x,S[263].y-S[33].y),te=Math.hypot(T[263].x-T[33].x,T[263].y-T[33].y);if(se<1||te<1)return;const k=te/se,sx=(S[33].x+S[263].x)/2,sy=(S[33].y+S[263].y)/2,tx=(T[33].x+T[263].x)/2,ty=(T[33].y+T[263].y)/2,r=Number(warpCtl.value)/100,D=T.map((p,i)=>{const X=tx+(S[i].x-sx)*k,Y=ty+(S[i].y-sy)*k;return{x:X*(1-r)+p.x*r,y:Y*(1-r)+p.y*r}});ctx.save();faceMask(T);ctx.globalAlpha=Number(blendCtl.value)/100;for(const q of triangles){const m=affine(S[q[0]],S[q[1]],S[q[2]],D[q[0]],D[q[1]],D[q[2]]);if(!m)continue;ctx.save();ctx.beginPath();ctx.moveTo(D[q[0]].x,D[q[0]].y);ctx.lineTo(D[q[1]].x,D[q[1]].y);ctx.lineTo(D[q[2]].x,D[q[2]].y);ctx.closePath();ctx.clip();ctx.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);ctx.drawImage(sourceImage,0,0);ctx.restore()}ctx.restore();}

file.onchange=()=>{const f=file.files&&file.files[0];if(!f||!imageAI){if(f&&!imageAI)setStatus('Chờ Face AI khởi động xong rồi chọn ảnh');return}const url=URL.createObjectURL(f),im=new Image;im.onload=()=>{sourceImage=im;preview.src=url;preview.style.display='block';try{const r=imageAI.detect(im),p=r.faceLandmarks||[];photoFaces.textContent=p.length;if(p.length){sourcePoints=p[0];buildDenseTriangles();controls.style.display='block';setStatus('PHOTO FACE OK — DENSE MESH')}else{sourcePoints=null;triangles=[];setStatus('Không thấy khuôn mặt trong ảnh')}}catch(e){setStatus('PHOTO AI ERROR: '+e.message)}};im.src=url};

function loop(now){if(!running)return;cameraCount++;if(now-fpsStart>=1000){cfps.textContent=cameraCount;afps.textContent=aiCount;cameraCount=0;aiCount=0;fpsStart=now}if(cameraAI&&v.readyState>=2&&v.currentTime!==lastTime){lastTime=v.currentTime;const t=performance.now();try{const r=cameraAI.detectForVideo(v,now),p=r.faceLandmarks||[];lat.textContent=(performance.now()-t).toFixed(1);faces.textContent=p.length;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);if(p.length&&sourcePoints){warpFace(p[0]);setStatus('FACE WARP OK')}else if(p.length){setStatus('FACE TRACKING OK')}else setStatus('Đang tìm khuôn mặt...');aiCount++}catch(e){setStatus('AI ERROR: '+e.message)}}requestAnimationFrame(loop)}
start.onclick=async()=>{start.disabled=true;try{await openCamera();await importAI();running=true;start.style.display='none';requestAnimationFrame(loop)}catch(e){setStatus('LỖI: '+e.message);start.disabled=false;console.error(e)}};
setStatus('Sẵn sàng — START rồi chọn ảnh');
})();
</script>
</body>
</html>
