<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive AI Swap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{z-index:0}canvas{z-index:1;pointer-events:none}.ui{position:fixed;inset:0;z-index:5;padding:12px;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:700}.stats{font-size:11px;line-height:1.55;text-align:right}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:auto}.button,input[type=file]{width:100%;padding:15px;border:0;border-radius:14px;margin-top:8px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}.button:disabled{opacity:.5}input[type=file]{background:#252525;font-weight:400}.notice{font-size:12px;line-height:1.45;margin-top:8px}.hide{display:none!important}#sourcePreview{position:fixed;right:12px;bottom:250px;width:82px;height:104px;object-fit:cover;border:2px solid #34c759;border-radius:12px;z-index:6}#aiPreview{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none}#apiInfo{max-height:120px;overflow:auto;font-size:10px;white-space:pre-wrap}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="out"></canvas><img id="aiPreview" class="hide" alt="AI result"><img id="sourcePreview" class="hide" alt="Ảnh mẫu"><div class="ui"><div class="top"><div class="panel title">FaceLive AI Swap</div><div class="panel stats">Camera <b id="fps">--</b> FPS<br>AI <b id="sfps">--</b> FPS<br>AI <b id="lat">--</b> ms<br>Face <b id="face">0</b><br>Engine <b>Remote INSwapper</b></div></div><div class="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" class="button">START CAMERA</button><input id="file" type="file" accept="image/*"><button id="ai" class="button" disabled>AI SWAP CURRENT FRAME</button><div id="notice" class="panel notice">Camera chạy trên iPhone. AI swap xử lý từ xa để Safari không tải model nặng.</div><div id="apiInfo" class="panel hide"></div></div></div><script type="module">
const $=id=>document.getElementById(id),video=$('video'),canvas=$('out'),start=$('start'),file=$('file'),aiBtn=$('ai'),status=$('status'),preview=$('sourcePreview'),aiPreview=$('aiPreview'),fps=$('fps'),sfps=$('sfps'),lat=$('lat'),face=$('face'),apiInfo=$('apiInfo');
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',GRADIO='https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js';
let FaceLandmarker,FilesetResolver,vision,sourceImage,sourceFile,sourcePrepared=false,running=false,preparing=false,lastVideoTime=-1,frames=0,aiCount=0,t0=performance.now(),remoteApp=null,remoteBusy=false,remoteApi=null;
const setStatus=s=>status.textContent='● '+s;
async function initVision(){if(!FaceLandmarker){let m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');FaceLandmarker=m.FaceLandmarker;FilesetResolver=m.FilesetResolver}if(!vision){setStatus('Đang tải Face Landmarker…');let v=await FilesetResolver.forVisionTasks(MP_WASM);vision=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1})}}
async function prepare(){if(!sourceImage||preparing)return;preparing=true;sourcePrepared=false;try{setStatus('Đang kiểm tra khuôn mặt ảnh nguồn…');await initVision();await vision.setOptions({runningMode:'IMAGE'});let r=vision.detect(sourceImage);if(!(r.faceLandmarks||[]).length)throw Error('Ảnh nguồn không có khuôn mặt rõ');sourcePrepared=true;aiBtn.disabled=false;setStatus('Ảnh nguồn OK — bấm AI SWAP')}catch(e){sourcePrepared=false;aiBtn.disabled=true;setStatus('SOURCE ERROR: '+(e.message||e))}finally{preparing=false;try{await vision?.setOptions({runningMode:'VIDEO'})}catch{}}}
file.onchange=()=>{let f=file.files?.[0];if(!f)return;sourceFile=f;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{sourceImage=im;preview.src=u;preview.classList.remove('hide');aiPreview.classList.add('hide');prepare()};im.src=u}
async function ensureRemote(){if(remoteApp)return remoteApp;setStatus('Đang kết nối AI server…');let mod=await import(GRADIO);remoteApp=await mod.Client.connect('tonyassi/face-swap');remoteApi=await remoteApp.view_api(true);apiInfo.textContent=JSON.stringify(remoteApi,null,2);apiInfo.classList.remove('hide');return remoteApp}
function endpoint(){let named=remoteApi?.named_endpoints||{};if(named['/swap_faces'])return '/swap_faces';let k=Object.keys(named).find(x=>/swap/i.test(x));if(k)return k;throw Error('Space không công bố endpoint swap_faces')}
async function remoteAI(){if(!sourcePrepared||remoteBusy||!video.videoWidth)return;remoteBusy=true;aiBtn.disabled=true;let t=performance.now();try{let mod=await import(GRADIO),app=await ensureRemote(),api=endpoint();setStatus('Đang gửi ảnh nguồn + frame camera…');let c=document.createElement('canvas'),scale=Math.min(1,640/video.videoWidth);c.width=Math.round(video.videoWidth*scale);c.height=Math.round(video.videoHeight*scale);c.getContext('2d').drawImage(video,0,0,c.width,c.height);let targetBlob=await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('Không tạo được frame')), 'image/jpeg',.82));let su=URL.createObjectURL(sourceFile),tu=URL.createObjectURL(targetBlob);try{let result=await app.predict(api,[mod.handle_file(su),mod.handle_file(tu)]);let d=result?.data?.[0],url=d?.url||d?.path||d;if(!url)throw Error('Server không trả ảnh kết quả');aiPreview.src=url;aiPreview.classList.remove('hide');aiCount++;lat.textContent=Math.round(performance.now()-t);setStatus('AI FACE SWAP OK')}finally{URL.revokeObjectURL(su);URL.revokeObjectURL(tu)}}catch(e){console.error(e);setStatus('REMOTE AI ERROR: '+(e.message||e))}finally{remoteBusy=false;aiBtn.disabled=!sourcePrepared}}
aiBtn.onclick=remoteAI;
function loop(now){if(!running)return;frames++;if(now-t0>1000){fps.textContent=frames;sfps.textContent=aiCount;frames=aiCount=0;t0=now}if(video.readyState>=2&&video.currentTime!==lastVideoTime&&!preparing){lastVideoTime=video.currentTime;let fs=vision.detectForVideo(video,now).faceLandmarks||[];face.textContent=fs.length;if(fs.length&&!sourcePrepared)setStatus('Camera OK — chọn ảnh nguồn');else if(fs.length&&sourcePrepared&&!remoteBusy)setStatus('LIVE — sẵn sàng AI SWAP');else if(!fs.length)setStatus('Đang tìm khuôn mặt…')}requestAnimationFrame(loop)}
start.onclick=async()=>{start.disabled=true;try{setStatus('Đang mở camera…');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:24}}});video.srcObject=s;await video.play();canvas.width=video.videoWidth||960;canvas.height=video.videoHeight||540;await initVision();running=true;start.textContent='CAMERA ON';$('notice').classList.add('hide');requestAnimationFrame(loop)}catch(e){console.error(e);setStatus('LỖI CAMERA: '+(e.message||e));start.disabled=false}};
window.addEventListener('unhandledrejection',e=>setStatus('JS ERROR: '+(e.reason?.message||e.reason||'unknown')));window.addEventListener('error',e=>setStatus('JS ERROR: '+(e.message||'unknown')));setStatus('Sẵn sàng — START CAMERA rồi chọn ảnh nguồn');
</script></body></html>
