<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive AI Swap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}video,#view{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{z-index:0}#view{z-index:2}.ui{position:fixed;inset:0;z-index:5;padding:12px;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:700}.stats{font-size:11px;line-height:1.55;text-align:right}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:auto}.button,input[type=file]{width:100%;padding:14px;border:0;border-radius:14px;margin-top:8px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}.button:disabled{opacity:.45}input[type=file]{background:#252525;font-weight:400}.notice{font-size:12px;line-height:1.45;margin-top:8px}.hide{display:none!important}#sourcePreview{position:fixed;right:12px;bottom:250px;width:82px;height:104px;object-fit:cover;border:2px solid #34c759;border-radius:12px;z-index:6}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="view"></canvas><img id="sourcePreview" class="hide"><div class="ui"><div class="top"><div class="panel title">FaceLive AI Swap</div><div class="panel stats">Camera <b id="fps">--</b> FPS<br>AI <b id="sfps">--</b> FPS<br>Latency <b id="lat">--</b> ms<br>Face <b id="face">0</b><br>LIVE MOTION BRIDGE</div></div><div class="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" class="button">START CAMERA</button><input id="file" type="file" accept="image/*"><button id="ai" class="button" disabled>START LIVE AI SWAP</button><div id="notice" class="panel notice">AI tạo khuôn mặt thật; Motion Bridge giữ chuyển động liên tục giữa các AI frame.</div></div></div><script type="module">
const $=id=>document.getElementById(id),video=$('video'),view=$('view'),ctx=view.getContext('2d'),start=$('start'),file=$('file'),aiBtn=$('ai'),status=$('status'),preview=$('sourcePreview'),fps=$('fps'),sfps=$('sfps'),lat=$('lat'),face=$('face');
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',GRADIO='https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js';
let FaceLandmarker,FilesetResolver,vision,sourceImage,sourceFile,sourcePrepared=false,running=false,live=false,preparing=false,lastVideoTime=-1,frames=0,aiCount=0,t0=performance.now(),lastSent=0,remoteApp=null,remoteBusy=false,sourceRef=null,liveGeneration=0;
let lastLandmarks=null,aiImage=null,aiLandmarks=null,aiW=0,aiH=0,aiReady=false;
const setStatus=s=>status.textContent='● '+s;
function lmPoints(lm,w,h){return [33,263,1,61,291].map(i=>({x:lm[i].x*w,y:lm[i].y*h}))}
function bboxFromPts(p,w,h){let xs=p.map(q=>q.x),ys=p.map(q=>q.y);let x1=Math.max(0,Math.min(...xs)-.28*(Math.max(...xs)-Math.min(...xs))),x2=Math.min(w,Math.max(...xs)+.28*(Math.max(...xs)-Math.min(...xs))),y1=Math.max(0,Math.min(...ys)-.38*(Math.max(...ys)-Math.min(...ys))),y2=Math.min(h,Math.max(...ys)+.38*(Math.max(...ys)-Math.min(...ys)));return {x:x1,y:y1,w:Math.max(1,x2-x1),h:Math.max(1,y2-y1)}}
function affine(a,b,c,d,e,f){let det=a*e-b*d;if(Math.abs(det)<1e-6)return null;return {A:(c*e-b*f)/det,B:(a*f-c*d)/det,C:(b*e-c*d)/det}}
function drawTriangle(src,s,d){let A=affine(s[1].x-s[0].x,s[2].x-s[0].x,d[1].x-d[0].x,d[2].x-d[0].x,0,0);if(!A)return;let sx=s[1].x-s[0].x,sy=s[1].y-s[0].y,tx=s[2].x-s[0].x,ty=s[2].y-s[0].y;let det=sx*ty-sy*tx;if(Math.abs(det)<1e-6)return;let m00=((d[1].x-d[0].x)*ty-(d[2].x-d[0].x)*sy)/det,m01=((d[2].x-d[0].x)*sx-(d[1].x-d[0].x)*tx)/det,m10=((d[1].y-d[0].y)*ty-(d[2].y-d[0].y)*sy)/det,m11=((d[2].y-d[0].y)*sx-(d[1].y-d[0].y)*tx)/det;let m02=d[0].x-m00*s[0].x-m01*s[0].y,m12=d[0].y-m10*s[0].x-m11*s[0].y;ctx.save();ctx.beginPath();ctx.moveTo(d[0].x,d[0].y);ctx.lineTo(d[1].x,d[1].y);ctx.lineTo(d[2].x,d[2].y);ctx.closePath();ctx.clip();ctx.setTransform(m00,m10,m01,m11,m02,m12);ctx.drawImage(src,0,0);ctx.restore()}
function drawAiFace(){if(!aiReady||!aiImage||!aiLandmarks||!lastLandmarks)return;let p=lastLandmarks,q=aiLandmarks;let pb=bboxFromPts(p,view.width,view.height),qb=bboxFromPts(q,aiW,aiH);let sx=aiW/view.width,sy=aiH/view.height;let srcPts=q.map(z=>({x:z.x,y:z.y})),dstPts=p;let tris=[[0,1,2],[0,2,3],[3,2,4],[2,1,4]];ctx.save();ctx.globalAlpha=.96;for(let t of tris){let s=srcPts.filter((_,i)=>t.includes(i)),d=dstPts.filter((_,i)=>t.includes(i));drawTriangle(aiImage,s,d)}ctx.restore()}
async function initVision(){if(!FaceLandmarker){let m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');FaceLandmarker=m.FaceLandmarker;FilesetResolver=m.FilesetResolver}if(!vision){setStatus('Đang tải Face Landmarker…');let v=await FilesetResolver.forVisionTasks(MP_WASM);vision=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1})}}
async function prepare(){if(!sourceImage||preparing)return;preparing=true;sourcePrepared=false;try{await initVision();await vision.setOptions({runningMode:'IMAGE'});let r=vision.detect(sourceImage);if(!(r.faceLandmarks||[]).length)throw Error('Ảnh nguồn không có khuôn mặt rõ');sourcePrepared=true;aiBtn.disabled=false;setStatus('Ảnh nguồn OK — sẵn sàng LIVE AI')}catch(e){setStatus('SOURCE ERROR: '+(e.message||e));aiBtn.disabled=true}finally{preparing=false;try{await vision.setOptions({runningMode:'VIDEO'})}catch{}}}
file.onchange=()=>{let f=file.files?.[0];if(!f)return;live=false;liveGeneration++;remoteBusy=false;sourceFile=f;sourceRef=null;aiReady=false;aiImage=null;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{sourceImage=im;preview.src=u;preview.classList.remove('hide');prepare()};im.src=u}
async function ensureRemote(){if(remoteApp)return remoteApp;setStatus('Đang kết nối AI server…');let mod=await import(GRADIO);remoteApp=await mod.Client.connect('tonyassi/face-swap');let api=await remoteApp.view_api();if(!api?.named_endpoints?.['/swap_faces'])throw Error('Không tìm thấy /swap_faces');return remoteApp}
async function makeFrame(){let c=document.createElement('canvas'),scale=Math.min(1,512/video.videoWidth);c.width=Math.max(1,Math.round(video.videoWidth*scale));c.height=Math.max(1,Math.round(video.videoHeight*scale));c.getContext('2d').drawImage(video,0,0,c.width,c.height);return {blob:await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('Không tạo được frame')),'image/jpeg',.72)),landmarks:lastLandmarks.map(p=>({x:p.x* c.width/view.width,y:p.y*c.height/view.height})),w:c.width,h:c.height}}
async function showResult(d,requestLm,w,h){let url=typeof d==='string'?d:(d?.url||null);if(!url&&d?.path&&/^https?:\/\//.test(d.path))url=d.path;if(!url&&d?.path)url='https://tonyassi-face-swap.hf.space/file='+encodeURIComponent(d.path);if(!url)throw Error('Server không trả URL kết quả');let im=new Image;im.crossOrigin='anonymous';await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=url});aiImage=im;aiLandmarks=requestLm;aiW=w;aiH=h;aiReady=true}
async function swapFrame(){if(!live||remoteBusy||!sourcePrepared||!video.videoWidth||!lastLandmarks)return;remoteBusy=true;let t=performance.now(),generation=liveGeneration;try{let mod=await import(GRADIO),app=await ensureRemote();if(!sourceRef)sourceRef=mod.handle_file(sourceFile);let fr=await makeFrame();setStatus('AI tạo frame…');let result=await app.predict('/swap_faces',[sourceRef,mod.handle_file(fr.blob)]);if(generation===liveGeneration&&live){let d=result?.data?.[0];if(d)await showResult(d,fr.landmarks,fr.w,fr.h)}aiCount++;lat.textContent=Math.round(performance.now()-t)}catch(e){console.error(e);setStatus('REMOTE AI ERROR: '+(e?.message||e));live=false;liveGeneration++;aiBtn.textContent='START LIVE AI SWAP'}finally{remoteBusy=false}}
function tick(now){if(!running)return;frames++;if(now-t0>1000){fps.textContent=frames;sfps.textContent=aiCount;frames=0;aiCount=0;t0=now}if(video.readyState>=2&&video.currentTime!==lastVideoTime&&!preparing){lastVideoTime=video.currentTime;let fs=vision.detectForVideo(video,now).faceLandmarks||[];face.textContent=fs.length;view.width=video.videoWidth;view.height=video.videoHeight;ctx.drawImage(video,0,0,view.width,view.height);if(fs.length){lastLandmarks=lmPoints(fs[0],view.width,view.height);if(live){drawAiFace();if(!remoteBusy&&now-lastSent>1100){lastSent=now;swapFrame()}}else setStatus('Camera OK — LIVE AI sẵn sàng')}}requestAnimationFrame(tick)}
aiBtn.onclick=()=>{if(!sourcePrepared)return;live=!live;liveGeneration++;aiBtn.textContent=live?'STOP LIVE AI SWAP':'START LIVE AI SWAP';if(live){lastSent=0;setStatus('LIVE AI + MOTION BRIDGE đang chạy…')}else setStatus('LIVE AI đã dừng — giữ camera')};
start.onclick=async()=>{start.disabled=true;try{setStatus('Đang mở camera…');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:24}}});video.srcObject=s;await video.play();await initVision();running=true;start.textContent='CAMERA ON';$('notice').classList.add('hide');requestAnimationFrame(tick)}catch(e){setStatus('LỖI CAMERA: '+(e.message||e));start.disabled=false}};
window.addEventListener('unhandledrejection',e=>setStatus('JS ERROR: '+(e.reason?.message||e.reason||'unknown')));window.addEventListener('error',e=>setStatus('JS ERROR: '+(e.message||'unknown')));setStatus('Sẵn sàng — START CAMERA rồi chọn ảnh nguồn');
</script></body></html>
