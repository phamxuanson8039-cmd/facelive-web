<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FaceLive 3.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
#video,#canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#video{transform:scaleX(-1);background:#000}#canvas{pointer-events:none}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none;padding:14px}
.panel{background:rgba(0,0,0,.72);border-radius:14px;padding:10px;pointer-events:auto}
#head{display:flex;justify-content:space-between;gap:10px}#title{font-weight:700;font-size:18px}#stats{font-size:12px;line-height:1.6;text-align:right}
#bottom{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom))}
button,input[type=file]{width:100%;border:0;border-radius:14px;padding:15px;margin-top:8px;font-size:16px;font-weight:700;background:#252525;color:#fff}
input[type=file]{font-size:14px;font-weight:400}button:disabled{opacity:.5}#controls{display:none;margin-top:8px}.row{font-size:12px;margin-top:6px}input[type=range]{width:100%}
#preview{display:none;position:fixed;right:14px;bottom:220px;width:82px;height:104px;object-fit:cover;border-radius:12px;border:2px solid #34c759;z-index:6}
#msg{position:fixed;left:20px;right:20px;top:50%;transform:translateY(-50%);text-align:center;line-height:1.5;z-index:4}.ok{color:#34c759}.err{color:#ff453a}
</style></head>
<body>
<video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><img id="preview" alt="Ảnh mẫu">
<div id="ui"><div id="head"><div id="title" class="panel">FaceLive 3.0</div><div id="stats" class="panel">Camera <b id="cfps">--</b> FPS<br>AI <b id="afps">--</b> FPS<br>Latency <b id="lat">--</b> ms<br>Camera Face <b id="faces">0</b><br>Photo Face <b id="pf">0</b></div></div>
<div id="msg"><b>FaceLive 3.0</b><br><span style="opacity:.7">iPhone Face Warp</span></div>
<div id="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start">START FACELIVE</button><input id="file" type="file" accept="image/*"><div id="controls" class="panel"><div class="row">Warp: <b id="wv">72</b>%</div><input id="warp" type="range" min="0" max="100" value="72"><div class="row">Blend: <b id="bv">82</b>%</div><input id="blend" type="range" min="30" max="100" value="82"><div class="row">Feather: <b id="fv">78</b>%</div><input id="feather" type="range" min="20" max="100" value="78"></div></div></div>
<script type="module">
const $=id=>document.getElementById(id);const video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d');
const start=$('start'),file=$('file'),status=$('status'),msg=$('msg'),preview=$('preview');
const cfps=$('cfps'),afps=$('afps'),lat=$('lat'),faces=$('faces'),pf=$('pf'),controls=$('controls');
const warp=$('warp'),blend=$('blend'),feather=$('feather'),wv=$('wv'),bv=$('bv'),fv=$('fv');
let FL,FR,cam=null,imgLM=null,stream=null,running=false,lastTime=-1,src=null,srcPts=null,frameN=0,aiN=0,fpsT=performance.now();
warp.oninput=()=>wv.textContent=warp.value;blend.oninput=()=>bv.textContent=blend.value;feather.oninput=()=>fv.textContent=feather.value;
function setStatus(s){status.textContent='● '+s}
async function loadAI(){setStatus('Đang tải Face AI...');const m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');FL=m.FaceLandmarker;FR=m.FilesetResolver;const v=await FR.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');const base={modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'};try{cam=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'GPU'},runningMode:'VIDEO',numFaces:1,minFaceDetectionConfidence:.45,minFacePresenceConfidence:.45,minTrackingConfidence:.45});imgLM=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'GPU'},runningMode:'IMAGE',numFaces:1,minFaceDetectionConfidence:.35,minFacePresenceConfidence:.35,minTrackingConfidence:.35});}catch(e){setStatus('GPU không khả dụng, chuyển CPU...');cam=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'CPU'},runningMode:'VIDEO',numFaces:1,minFaceDetectionConfidence:.45,minFacePresenceConfidence:.45,minTrackingConfidence:.45});imgLM=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'CPU'},runningMode:'IMAGE',numFaces:1,minFaceDetectionConfidence:.35,minFacePresenceConfidence:.35,minTrackingConfidence:.35})}setStatus('FACE AI OK')}
async function openCamera(){setStatus('Đang mở camera...');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}});video.srcObject=stream;await video.play();await new Promise(r=>video.videoWidth?r():video.addEventListener('loadedmetadata',r,{once:true}));canvas.width=video.videoWidth;canvas.height=video.videoHeight;setStatus('CAMERA OK')}
function P(a,i,w,h){const p=a[i];return{x:(1-p.x)*w,y:p.y*h}}
function affine(s1,s2,s3,d1,d2,d3){const z=s1.x*(s2.y-s3.y)+s2.x*(s3.y-s1.y)+s3.x*(s1.y-s2.y);if(Math.abs(z)<1e-6)return null;const A=(d1.x*(s2.y-s3.y)+d2.x*(s3.y-s1.y)+d3.x*(s1.y-s2.y))/z;const C=(d1.x*(s3.x-s2.x)+d2.x*(s1.x-s3.x)+d3.x*(s2.x-s1.x))/z;const E=(d1.x*(s2.x*s3.y-s3.x*s2.y)+d2.x*(s3.x*s1.y-s1.x*s3.y)+d3.x*(s1.x*s2.y-s2.x*s1.y))/z;const B=(d1.y*(s2.y-s3.y)+d2.y*(s3.y-s1.y)+d3.y*(s1.y-s2.y))/z;const D=(d1.y*(s3.x-s2.x)+d2.y*(s1.x-s3.x)+d3.y*(s2.x-s1.x))/z;const F=(d1.y*(s2.x*s3.y-s3.x*s2.y)+d2.y*(s3.x*s1.y-s1.x*s3.y)+d3.y*(s1.x*s2.y-s2.x*s1.y))/z;return[A,B,C,D,E,F]}
const tris=[[10,33,234],[10,234,93],[10,93,109],[10,109,338],[10,338,297],[10,297,454],[10,454,263],[33,160,1],[160,158,1],[158,133,1],[263,385,1],[385,362,1],[362,387,1],[234,93,132],[93,162,132],[132,58,172],[454,323,361],[323,327,361],[361,288,397],[33,1,234],[263,454,1],[61,91,1],[91,181,1],[181,84,17],[314,405,291],[405,321,291],[291,17,314],[61,152,234],[291,454,152],[152,234,172],[152,172,397],[152,397,454]];
function triangle(image,S,T,q,a){const m=affine(S[q[0]],S[q[1]],S[q[2]],T[q[0]],T[q[1]],T[q[2]]);if(!m)return;ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.moveTo(T[q[0]].x,T[q[0]].y);ctx.lineTo(T[q[1]].x,T[q[1]].y);ctx.lineTo(T[q[2]].x,T[q[2]].y);ctx.closePath();ctx.clip();ctx.setTransform(...m);ctx.drawImage(image,0,0);ctx.restore()}
function warpFace(camPts){if(!src||!srcPts)return;const sw=src.naturalWidth,sh=src.naturalHeight,S=srcPts.map((_,i)=>P(srcPts,i,sw,sh)),C=camPts.map((_,i)=>P(camPts,i,canvas.width,canvas.height));const sl=S[33],sr=S[263],tl=C[33],tr=C[263],se=Math.hypot(sr.x-sl.x,sr.y-sl.y),te=Math.hypot(tr.x-tl.x,tr.y-tl.y);if(se<2||te<2)return;const k=te/se,scx=(sl.x+sr.x)/2,scy=(sl.y+sr.y)/2,tcx=(tl.x+tr.x)/2,tcy=(tl.y+tr.y)/2,s=+warp.value/100,T=C.map((p,i)=>{const x=tcx+(S[i].x-scx)*k,y=tcy+(S[i].y-scy)*k;return{x:x*(1-s)+p.x*s,y:y*(1-s)+p.y*s}});const a=+blend.value/100;for(const q of tris)triangle(src,S,T,q,a);const f=+feather.value/100;ctx.save();ctx.globalCompositeOperation='destination-out';const g=ctx.createRadialGradient(tcx,tcy,Math.min(te*1.0,canvas.height*.18),tcx,tcy,Math.max(te*1.65,canvas.height*.34));g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.72,'rgba(0,0,0,0)');g.addColorStop(.9,`rgba(0,0,0,${.55*f})`);g.addColorStop(1,'rgba(0,0,0,1)');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.restore()}
async function readPhoto(){const f=file.files?.[0];if(!f||!imgLM)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{src=im;preview.src=url;preview.style.display='block';const r=imgLM.detect(im),p=r.faceLandmarks||[];pf.textContent=p.length;if(!p.length){srcPts=null;controls.style.display='none';setStatus('Không thấy mặt trong ảnh');return}srcPts=p[0];controls.style.display='block';setStatus('PHOTO FACE OK');msg.innerHTML='<b class="ok">PHOTO FACE OK</b><br>Ảnh mẫu đã sẵn sàng';setTimeout(()=>msg.style.display='none',900)};im.onerror=()=>setStatus('Lỗi đọc ảnh');im.src=url}
file.onchange=readPhoto;
function loop(now){if(!running)return;frameN++;if(now-fpsT>=1000){cfps.textContent=frameN;afps.textContent=aiN;frameN=aiN=0;fpsT=now}if(cam&&video.readyState>=2&&video.currentTime!==lastTime){lastTime=video.currentTime;const t=performance.now();try{const r=cam.detectForVideo(video,now);lat.textContent=(performance.now()-t).toFixed(1);const p=r.faceLandmarks||[];faces.textContent=p.length;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);if(p.length&&srcPts){warpFace(p[0]);setStatus('FACE WARP OK')}else if(p.length){setStatus('FACE TRACKING OK')}else setStatus('Đang tìm khuôn mặt...');aiN++}catch(e){console.error(e);setStatus('AI ERROR: '+e.message)}}requestAnimationFrame(loop)}
start.onclick=async()=>{start.disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Safari không hỗ trợ Camera API');await openCamera();await loadAI();running=true;start.style.display='none';msg.style.display='none';requestAnimationFrame(loop)}catch(e){console.error(e);setStatus('LỖI: '+e.message);msg.innerHTML='<b class="err">FACELIVE ERROR</b><br>'+e.message;msg.style.display='block';start.disabled=false}};
</script></body></html>
