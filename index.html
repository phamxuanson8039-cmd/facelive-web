<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive 3.4</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}#video,#canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#video{transform:scaleX(-1)}#canvas{pointer-events:none}.panel{background:rgba(0,0,0,.75);border-radius:14px;padding:10px}#ui{position:fixed;inset:0;padding:14px;z-index:5;pointer-events:none}#head{display:flex;justify-content:space-between;gap:10px}#title{font-weight:700;font-size:18px}#stats{font-size:12px;line-height:1.6;text-align:right}#bottom{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:auto}button,input[type=file]{width:100%;border:0;border-radius:14px;padding:15px;margin-top:8px;font-size:16px;background:#252525;color:#fff}button{background:#1769ff;font-weight:700}button:disabled{opacity:.5}#controls{display:none;margin-top:8px}.row{font-size:12px;margin:6px 0}input[type=range]{width:100%}#preview{display:none;position:fixed;right:14px;bottom:220px;width:82px;height:104px;object-fit:cover;border-radius:12px;border:2px solid #34c759;z-index:6}.err{color:#ff453a}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><img id="preview"><div id="ui"><div id="head"><div id="title" class="panel">FaceLive 3.4</div><div id="stats" class="panel">Camera <b id="cfps">--</b> FPS<br>AI <b id="afps">--</b> FPS<br>Latency <b id="lat">--</b> ms<br>Camera Face <b id="faces">0</b><br>Photo Face <b id="pf">0</b></div></div><div id="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start">START FACELIVE</button><input id="file" type="file" accept="image/*"><div id="controls" class="panel"><div class="row">Warp: <b id="wv">72</b>%</div><input id="warp" type="range" min="0" max="100" value="72"><div class="row">Blend: <b id="bv">82</b>%</div><input id="blend" type="range" min="30" max="100" value="82"><div class="row">Feather: <b id="fv">78</b>%</div><input id="feather" type="range" min="20" max="100" value="78"></div></div></div><script>
(function(){const $=i=>document.getElementById(i),v=$('video'),c=$('canvas'),x=c.getContext('2d'),st=$('start'),fi=$('file'),status=$('status'),pv=$('preview'),ctrl=$('controls'),cf=$('cfps'),af=$('afps'),la=$('lat'),fa=$('faces'),pf=$('pf'),wa=$('warp'),bl=$('blend'),fe=$('feather'),wv=$('wv'),bv=$('bv'),fv=$('fv');let FL,FR,cam,img,stream,src,srcPts,last=-1,run=false,n=0,a=0,t0=performance.now();const S=s=>status.textContent='● '+s;wa.oninput=()=>wv.textContent=wa.value;bl.oninput=()=>bv.textContent=bl.value;fe.oninput=()=>fv.textContent=fe.value;
async function loadAI(){S('Đang tải Face AI...');const urls=['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.js','https://unpkg.com/@mediapipe/tasks-vision@0.10.22/vision_bundle.js'];let ok=false;for(const u of urls){try{await new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});if(window.FaceLandmarker&&window.FilesetResolver){ok=true;break}}catch(e){}}if(!ok)throw Error('Không tải được Face AI. Hãy dùng Safari và mở lại trang.');FL=window.FaceLandmarker;FR=window.FilesetResolver;const v=await FR.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');const base={modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'};try{cam=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'GPU'},runningMode:'VIDEO',numFaces:1});img=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'GPU'},runningMode:'IMAGE',numFaces:1})}catch(e){cam=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'CPU'},runningMode:'VIDEO',numFaces:1});img=await FL.createFromOptions(v,{baseOptions:{...base,delegate:'CPU'},runningMode:'IMAGE',numFaces:1})}S('FACE AI OK')}
async function camera(){S('Đang mở camera...');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}});v.srcObject=stream;await v.play();await new Promise(r=>v.videoWidth?r():v.addEventListener('loadedmetadata',r,{once:true}));c.width=v.videoWidth||1280;c.height=v.videoHeight||720;S('CAMERA OK')}
const P=(q,i,w,h)=>({x:(1-q[i].x)*w,y:q[i].y*h});const tris=[[10,33,234],[10,234,93],[10,93,109],[10,109,338],[10,338,297],[10,297,454],[10,454,263],[33,160,1],[160,158,1],[158,133,1],[263,385,1],[385,362,1],[362,387,1],[234,93,132],[93,162,132],[132,58,172],[454,323,361],[323,327,361],[361,288,397],[33,1,234],[263,454,1],[61,91,1],[91,181,1],[181,84,17],[314,405,291],[405,321,291],[291,17,314],[61,152,234],[291,454,152],[152,234,172],[152,172,397],[152,397,454]];function A(a,b,c,d,e,f){let z=a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y);if(Math.abs(z)<1e-6)return;return[(d.x*(b.y-c.y)+e.x*(c.y-a.y)+f.x*(a.y-b.y))/z,(d.y*(b.y-c.y)+e.y*(c.y-a.y)+f.y*(a.y-b.y))/z,(d.x*(c.y-b.y)+e.x*(a.y-c.y)+f.x*(b.y-a.y))/z,(d.y*(c.y-b.y)+e.y*(a.y-c.y)+f.y*(b.y-a.y))/z,(d.x*(b.x*c.y-c.x*b.y)+e.x*(c.x*a.y-a.x*c.y)+f.x*(a.x*b.y-b.x*a.y))/z,(d.y*(b.x*c.y-c.x*b.y)+e.y*(c.x*a.y-a.x*c.y)+f.y*(a.x*b.y-b.x*a.y))/z]}function warp(q){if(!src||!srcPts)return;let S=srcPts.map((_,i)=>P(srcPts,i,src.naturalWidth,src.naturalHeight)),C=q.map((_,i)=>P(q,i,c.width,c.height)),k=Math.hypot(C[263].x-C[33].x,C[263].y-C[33].y)/Math.max(1,Math.hypot(S[263].x-S[33].x,S[263].y-S[33].y)),sx=(S[33].x+S[263].x)/2,sy=(S[33].y+S[263].y)/2,tx=(C[33].x+C[263].x)/2,ty=(C[33].y+C[263].y)/2,r=+wa.value/100,T=C.map((p,i)=>{let X=tx+(S[i].x-sx)*k,Y=ty+(S[i].y-sy)*k;return{x:X*(1-r)+p.x*r,y:Y*(1-r)+p.y*r}});for(const q of tris){let m=A(S[q[0]],S[q[1]],S[q[2]],T[q[0]],T[q[1]],T[q[2]]);if(!m)continue;x.save();x.globalAlpha=+bl.value/100;x.beginPath();x.moveTo(T[q[0]].x,T[q[0]].y);x.lineTo(T[q[1]].x,T[q[1]].y);x.lineTo(T[q[2]].x,T[q[2]].y);x.closePath();x.clip();x.setTransform(...m);x.drawImage(src,0,0);x.restore()}}
fi.onchange=()=>{let f=fi.files?.[0];if(!f||!img)return;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{src=im;pv.src=u;pv.style.display='block';let p=img.detect(im).faceLandmarks||[];pf.textContent=p.length;if(p.length){srcPts=p[0];ctrl.style.display='block';S('PHOTO FACE OK')}else{srcPts=null;S('Không thấy mặt trong ảnh')}};im.src=u};function loop(now){if(!run)return;n++;if(now-t0>1000){cf.textContent=n;af.textContent=a;n=a=0;t0=now}if(cam&&v.readyState>=2&&v.currentTime!==last){last=v.currentTime;let z=performance.now();try{let p=cam.detectForVideo(v,now).faceLandmarks||[];la.textContent=(performance.now()-z).toFixed(1);fa.textContent=p.length;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,c.width,c.height);if(p.length&&srcPts){warp(p[0]);S('FACE WARP OK')}else if(p.length)S('FACE TRACKING OK');else S('Đang tìm khuôn mặt...');a++}catch(e){S('AI ERROR: '+e.message)}}requestAnimationFrame(loop)}st.onclick=async()=>{st.disabled=true;try{await camera();await loadAI();run=true;st.style.display='none';requestAnimationFrame(loop)}catch(e){S('LỖI: '+e.message);st.disabled=false;console.error(e)}};S('Sẵn sàng — START rồi chọn ảnh')})();</script></body></html>
