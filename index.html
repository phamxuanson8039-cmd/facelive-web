<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>FaceLive 0.1</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                     "Helvetica Neue", Arial, sans-serif;
        color: white;
    }

    #app {
        position: fixed;
        inset: 0;
        background: #000;
    }

    #video {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        background: #000;
    }

    #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    #top {
        position: absolute;
        top: max(18px, env(safe-area-inset-top));
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 10;
    }

    .panel {
        background: rgba(0,0,0,.55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 16px;
        padding: 12px 14px;
    }

    #title {
        font-size: 20px;
        font-weight: 700;
    }

    #subtitle {
        margin-top: 3px;
        font-size: 12px;
        opacity: .7;
    }

    #stats {
        text-align: right;
        font-size: 12px;
        line-height: 1.55;
        font-variant-numeric: tabular-nums;
    }

    #bottom {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: max(18px, env(safe-area-inset-bottom));
        z-index: 10;
    }

    #status {
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
    }

    #dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff3b30;
    }

    #dot.active {
        background: #34c759;
        box-shadow: 0 0 12px rgba(52,199,89,.8);
    }

    #start {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 18px;
        padding: 17px;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        background: rgba(255,255,255,.16);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }

    #start:active {
        transform: scale(.98);
    }

    #message {
        position: absolute;
        left: 20px;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        text-align: center;
        z-index: 5;
        font-size: 15px;
        line-height: 1.5;
        opacity: .9;
        pointer-events: none;
    }

    .face-box {
        position: absolute;
        border: 2px solid #34c759;
        border-radius: 50%;
        pointer-events: none;
        display: none;
    }
</style>
</head>

<body>

<div id="app">

    <video id="video"
           autoplay
           playsinline
           muted></video>

    <canvas id="overlay"></canvas>

    <div id="message">
        FaceLive<br>
        <span style="opacity:.65">
            Realtime face tracking benchmark
        </span>
    </div>

    <div id="top">

        <div class="panel">
            <div id="title">FaceLive</div>
            <div id="subtitle">Realtime AI Prototype 0.1</div>
        </div>

        <div id="stats" class="panel">
            FPS: <b id="fps">--</b><br>
            Tracking: <b id="tracking">--</b> ms<br>
            Resolution: <b id="resolution">--</b>
        </div>

    </div>

    <div id="bottom">

        <div id="status" class="panel">
            <div id="dot"></div>
            <span id="statusText">Camera not started</span>
        </div>

        <button id="start">
            Start FaceLive
        </button>

    </div>

</div>

<script type="module">

import {
    FaceLandmarker,
    FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("start");
const statusText = document.getElementById("statusText");
const dot = document.getElementById("dot");
const message = document.getElementById("message");

const fpsElement = document.getElementById("fps");
const trackingElement = document.getElementById("tracking");
const resolutionElement = document.getElementById("resolution");

let faceLandmarker = null;
let stream = null;
let running = false;

let frameCounter = 0;
let fpsStart = performance.now();
let currentFPS = 0;

let lastFrameTime = performance.now();

async function loadModel() {

    statusText.textContent = "Loading AI model…";

    const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );

    faceLandmarker = await FaceLandmarker.createFromOptions(
        vision,
        {
            baseOptions: {
                modelAssetPath:
                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                delegate: "GPU"
            },

            runningMode: "VIDEO",

            numFaces: 2,

            minFaceDetectionConfidence: 0.5,
            minFacePresenceConfidence: 0.5,
            minTrackingConfidence: 0.5,

            outputFaceBlendshapes: true,
            outputFacialTransformationMatrixes: true
        }
    );

    statusText.textContent = "AI model ready";
}

async function startCamera() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        throw new Error(
            "Camera API is not available. Open this page using HTTPS."
        );
    }

    stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
            facingMode: "user",
            width: {
                ideal: 1280
            },
            height: {
                ideal: 720
            },
            frameRate: {
                ideal: 30,
                max: 30
            }
        }
    });

    video.srcObject = stream;

    await video.play();

    resolutionElement.textContent =
        `${video.videoWidth}×${video.videoHeight}`;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    running = true;

    dot.classList.add("active");
    statusText.textContent = "FaceLive running";
    message.style.display = "none";

    requestAnimationFrame(processFrame);
}

function drawFace(results) {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!results.faceLandmarks ||
        results.faceLandmarks.length === 0) {

        statusText.textContent = "Searching for face";
        return;
    }

    statusText.textContent =
        `${results.faceLandmarks.length} face detected`;

    for (const landmarks of results.faceLandmarks) {

        let minX = 1;
        let minY = 1;
        let maxX = 0;
        let maxY = 0;

        for (const point of landmarks) {

            minX = Math.min(minX, point.x);
            minY = Math.min(minY, point.y);
            maxX = Math.max(maxX, point.x);
            maxY = Math.max(maxY, point.y);
        }

        const x = minX * canvas.width;
        const y = minY * canvas.height;
        const w = (maxX - minX) * canvas.width;
        const h = (maxY - minY) * canvas.height;

        ctx.save();

        ctx.strokeStyle = "#34c759";
        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.ellipse(
            x + w / 2,
            y + h / 2,
            w / 2,
            h / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();
    }
}

async function processFrame(now) {

    if (!running ||
        !faceLandmarker ||
        video.readyState < 2) {

        requestAnimationFrame(processFrame);
        return;
    }

    const start = performance.now();

    try {

        const results =
            faceLandmarker.detectForVideo(
                video,
                now
            );

        drawFace(results);

        const processingTime =
            performance.now() - start;

        trackingElement.textContent =
            processingTime.toFixed(1);

        frameCounter++;

        if (now - fpsStart >= 1000) {

            currentFPS =
                frameCounter /
                ((now - fpsStart) / 1000);

            fpsElement.textContent =
                currentFPS.toFixed(1);

            frameCounter = 0;
            fpsStart = now;
        }

    } catch (error) {

        console.error(error);
    }

    lastFrameTime = now;

    requestAnimationFrame(processFrame);
}

startButton.addEventListener("click", async () => {

    startButton.disabled = true;

    try {

        await loadModel();
        await startCamera();

        startButton.style.display = "none";

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Unable to start camera";

        message.innerHTML =
            "Camera could not start.<br>" +
            "<small>" +
            error.message +
            "</small>";

        message.style.display = "block";

        startButton.disabled = false;
    }
});

</script>

</body>
</html>
