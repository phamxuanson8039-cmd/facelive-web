<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive AI Swap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}video,#view{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{z-index:0}#view{z-index:2}.ui{position:fixed;inset:0;z-index:5;padding:12px;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:700}.stats{font-size:11px;line-height:1.55;text-align:right}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:auto}.button,input[type=file]{width:100%;padding:14px;border:0;border-radius:14px;margin-top:8px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}.button.secondary{background:#16a34a}.button.dark{background:#7c3aed}.button:disabled{opacity:.45}input[type=file]{background:#252525;font-weight:400}.notice{font-size:12px;line-height:1.45;margin-top:8px}.hide{display:none!important}#sourcePreview{position:fixed;right:12px;bottom:330px;width:82px;height:104px;object-fit:cover;border:2px solid #34c759;border-radius:12px;z-index:6}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="view"></canvas><img id="sourcePreview" class="hide"><div class="ui"><div class="top"><div class="panel title">FaceLive AI Swap</div><div class="panel stats">Camera <b id="fps">--</b> FPS<br>AI <b id="sfps">--</b> FPS<br>Latency <b id="lat">--</b> ms<br>Face <b id="face">0</b><br>DENSE LIVE TRACKING</div></div><div class="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" class="button">START CAMERA</button><input id="file" type="file" accept="image/*"><button id="ai" class="button" disabled>START LIVE AI SWAP</button><button id="realtime" class="button secondary">OPEN REALTIME 30FPS</button><button id="picsi" class="button dark">OPEN 512 LIVE APP</button><div id="notice" class="panel notice">Hybrid mode dùng AI swap thật + dense mesh. Model inswapper-512-live hiện không có public weights để nhúng trực tiếp vào Safari; nút 512 LIVE mở ứng dụng chính thức dùng model này trên iPhone.</div></div></div><script type="module">
const $=id=>document.getElementById(id),video=$('video'),view=$('view'),ctx=view.getContext('2d'),start=$('start'),file=$('file'),aiBtn=$('ai'),realtime=$('realtime'),picsi=$('picsi'),status=$('status'),preview=$('sourcePreview'),fps=$('fps'),sfps=$('sfps'),lat=$('lat'),face=$('face');
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',GRADIO='https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js';
const IDS=[10,70,105,159,33,133,61,78,13,14,308,291,263,362,386,300,282,4,1,152,234,454];
const TRI=[[0,1,2],[0,2,3],[0,3,19],[0,19,20],[0,20,21],[3,4,5],[3,5,6],[3,6,7],[3,7,8],[3,8,9],[3,9,10],[3,10,11],[3,11,12],[3,12,13],[3,13,14],[3,14,15],[3,15,16],[3,16,17],[3,17,18],[3,18,19],[4,5,7],[5,6,7],[7,8,10],[8,9,10],[10,11,13],[11,12,13],[13,14,16],[14,15,16],[16,17,19],[17,18,19]];
let FaceLandmarker,FilesetResolver,vision,sourceImage,sourceFile,sourcePrepared=false,running=false,live=false,preparing=false,lastVideoTime=-1,frames=0,aiCount=0,t0=performance.now(),lastSent=0,remoteApp=null,remoteBusy=false,sourceRef=null,liveGeneration=0,lastLatency=700;
let stable=null,aiImage=null,aiLandmarks=null,aiW=0,aiH=0,aiReady=false,aiCanvas=null,aiCtx=null;
const setStatus=s=>status.textContent='● '+s;
function mesh(lm,w,h){return IDS.map(i=>({x:lm[i].x*w,y:lm[i].y*h}))}
function smooth(p){if(!stable)return stable=p.map(q=>({...q}));let a=.38;return stable=stable.map((q,i)=>({x:q.x+(p[i].x-q.x)*a,y:q.y+(p[i].y-q.y)*a}))}
function tri(target,s,d){let ax=s[1].x-s[0].x,ay=s[1].y-s[0].y,bx=s[2].x-s[0].x,by=s[2].y-s[0].y,det=ax*by-ay*bx;if(Math.abs(det)<1e-6)return;let m00=((d[1].x-d[0].x)*by-(d[2].x-d[0].x)*ay)/det,m01=((d[2].x-d[0].x)*ax-(d[1].x-d[0].x)*bx)/det,m10=((d[1].y-d[0].y)*by-(d[2].y-d[0].y)*ay)/det,m11=((d[2].y-d[0].y)*ax-(d[2].y-d[0].y)*0-(d[1].y-d[0].y)*bx)/det,m02=d[0].x-m00*s[0].x-m01*s[0].y,m12=d[0].y-m10*s[0].x-m11*s[0].y;target.save();target.beginPath();target.moveTo(d[0].x,d[0].y);target.lineTo(d[1].x,d[1].y);target.lineTo(d[2].x,d[2].y);target.closePath();target.clip();target.setTransform(m00,m10,m01,m11,m02,m12);target.drawImage(aiImage,0,0);target.restore()}
function build(){if(!aiReady||!aiImage||!aiLandmarks||!stable||!view.width)return;aiCanvas=aiCanvas||document.createElement('canvas');if(aiCanvas.width!==view.width||aiCanvas.height!==view.height){aiCanvas.width=view.width;aiCanvas.height=view.height;aiCtx=aiCanvas.getContext('2d')}aiCtx.clearRect(0,0,view.width,view.height);let s=aiLandmarks.map(p=>({x:p.x*view.width/aiW,y:p.y*view.height/aiH})),d=stable;for(const t of TRI)tri(aiCtx,t.map(i=>s[i]),t.map(i=>d[i]));let xs=d.map(p=>p.x),ys=d.map(p=>p.y),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,rx=Math.max(24,(Math.max(...xs)-Math.min(...xs))*.72),ry=Math.max(30,(Math.max(...ys)-Math.min(...ys))*.92);aiCtx.save();aiCtx.globalCompositeOperation='destination-in';let g=aiCtx.createRadialGradient(cx,cy,Math.min(rx,ry)*.42,cx,cy,Math.max(rx,ry));g.addColorStop(0,'#fff');g.addColorStop(.74,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');aiCtx.fillStyle=g;aiCtx.beginPath();aiCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);aiCtx.fill();aiCtx.restore()}
function drawSwap(){if(!aiReady||!stable)return;build();if(aiCanvas)ctx.drawImage(aiCanvas,0,0)}
async function initVision(){if(!FaceLandmarker){let m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');FaceLandmarker=m.FaceLandmarker;FilesetResolver=m.FilesetResolver}if(!vision){setStatus('Đang tải Face Landmarker…');let v=await FilesetResolver.forVisionTasks(MP_WASM);vision=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1})}}
async function prepare(){if(!sourceImage||preparing)return;preparing=true;sourcePrepared=false;try{await initVision();await vision.setOptions({runningMode:'IMAGE'});let r=vision.detect(sourceImage);if(!(r.faceLandmarks||[]).length)throw Error('Ảnh nguồn không có khuôn mặt rõ');sourcePrepared=true;aiBtn.disabled=false;setStatus('Ảnh nguồn OK — sẵn sàng LIVE AI')}catch(e){setStatus('SOURCE ERROR: '+(e.message||e));aiBtn.disabled=true}finally{preparing=false;try{await vision.setOptions({runningMode:'VIDEO'})}catch{}}}
file.onchange=()=>{let f=file.files?.[0];if(!f)return;live=false;liveGeneration++;remoteBusy=false;sourceFile=f;sourceRef=null;aiReady=false;aiImage=null;stable=null;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{sourceImage=im;preview.src=u;preview.classList.remove('hide');prepare()};im.src=u}
async function ensureRemote(){if(remoteApp)return remoteApp;setStatus('Đang kết nối AI server…');let mod=await import(GRADIO);remoteApp=await mod.Client.connect('tonyassi/face-swap');let api=await remoteApp.view_api();if(!api?.named_endpoints?.['/swap_faces'])throw Error('Không tìm thấy /swap_faces');return remoteApp}
async function frame(){let c=document.createElement('canvas'),scale=Math.min(1,512/video.videoWidth);c.width=Math.max(1,Math.round(video.videoWidth*scale));c.height=Math.max(1,Math.round(video.videoHeight*scale));c.getContext('2d').drawImage(video,0,0,c.width,c.height);return {blob:await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('Không tạo được frame')),'image/jpeg',.68)),landmarks:stable.map(p=>({x:p.x*c.width/view.width,y:p.y*c.height/view.height})),w:c.width,h:c.height}}
async function showResult(d,lm,w,h){let url=typeof d==='string'?d:(d?.url||null);if(!url&&d?.path&&/^https?:\/\//.test(d.path))url=d.path;if(!url&&d?.path)url='https://tonyassi-face-swap.hf.space/file='+encodeURIComponent(d.path);if(!url)throw Error('Server không trả URL kết quả');let im=new Image;im.crossOrigin='anonymous';await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=url});aiImage=im;aiLandmarks=lm;aiW=w;aiH=h;aiReady=true;build()}
async function swap(){if(!live||remoteBusy||!sourcePrepared||!video.videoWidth||!stable)return;remoteBusy=true;let t=performance.now(),gen=liveGeneration;try{let mod=await import(GRADIO),app=await ensureRemote();if(!sourceRef)sourceRef=mod.handle_file(sourceFile);let f=await frame();setStatus('AI tạo frame…');let r=await app.predict('/swap_faces',[sourceRef,mod.handle_file(f.blob)]);if(gen===liveGeneration&&live&&r?.data?.[0])await showResult(r.data[0],f.landmarks,f.w,f.h);lastLatency=Math.round(performance.now()-t);lat.textContent=lastLatency;aiCount++}catch(e){console.error(e);setStatus('REMOTE AI ERROR: '+(e?.message||e));live=false;liveGeneration++;aiBtn.textContent='START LIVE AI SWAP'}finally{remoteBusy=false}}
const delay=()=>Math.round(Math.min(1250,Math.max(520,lastLatency*.72)));
function tick(now){if(!running)return;frames++;if(now-t0>1000){fps.textContent=frames;sfps.textContent=aiCount;frames=0;aiCount=0;t0=now}if(video.readyState>=2&&video.currentTime!==lastVideoTime&&!preparing){lastVideoTime=video.currentTime;let fs=vision.detectForVideo(video,now).faceLandmarks||[];face.textContent=fs.length;view.width=video.videoWidth;view.height=video.videoHeight;ctx.drawImage(video,0,0,view.width,view.height);if(fs.length){stable=smooth(mesh(fs[0],view.width,view.height));if(live){drawSwap();if(!remoteBusy&&now-lastSent>delay()){lastSent=now;swap()}}else setStatus('Camera OK — LIVE AI sẵn sàng')}}requestAnimationFrame(tick)}
aiBtn.onclick=()=>{if(!sourcePrepared)return;live=!live;liveGeneration++;aiBtn.textContent=live?'STOP LIVE AI SWAP':'START LIVE AI SWAP';setStatus(live?'LIVE AI + DENSE MOTION đang chạy…':'LIVE AI đã dừng — giữ camera');if(live)lastSent=0};
realtime.onclick=()=>window.open('https://web.amigoai.io/','_blank','noopener,noreferrer');
picsi.onclick=()=>window.open('https://www.picsi.ai/app','_blank','noopener,noreferrer');
start.onclick=async()=>{start.disabled=true;try{setStatus('Đang mở camera…');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:24}}});video.srcObject=s;await video.play();await initVision();running=true;start.textContent='CAMERA ON';$('notice').classList.add('hide');requestAnimationFrame(tick)}catch(e){setStatus('LỖI CAMERA: '+(e.message||e));start.disabled=false}};
window.addEventListener('unhandledrejection',e=>setStatus('JS ERROR: '+(e.reason?.message||e.reason||'unknown')));window.addEventListener('error',e=>setStatus('JS ERROR: '+(e.message||'unknown')));setStatus('Sẵn sàng — START CAMERA rồi chọn ảnh nguồn');
</script></body></html>
