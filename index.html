/* =========================================

========================================= */

async function startCamera(){

setStatus(
"Đang mở camera..."
);

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Camera API không được hỗ trợ"
);

}

stream =
await navigator.mediaDevices.getUserMedia({

audio:false,

video:{
facingMode:"user",

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30
}
}

});

video.srcObject =
stream;

await video.play();

await new Promise(resolve=>{

if(video.videoWidth>0){

resolve();

}else{

video.onloadedmetadata =
resolve;

}

});

canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;

setStatus(
"CAMERA OK"
);

}


/* =========================================

async function loadMediaPipe(){

const module =

);

/* =========================================
   POINT
========================================= */

function point(
landmarks,
index,
w,
h
){

const p =
landmarks[index];

return{

x:(1-p.x)*w,

y:p.y*h

};

}


/* =========================================
   BUILD MESH
========================================= */

function buildMesh(
landmarks,
w,
h
){

const points=[];

for(
let i=0;
i<landmarks.length;
i++
){

points.push(
point(
landmarks,
i,
w,
h
);

}

return points;

}


/* =========================================
   AFFINE
========================================= */

function affine(
s1,s2,s3,
d1,d2,d3
){

const den =
s1.x*(s2.y-s3.y)+
s2.x*(s3.y-s1.y)+
s3.x*(s1.y-s2.y);

if(
Math.abs(den)<0.00001
){
return null;
}

const a =
(
d1.x*(s2.y-s3.y)+
d2.x*(s3.y-s1.y)+
d3.x*(s1.y-s2.y)
)/den;

const c =
(
d1.x*(s3.x-s2.x)+
d2.x*(s1.x-s3.x)+
d3.x*(s2.x-s1.x)
)/den;

const e =
(
d1.x*(s2.x*s3.y-s3.x*s2.y)+
d2.x*(s3.x*s1.y-s1.x*s3.y)+
d3.x*(s1.x*s2.y-s2.x*s1.y)
)/den;

const b =
(
d1.y*(s2.y-s3.y)+
d2.y*(s3.y-s1.y)+
d3.y*(s1.y-s2.y)
)/den;

const d =
(
d1.y*(s3.x-s2.x)+
d2.y*(s1.x-s3.x)+
d3.y*(s2.x-s1.x)
)/den;

const f =
(
d1.y*(s2.x*s3.y-s3.x*s2.y)+
d2.y*(s3.x*s1.y-s1.x*s3.y)+
d3.y*(s1.x*s2.y-s2.x*s1.y)
)/den;

return{
a,b,c,d,e,f
};

}


/* =========================================
   TRIANGLE
========================================= */

function drawTriangle(
image,
s1,s2,s3,
d1,d2,d3,
alpha
){

const m =
affine(
s1,s2,s3,
d1,d2,d3
);

if(!m)return;

ctx.save();

ctx.globalAlpha =
alpha;

ctx.beginPath();

ctx.moveTo(
d1.x,
d1.y
);

ctx.lineTo(
d2.x,
d2.y
);

ctx.lineTo(
d3.x,
d3.y
);

ctx.closePath();

ctx.clip();

ctx.setTransform(
m.a,
m.b,
m.c,
m.d,
m.e,
m.f
);

ctx.drawImage(
image,
0,
0
);

ctx.restore();

}


/* =========================================
   CIRCUMCIRCLE
========================================= */

function circumcircle(a,b,c){

const A =
b.x-a.x;

const B =
b.y-a.y;

const C =
c.x-a.x;

const Dd =
c.y-a.y;

const E =
A*(a.x+b.x)+
B*(a.y+b.y);

const F =
C*(a.x+c.x)+
Dd*(a.y+c.y);

const G =
2*(A*(c.y-b.y)-
B*(c.x-b.x));

if(
Math.abs(G)<0.000001
){
return null;
}

const cx =
(Dd*E-B*F)/G;

const cy =
(A*F-C*E)/G;

const r2 =
(cx-a.x)*(cx-a.x)+
(cy-a.y)*(cy-a.y);

return{
x:cx,
y:cy,
r2
};

}


/* =========================================
   DELAUNAY
========================================= */

function triangulate(points){

const pts =
points.map(
(p,i)=>({
x:p.x,
y:p.y,
i
})
);

let minX=Infinity;
let minY=Infinity;
let maxX=-Infinity;
let maxY=-Infinity;

for(
const p of pts
){

minX =
Math.min(minX,p.x);

minY =
Math.min(minY,p.y);

maxX =
Math.max(maxX,p.x);

maxY =
Math.max(maxY,p.y);

}

const dx =
maxX-minX;

const dy =
maxY-minY;

const delta =
Math.max(dx,dy);

const midX =
(minX+maxX)/2;

const midY =
(minY+maxY)/2;

const superPts=[

{
x:midX-delta*20,
y:midY-delta*20,
i:-1
},

{
x:midX,
y:midY+delta*20,
i:-2
},

{
x:midX+delta*20,
y:midY-delta*20,
i:-3
}

];

const all =
pts.concat(superPts);

let triangles=[

[
pts.length,
pts.length+1,
pts.length+2
]

];

for(
let pIndex=0;
pIndex<pts.length;
pIndex++
){

const p =
all[pIndex];

const bad=[];

for(
const tri of triangles
){

const a =
all[tri[0]];

const b =
all[tri[1]];

const c =
all[tri[2]];

const circle =
circumcircle(
a,b,c
);

if(!circle)continue;

const dist2 =
(p.x-circle.x)*
(p.x-circle.x)+
(p.y-circle.y)*
(p.y-circle.y);

if(
dist2 <=
circle.r2+0.5
){

bad.push(tri);

}

}

const edges=[];

for(
const tri of bad
){

const e=[

[tri[0],tri[1]],
[tri[1],tri[2]],
[tri[2],tri[0]]

];

for(
const edge of e
){

const reverse =
edges.findIndex(
x =>
x[0]===edge[1] &&
x[1]===edge[0]
);

if(reverse>=0){

edges.splice(
reverse,
1
);

}else{

edges.push(edge);

}

}

}

triangles =
triangles.filter(
tri =>
!bad.includes(tri)
);

for(
const edge of edges
){

triangles.push([
edge[0],
edge[1],
pIndex
]);

}

}

triangles =
triangles.filter(
tri =>
tri[0]<pts.length &&
tri[1]<pts.length &&
tri[2]<pts.length
);

return triangles;

}


/* =========================================
   FULL FACE MORPH 2.10
========================================= */

function denseWarp(
cameraLandmarks
){

if(
!sourceLandmarks ||
!mirroredPhoto
){
return;
}

const sw =
mirroredPhoto.naturalWidth;

const sh =
mirroredPhoto.naturalHeight;

const S =
buildMesh(
sourceLandmarks,
sw,
sh
);

const T =
buildMesh(
cameraLandmarks,
canvas.width,
canvas.height
);


/* -----------------------------------------
   EYES
----------------------------------------- */

const sl =
S[33];

const sr =
S[263];

const tl =
T[33];

const tr =
T[263];

const sourceEye =
Math.hypot(
sr.x-sl.x,
sr.y-sl.y
);

const targetEye =
Math.hypot(
tr.x-tl.x,
tr.y-tl.y
);

if(
sourceEye<1 ||
targetEye<1
){
return;
}

const scale =
targetEye/sourceEye;

const sourceCX =
(sl.x+sr.x)/2;

const sourceCY =
(sl.y+sr.y)/2;

const targetCX =
(tl.x+tr.x)/2;

const targetCY =
(tl.y+tr.y)/2;


/* -----------------------------------------
   WARP
----------------------------------------- */

const strength =
Number(warp.value)/100;

const D=[];

for(
let i=0;
i<S.length;
i++
){

const s =
S[i];

const t =
T[i];

const px =
targetCX+
(s.x-sourceCX)*scale;

const py =
targetCY+
(s.y-sourceCY)*scale;

const dx =
t.x-targetCX;

const dy =
t.y-targetCY;

const dist =
Math.sqrt(
dx*dx+dy*dy
);

const radius =
targetEye*1.75;

let local =
1-Math.min(
1,
dist/radius
);

local =
.35+local*.65;

let x =
px*(1-strength)+
t.x*strength;

let y =
py*(1-strength)+
t.y*strength;

x =
t.x*(strength*local*.35)+
x*(1-strength*local*.35);

y =
t.y*(strength*local*.35)+
y*(1-strength*local*.35);


/*
Ổn định mắt và mũi.
*/

if(
i===33 ||
i===263 ||
i===1
){

x =
t.x*.72+x*.28;

y =
t.y*.72+y*.28;

}

D.push({
x,
y
});

}


/* -----------------------------------------
   FACIAL POINT SELECTION
----------------------------------------- */

const indices=[];

for(
let i=0;
i<S.length;
i++
){

if(i%2===0){
indices.push(i);
}

}

const sourcePoints =
indices.map(
i=>S[i]
);

const targetPoints =
indices.map(
i=>D[i]
);


/* -----------------------------------------
   TRIANGULATE
----------------------------------------- */

const triangles =
triangulate(
targetPoints
);


/* -----------------------------------------
   DRAW
----------------------------------------- */

const alpha =
Number(blend.value)/100;

for(
const tri of triangles
){

const ia =
indices[tri[0]];

const ib =
indices[tri[1]];

const ic =
indices[tri[2]];

drawTriangle(

mirroredPhoto,

S[ia],
S[ib],
S[ic],

D[ia],
D[ib],
D[ic],

alpha

);

}


/* -----------------------------------------
   FEATHER
----------------------------------------- */

applyFeather(
cameraLandmarks
);

}


/* =========================================
   FEATHER
========================================= */

function applyFeather(
landmarks
){

const values =
landmarks.map(
p=>({

x:(1-p.x)*
canvas.width,

y:p.y*
canvas.height

})
);

let minX =
canvas.width;

let maxX = 0;

let minY =
canvas.height;

let maxY = 0;

for(
const p of values
){

minX =
Math.min(
minX,
p.x
);

maxX =
Math.max(
maxX,
p.x
);

minY =
Math.min(
minY,
p.y
);

maxY =
Math.max(
maxY,
p.y
);

}

const cx =
(minX+maxX)/2;

const cy =
(minY+maxY)/2;

const rx =
(maxX-minX)*.55;

const ry =
(maxY-minY)*.57;

const amount =
Number(feather.value)/100;

ctx.save();

ctx.globalCompositeOperation =
"destination-out";

const g =
ctx.createRadialGradient(

cx,
cy,

Math.min(rx,ry)*.60,

cx,
cy,

Math.max(rx,ry)

);

g.addColorStop(
0,
"rgba(0,0,0,0)"
);

g.addColorStop(
.70,
"rgba(0,0,0,0)"
);

g.addColorStop(
.84,
`rgba(0,0,0,${.24*amount})`
);

g.addColorStop(
.93,
`rgba(0,0,0,${.72*amount})`
);

g.addColorStop(
1,
"rgba(0,0,0,1)"
);

ctx.fillStyle =
g;

ctx.beginPath();

ctx.ellipse(
cx,
cy,
rx,
ry,
0,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

}


/* =========================================
   DRAW RESULT
========================================= */

function drawResult(
landmarks
){

ctx.setTransform(
1,0,0,1,0,0
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

faces.textContent =
"1";

if(
sourceLandmarks &&
mirroredPhoto
){

denseWarp(
landmarks
);

photoFaces.textContent =
"1";

photoState.textContent =
"ON";

mode.textContent =
"FACE MORPH";

setStatus(
"FACE MORPH OK"
);

return;

}


/* =========================================
   TRACKING
========================================= */

ctx.fillStyle =
"#34c759";

for(
let i=0;
i<landmarks.length;
i+=3
){

const p =
landmarks[i];

const x =
(1-p.x)*
canvas.width;

const y =
p.y*
canvas.height;

ctx.beginPath();

ctx.arc(
x,
y,
1.5,
0,
Math.PI*2
);

ctx.fill();

}

mode.textContent =
"Tracking";

setStatus(
"FACE MESH OK"
);

}


/* =========================================
   REALTIME
========================================= */

function processFrame(now){

if(!running){
return;
}

cameraFrames++;

if(
now-fpsTime>=1000
){

cameraFPS.textContent =
cameraFrames;

aiFPS.textContent =
aiFrames;

cameraFrames=0;

aiFrames=0;

fpsTime=now;

}

if(
cameraLandmarker &&
video.readyState>=2 &&
video.currentTime!==lastVideoTime
){

lastVideoTime =
video.currentTime;

const t =
performance.now();

try{

const result =
cameraLandmarker.detectForVideo(
video,
now
);

latency.textContent =
(
performance.now()-t
).toFixed(1);

const detected =
result.faceLandmarks || [];

faces.textContent =
detected.length;

if(
detected.length
){

drawResult(
detected[0]
);

}else{

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

faces.textContent =
"0";

setStatus(
"Đang tìm khuôn mặt..."
);

}

aiFrames++;

}catch(error){

console.error(
"FaceLive:",
error
);

setStatus(
"FACE MORPH ERROR"
);

}

}

requestAnimationFrame(
processFrame
);

}


/* =========================================
   START
========================================= */

start.onclick =
async function(){

start.disabled=true;

try{

await startCamera();

await loadMediaPipe();

await createCameraLandmarker();

await createImageLandmarker();

running=true;

message.style.display =
"none";

start.style.display =
"none";

requestAnimationFrame(
processFrame
);

}catch(error){

console.error(
"FaceLive:",
error
);

setStatus(
"LỖI: "+error.message
);

message.innerHTML =

"<b class='red'>" +
"FACELIVE ERROR" +
"</b><br><br>" +

error.message;

message.style.display =
"block";

start.disabled=false;

}

};


/* =========================================
   READY
========================================= */

setStatus(
"Sẵn sàng - START rồi chọn ảnh"
);

</script>
