<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive AI Swap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{z-index:0}canvas{z-index:1;pointer-events:none}.ui{position:fixed;inset:0;z-index:5;padding:12px;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:700}.stats{font-size:11px;line-height:1.55;text-align:right}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:auto}.button,input[type=file]{width:100%;padding:15px;border:0;border-radius:14px;margin-top:8px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}.button:disabled{opacity:.5}input[type=file]{background:#252525;font-weight:400}.notice{font-size:12px;line-height:1.45;margin-top:8px}.hide{display:none!important}#sourcePreview{position:fixed;right:12px;bottom:220px;width:82px;height:104px;object-fit:cover;border:2px solid #34c759;border-radius:12px;z-index:6}input[type=range]{width:100%}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="out"></canvas><img id="sourcePreview" class="hide" alt="Ảnh mẫu"><div class="ui"><div class="top"><div class="panel title">FaceLive AI Swap</div><div class="panel stats">Camera <b id="fps">--</b> FPS<br>Swap <b id="sfps">--</b> FPS<br>AI <b id="lat">--</b> ms<br>Face <b id="face">0</b><br>Engine <b id="engine">AI INSwapper</b></div></div><div class="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" class="button">START CAMERA</button><input id="file" type="file" accept="image/*"><div id="notice" class="panel notice">Chọn ảnh nguồn sau khi camera hoạt động. Pipeline AI theo kiểu Deep-Live-Cam.</div><div id="controls" class="panel hide">Blend <b id="bv">92</b>%<input id="blend" type="range" min="70" max="100" value="92"></div></div></div><script type="module">
const $=id=>document.getElementById(id),video=$('video'),canvas=$('out'),ctx=canvas.getContext('2d',{alpha:true}),start=$('start'),file=$('file'),status=$('status'),preview=$('sourcePreview'),controls=$('controls'),blend=$('blend'),bv=$('bv'),fps=$('fps'),sfps=$('sfps'),lat=$('lat'),face=$('face');
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const ORT_URL='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/+esm';
const ARC_URL='https://huggingface.co/facefusion/models-3.0.0/resolve/main/arcface_w600k_r50.onnx?download=true';
const SWAP_URL='https://huggingface.co/hacksider/deep-live-cam/resolve/main/inswapper_128_fp16.onnx?download=true';
const EMAP_URL='https://raw.githubusercontent.com/somanchiu/ReSwapper/main/emap.npy';
const IDS=[33,263,1,61,291];
const T112=[[38.2946,51.6963],[73.5318,51.5014],[56.0252,71.7366],[41.5493,92.3655],[70.7299,92.2041]];
const T128=T112.map(p=>[p[0]*128/112,p[1]*128/112]);
let FaceLandmarker,FilesetResolver,vision,ort,arcSession,swapSession,emap,sourceEmbedding,sourceImage,sourceReady=false,running=false,preparing=false,lastVideoTime=-1,lastSwap=0,frames=0,swaps=0,t0=performance.now(),smoothPts=null;
const setStatus=s=>status.textContent='● '+s;blend.oninput=()=>bv.textContent=blend.value;
function pts(f,w,h){return IDS.map(i=>[f[i].x*w,f[i].y*h])}
function affine(src,dst){let x0=src[0][0],y0=src[0][1],x1=src[1][0],y1=src[1][1],x2=src[2][0],y2=src[2][1],X0=dst[0][0],Y0=dst[0][1],X1=dst[1][0],Y1=dst[1][1],X2=dst[2][0],Y2=dst[2][1],den=x0*(y1-y2)+x1*(y2-y0)+x2*(y0-y1);let a=(X0*(y1-y2)+X1*(y2-y0)+X2*(y0-y1))/den,b=(Y0*(y1-y2)+Y1*(y2-y0)+Y2*(y0-y1))/den,c=(X0*(x2-x1)+X1*(x0-x2)+X2*(x1-x0))/den,d=(Y0*(x2-x1)+Y1*(x0-x2)+Y2*(x1-x0))/den,e=X0-a*x0-c*y0,f=Y0-b*x0-d*y0;return[a,b,c,d,e,f]}
function warpFive(img,p,size){let out=document.createElement('canvas');out.width=out.height=size;let g=out.getContext('2d'),s=size/112,t=T112.map(q=>[q[0]*s,q[1]*s]),m=affine([p[0],p[1],p[2]],[t[0],t[1],t[2]]);g.setTransform(...m);g.drawImage(img,0,0);g.setTransform(1,0,0,1,0,0);return out}
function imageTensor(c,normalize){let g=c.getContext('2d'),id=g.getImageData(0,0,c.width,c.height).data,n=c.width*c.height,x=new Float32Array(3*n);for(let i=0;i<n;i++){let r=id[i*4],gg=id[i*4+1],b=id[i*4+2];if(normalize){x[i]=(b-127.5)/127.5;x[n+i]=(gg-127.5)/127.5;x[2*n+i]=(r-127.5)/127.5}else{x[i]=b/255;x[n+i]=gg/255;x[2*n+i]=r/255}}return new ort.Tensor('float32',x,[1,3,c.height,c.width])}
function l2(a){let s=0;for(let v of a)s+=v*v;s=Math.sqrt(s)||1;let o=new Float32Array(a.length);for(let i=0;i<a.length;i++)o[i]=a[i]/s;return o}
function parseNpy(buf){let u=new Uint8Array(buf);if(u[0]!==147||u[1]!==78||u[2]!==85||u[3]!==77||u[4]!==80||u[5]!==89)throw Error('EMAP NPY không hợp lệ');let ver=u[6],hl=ver===1?u[8]|u[9]<<8:u[8]|u[9]<<8|u[10]<<16|u[11]<<24,hs=ver===1?10:12,header=new TextDecoder().decode(u.slice(hs,hs+hl)),shape=header.match(/'shape':\s*\(([^)]*)\)/)[1].split(',').map(s=>parseInt(s.trim())).filter(Number.isFinite),off=hs+hl,n=shape.reduce((a,b)=>a*b,1),data=new Float32Array(buf,off,n);return{shape,data:new Float32Array(data)}}
function matVec(v,m,rows,cols){let o=new Float32Array(cols);for(let j=0;j<cols;j++){let s=0;for(let i=0;i<rows;i++)s+=v[i]*m[i*cols+j];o[j]=s}return o}
function outputTensorToCanvas(t){let d=t.data,c=document.createElement('canvas');c.width=c.height=128;let g=c.getContext('2d'),id=g.createImageData(128,128),n=128*128;for(let i=0;i<n;i++){let b=Math.max(0,Math.min(255,Math.round((d[i]+1)*127.5))),gg=Math.max(0,Math.min(255,Math.round((d[n+i]+1)*127.5))),r=Math.max(0,Math.min(255,Math.round((d[2*n+i]+1)*127.5)));id.data[i*4]=r;id.data[i*4+1]=gg;id.data[i*4+2]=b;id.data[i*4+3]=255}g.putImageData(id,0,0);return c}
function blendPaste(base,swapped,targetPts){let m=affine(T128,targetPts),im=invertAffine(m),corn=[[0,0],[128,0],[128,128],[0,128]],q=corners(corn,im),x=Math.floor(Math.min(...q.map(p=>p[0])))-3,y=Math.floor(Math.min(...q.map(p=>p[1])))-3,w=Math.ceil(Math.max(...q.map(p=>p[0])))-x+3,h=Math.ceil(Math.max(...q.map(p=>p[1])))-y+3;if(w<2||h<2)return;let crop=document.createElement('canvas');crop.width=Math.max(1,w);crop.height=Math.max(1,h);let cg=crop.getContext('2d');cg.save();cg.globalAlpha=+blend.value/100;cg.setTransform(im[0],im[1],im[2],im[3],im[4]-x,im[5]-y);cg.drawImage(swapped,0,0);cg.restore();let mask=document.createElement('canvas');mask.width=crop.width;mask.height=crop.height;let mg=mask.getContext('2d');mg.save();mg.setTransform(im[0],im[1],im[2],im[3],im[4]-x,im[5]-y);mg.beginPath();mg.ellipse(64,64,60,62,0,0,Math.PI*2);mg.fill();mg.restore();cg.globalCompositeOperation='destination-in';cg.drawImage(mask,0,0);ctx.drawImage(crop,x,y)}
function invertAffine(m){let a=m[0],b=m[1],c=m[2],d=m[3],e=m[4],f=m[5],det=a*d-b*c;return[d/det,-b/det,-c/det,a/det,(c*f-d*e)/det,(b*e-a*f)/det]}
function corners(q,m){return q.map(p=>[m[0]*p[0]+m[2]*p[1]+m[4],m[1]*p[0]+m[3]*p[1]+m[5]])}
async function initVision(){if(!FaceLandmarker){let m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');FaceLandmarker=m.FaceLandmarker;FilesetResolver=m.FilesetResolver}if(!vision){setStatus('Đang tải Face Landmarker…');let v=await FilesetResolver.forVisionTasks(MP_WASM);vision=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1})}}
async function initAI(){if(arcSession&&swapSession&&emap)return;setStatus('Đang tải AI face swap 277MB…');ort=ort||await import(ORT_URL);ort.env.wasm.numThreads=1;ort.env.logLevel='error';let opts={graphOptimizationLevel:'all',executionProviders:['webgpu','webgl','wasm']};try{arcSession=await ort.InferenceSession.create(ARC_URL,opts)}catch(e){console.warn('ARC GPU fallback',e);arcSession=await ort.InferenceSession.create(ARC_URL,{graphOptimizationLevel:'all',executionProviders:['wasm']})}setStatus('Đang tải INSwapper FP16…');try{swapSession=await ort.InferenceSession.create(SWAP_URL,opts)}catch(e){console.warn('SWAP GPU fallback',e);swapSession=await ort.InferenceSession.create(SWAP_URL,{graphOptimizationLevel:'all',executionProviders:['wasm']})}let r=await fetch(EMAP_URL);emap=parseNpy(await r.arrayBuffer()).data;setStatus('AI đã sẵn sàng')}
async function embeddingFromSource(img,p){let c=warpFive(img,p,112),t=imageTensor(c,true),names=arcSession.inputNames,feed={};feed[names.find(n=>String(arcSession.inputMetadata[n]?.dimensions).includes('112'))||names[0]]=t;let out=await arcSession.run(feed),o=out[arcSession.outputNames[0]].data,e=l2(o),z=matVec(e,emap,512,512);return l2(z)}
async function prepare(){if(!sourceImage||preparing)return;preparing=true;sourceReady=false;smoothPts=null;try{await initVision();setStatus('Đang nhận diện ảnh nguồn…');await vision.setOptions({runningMode:'IMAGE'});let r=vision.detect(sourceImage),fs=r.faceLandmarks||[];if(!fs.length)throw Error('Ảnh nguồn không có khuôn mặt');let p=pts(fs[0],sourceImage.naturalWidth,sourceImage.naturalHeight);await initAI();setStatus('Đang tạo identity embedding…');sourceEmbedding=await embeddingFromSource(sourceImage,p);sourceReady=true;controls.classList.remove('hide');await vision.setOptions({runningMode:'VIDEO'});setStatus('AI SOURCE READY — đưa mặt vào camera')}catch(e){console.error(e);sourceReady=false;setStatus('AI SOURCE ERROR: '+(e.message||e))}finally{preparing=false;try{await vision?.setOptions({runningMode:'VIDEO'})}catch{}}}
file.onchange=()=>{let f=file.files?.[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{sourceImage=im;preview.src=u;preview.classList.remove('hide');prepare()};im.src=u}
function smooth(p){if(!smoothPts){smoothPts=p.map(q=>q.slice());return smoothPts}let k=.42;for(let i=0;i<p.length;i++){smoothPts[i][0]+=((p[i][0]-smoothPts[i][0])*k);smoothPts[i][1]+=((p[i][1]-smoothPts[i][1])*k)}return smoothPts}
async function swapFrame(f){if(!sourceReady||!sourceEmbedding||preparing)return;let t0i=performance.now(),p=smooth(pts(f,canvas.width,canvas.height)),target=warpFive(video,p,128),tensor=imageTensor(target,false),names=swapSession.inputNames,feed={};for(let n of names){let md=swapSession.inputMetadata[n],dims=String(md?.dimensions||'');if(dims.includes('512'))feed[n]=new ort.Tensor('float32',sourceEmbedding,[1,512]);else feed[n]=tensor}let out=await swapSession.run(feed),sw=outputTensorToCanvas(out[swapSession.outputNames[0]]);ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);blendPaste(canvas,sw,p);lat.textContent=(performance.now()-t0i).toFixed(0);swaps++}
function loop(now){if(!running)return;frames++;if(now-t0>1000){fps.textContent=frames;sfps.textContent=swaps;frames=swaps=0;t0=now}if(video.readyState>=2&&video.currentTime!==lastVideoTime&&!preparing){lastVideoTime=video.currentTime;let fs=vision.detectForVideo(video,now).faceLandmarks||[];face.textContent=fs.length;if(fs.length&&sourceReady){if(now-lastSwap>180){lastSwap=now;swapFrame(fs[0]).catch(e=>{console.error(e);setStatus('AI FRAME ERROR: '+e.message)})}setStatus('LIVE AI INSwapper')}else if(fs.length){smoothPts=null;setStatus('Camera OK — chọn ảnh nguồn')}else{smoothPts=null;ctx.clearRect(0,0,canvas.width,canvas.height);setStatus('Đang tìm khuôn mặt…')}}requestAnimationFrame(loop)}
start.onclick=async()=>{start.disabled=true;try{setStatus('Đang mở camera…');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:24}}});video.srcObject=s;await video.play();canvas.width=video.videoWidth||960;canvas.height=video.videoHeight||540;await initVision();running=true;start.textContent='CAMERA ON';$('notice').classList.add('hide');requestAnimationFrame(loop)}catch(e){console.error(e);setStatus('LỖI CAMERA/AI: '+e.message);start.disabled=false}};setStatus('Sẵn sàng — START CAMERA rồi chọn ảnh nguồn');
</script></body></html>
