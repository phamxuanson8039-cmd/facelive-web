<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;

#top{

top:max(14px,env(safe-area-inset-top));

<button
id="choosePhoto"
type="button">

📷 CHỌN ẢNH KHUÔN MẶT

</button>

id="photoInput"
type="file"
accept="image/*">

<script type="module">


/* =========================================
   MEDIAPIPE
========================================= */

import {

FaceLandmarker,
FilesetResolver

}

from

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/* =========================================
   ELEMENTS
========================================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const choosePhoto =
document.getElementById("choosePhoto");

const photoInput =
document.getElementById("photoInput");

const photoPreview =
document.getElementById("photoPreview");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const cameraFPS =
document.getElementById("cameraFPS");

const aiFPS =
document.getElementById("aiFPS");

const latency =
document.getElementById("latency");

const faces =
document.getElementById("faces");

const photoState =
document.getElementById("photoState");


/* =========================================
   STATE
========================================= */

let landmarker = null;

let stream = null;

let running = false;

let lastVideoTime = -1;

let cameraFrames = 0;

let aiFrames = 0;

let fpsStart =
performance.now();


/* =========================================
   STATUS
========================================= */

function setStatus(text){

status.textContent =
"● " + text;

}


/* =========================================
   PHOTO BUTTON
========================================= */

choosePhoto.addEventListener(
"click",
function(){

console.log(
"PHOTO BUTTON CLICK"
);

photoInput.click();

}
);


/* =========================================
   PHOTO SELECT
========================================= */

photoInput.addEventListener(
"change",
function(event){

console.log(
"PHOTO CHANGE"
);


const file =
event.target.files &&
event.target.files[0];


if(!file){

setStatus(
"Chưa chọn ảnh"
);

return;

}


/*
Kiểm tra loại file.
*/

if(
!file.type.startsWith("image/")
){

setStatus(
"File không phải ảnh"
);

return;

}


/*
Đọc ảnh bằng FileReader.
*/

const reader =
new FileReader();


reader.onload =
function(e){

photoPreview.src =
e.target.result;

photoPreview.style.display =
"block";


photoState.textContent =
"ON";


setStatus(
"ẢNH ĐÃ CHỌN OK"
);


message.innerHTML =

"<b class='green'>" +

"ẢNH ĐÃ CHỌN OK" +

"</b><br>" +

"Ảnh mẫu đã được tải";

message.style.display =
"block";


setTimeout(
function(){

message.style.display =
"none";

},
2000
);

};


reader.onerror =
function(){

setStatus(
"Lỗi đọc ảnh"
);

};


reader.readAsDataURL(file);

}
);


/* =========================================
   CAMERA
========================================= */

async function startCamera(){

setStatus(
"Đang mở camera..."
);


if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Camera API không được hỗ trợ"
);

}


stream =
await navigator.mediaDevices.getUserMedia({

audio:false,

video:{

facingMode:"user",

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30
}

}

});


video.srcObject =
stream;


await video.play();


await new Promise(
resolve => {

if(
video.videoWidth > 0
){

resolve();

}else{

video.onloadedmetadata =
resolve;

}

}
);


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


setStatus(
"CAMERA OK"
);

}


/* =========================================
   MEDIAPIPE
========================================= */

async function loadAI(){

setStatus(
"Đang tải MediaPipe..."
);


const vision =
await FilesetResolver.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

);


landmarker =
await FaceLandmarker.createFromOptions(

vision,

{

baseOptions:{

modelAssetPath:

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

delegate:"GPU"

},

runningMode:"VIDEO",

numFaces:1,

minFaceDetectionConfidence:.5,

minFacePresenceConfidence:.5,

minTrackingConfidence:.5,

outputFaceBlendshapes:true,

outputFacialTransformationMatrixes:true

}

);


setStatus(
"MEDIAPIPE OK"
);

}


/* =========================================
   DRAW FACE MESH
========================================= */

function drawMesh(
landmarks
){

ctx.setTransform(
1,0,0,1,0,0
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.fillStyle =
"#34c759";


for(
let i=0;
i<landmarks.length;
i+=3
){

const p =
landmarks[i];


const x =
(1-p.x) *
canvas.width;


const y =
p.y *
canvas.height;


ctx.beginPath();


ctx.arc(
x,
y,
1.6,
0,
Math.PI*2
);


ctx.fill();

}

}


/* =========================================
   REALTIME
========================================= */

function processFrame(now){

if(
!running
){

return;

}


cameraFrames++;


if(
now-fpsStart >= 1000
){

cameraFPS.textContent =
cameraFrames;

aiFPS.textContent =
aiFrames;

cameraFrames =
0;

aiFrames =
0;

fpsStart =
now;

}


if(
landmarker &&
video.readyState >= 2 &&
video.currentTime !== lastVideoTime
){

lastVideoTime =
video.currentTime;


const t =
performance.now();


try{

const result =
landmarker.detectForVideo(
video,
now
);


latency.textContent =
(
performance.now()-t
).toFixed(1);


const detected =
result.faceLandmarks || [];


faces.textContent =
detected.length;


if(
detected.length > 0
){

drawMesh(
detected[0]
);

setStatus(
"FACE MESH OK"
);

}else{

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

setStatus(
"Đang tìm khuôn mặt..."
);

}


aiFrames++;


}catch(error){

console.error(
"FaceLive AI:",
error
);

setStatus(
"FACE MESH ERROR"
);

}

}


requestAnimationFrame(
processFrame
);

}


/* =========================================
   START
========================================= */

start.addEventListener(
"click",
async function(){

start.disabled =
true;


try{

await startCamera();

await loadAI();


running =
true;


message.style.display =
"none";


start.style.display =
"none";


requestAnimationFrame(
processFrame
);


}catch(error){

console.error(
"FaceLive:",
error
);


setStatus(
"LỖI: " +
error.message
);


message.innerHTML =

"<b class='red'>" +

"FACELIVE ERROR" +

"</b><br><br>" +

error.message;


message.style.display =
"block";


start.disabled =
false;

}

});

</script>

</body>
</html>
