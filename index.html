

            dot.classList.remove(
                "active"
            );


            statusText.textContent =
                "Lỗi: " +
                error.name;


            message.innerHTML =
                "<b>FaceLive Error</b><br>" +
                "<span class='error'>" +
                error.message +
                "</span>";


            message.style.display =
                "block";


            start.disabled =
                false;
        }
    }
);

</script>

</body>
</html>
