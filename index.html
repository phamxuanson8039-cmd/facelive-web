<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>FaceLive 0.4 TEST</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:-apple-system,
    BlinkMacSystemFont,
    sans-serif;
}

#app{
    padding:20px;
}

h2{
    margin-top:20px;
}

button{
    width:100%;
    padding:18px;
    border:0;
    border-radius:16px;
    background:#fff;
    color:#000;
    font-size:18px;
    font-weight:700;
}

#status{
    margin-top:20px;
    padding:18px;
    background:#191919;
    border-radius:15px;
    white-space:pre-wrap;
    line-height:1.6;
}

video{
    display:none;
    width:100%;
    margin-top:20px;
    border-radius:15px;
}

</style>
</head>

<body>

<div id="app">

<h2>FaceLive 0.4</h2>

<button id="button">
TEST CAMERA
</button>

<div id="status">
Chưa kiểm tra
</div>

<video
id="video"
autoplay
playsinline
muted>
</video>

</div>


<script>

var button =
document.getElementById("button");

var status =
document.getElementById("status");

var video =
document.getElementById("video");


function log(text){

status.textContent = text;

}


button.onclick = function(){

log(
"① JAVASCRIPT ĐÃ CHẠY\n\n" +
"Đang kiểm tra camera..."
);


if(
!navigator.mediaDevices
){

log(
"❌ Không có navigator.mediaDevices"
);

return;

}


if(
!navigator.mediaDevices.getUserMedia
){

log(
"❌ Không có getUserMedia"
);

return;

}


navigator.mediaDevices
.getUserMedia({

video:true,

audio:false

})

.then(function(stream){

video.srcObject =
stream;

video.style.display =
"block";

log(
"② CAMERA OK\n\n" +

"JavaScript: OK\n" +

"Camera API: OK\n\n" +

"FaceLive có thể tiếp tục."
);

})

.catch(function(error){

log(
"❌ CAMERA ERROR\n\n" +

"Name: " +
error.name +

"\n\nMessage: " +
error.message
);

});

};

</script>

</body>
</html>
