<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive AI Swap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{visibility:hidden}.ui{position:fixed;inset:0;z-index:5;padding:12px;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:700}.stats{font-size:11px;line-height:1.55;text-align:right}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:auto}.button,input[type=file]{width:100%;padding:15px;border:0;border-radius:14px;margin-top:8px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}.button:disabled{opacity:.5}input[type=file]{background:#252525;font-weight:400}.notice{font-size:12px;line-height:1.45;margin-top:8px}.hide{display:none!important}#sourcePreview{position:fixed;right:12px;bottom:220px;width:82px;height:104px;object-fit:cover;border:2px solid #34c759;border-radius:12px;z-index:6}input[type=range]{width:100%}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="out"></canvas><img id="sourcePreview" class="hide" alt="Ảnh mẫu"><div class="ui"><div class="top"><div class="panel title">FaceLive AI Swap</div><div class="panel stats">Camera <b id="fps">--</b> FPS<br>Swap <b id="sfps">--</b> FPS<br>AI <b id="lat">--</b> ms<br>Face <b id="face">0</b><br>Engine <b id="engine">--</b></div></div><div class="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" class="button">START CAMERA</button><input id="file" type="file" accept="image/*"><div id="notice" class="panel notice">Chọn ảnh khuôn mặt sau khi camera hoạt động. AI chạy trực tiếp trên iPhone.</div><div id="controls" class="panel hide">Blend <b id="bv">100</b>%<input id="blend" type="range" min="50" max="100" value="100"></div></div></div><script type="module">
const $=id=>document.getElementById(id),video=$('video'),canvas=$('out'),ctx=canvas.getContext('2d',{alpha:false}),start=$('start'),file=$('file'),status=$('status'),preview=$('sourcePreview'),controls=$('controls'),blend=$('blend'),bv=$('bv'),fps=$('fps'),sfps=$('sfps'),lat=$('lat'),face=$('face'),engine=$('engine');
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const ARC_URL='https://huggingface.co/facefusion/models-3.0.0/resolve/main/arcface_w600k_r50.onnx?download=true',SWAP_URL='https://huggingface.co/facefusion/models-3.0.0/resolve/main/inswapper_128.onnx?download=true',EMAP_URL='https://raw.githubusercontent.com/somanchiu/ReSwapper/main/emap.npy';
const IDS=[33,263,1,61,291],T112=[[38.2946,51.6963],[73.5318,51.5014],[56.0252,71.7366],[41.5493,92.3655],[70.7299,92.2041]];
let ort,FaceLandmarker,FilesetResolver,vision,arcSession,swapSession,emap=null,sourceImage,sourceLatent,running=false,preparing=false,busy=false,lastVideoTime=-1,lastSwap=0,frames=0,swaps=0,t0=performance.now();
const swapCanvas=document.createElement('canvas');swapCanvas.width=swapCanvas.height=128;const swapCtx=swapCanvas.getContext('2d');const layer=document.createElement('canvas');let layerCtx;const setStatus=s=>status.textContent='● '+s;blend.oninput=()=>bv.textContent=blend.value;
function sim(src,dst){let sx=0,sy=0,dx=0,dy=0;for(let i=0;i<5;i++){sx+=src[i][0];sy+=src[i][1];dx+=dst[i][0];dy+=dst[i][1]}sx/=5;sy/=5;dx/=5;dy/=5;let a=0,b=0,n=0;for(let i=0;i<5;i++){let x=src[i][0]-sx,y=src[i][1]-sy,X=dst[i][0]-dx,Y=dst[i][1]-dy;a+=x*X+y*Y;b+=x*Y-y*X;n+=x*x+y*y}let c=a/n,d=b/n;return[c,d,-d,c,dx-c*sx+d*sy,dy-d*sx-c*sy]}
function inv(m){let[a,b,c,d,e,f]=m,z=a*d-b*c;return[d/z,-b/z,-c/z,a/z,(c*f-d*e)/z,(b*e-a*f)/z]}
function pts(f,w,h,mirror=false){return IDS.map(i=>[(mirror?1-f[i].x:f[i].x)*w,f[i].y*h])}
function align(img,p,size){let c=document.createElement('canvas');c.width=c.height=size;let m=sim(p,T112.map(q=>[q[0]*size/112,q[1]*size/112])),g=c.getContext('2d');g.setTransform(...m);g.drawImage(img,0,0);return c}
function tensor(c,size,arc){let d=c.getContext('2d').getImageData(0,0,size,size).data,a=new Float32Array(3*size*size),n=size*size;for(let y=0;y<size;y++)for(let x=0;x<size;x++){let k=(y*size+x)*4,r=d[k],g=d[k+1],b=d[k+2];a[y*size+x]=arc?(r-127.5)/127.5:r/255;a[n+y*size+x]=arc?(g-127.5)/127.5:g/255;a[2*n+y*size+x]=arc?(b-127.5)/127.5:b/255}return new ort.Tensor('float32',a,[1,3,size,size])}
function npy(buf){let u=new Uint8Array(buf),major=u[6],h=major===1?u[8]+256*u[9]:u[8]+256*u[9]+65536*u[10]+16777216*u[11],s=new TextDecoder().decode(u.slice(10,10+h)).match(/'shape':\s*\(([^)]*)\)/);if(!s)throw Error('EMAP shape lỗi');let sh=s[1].split(',').filter(Boolean).map(Number),d=u.slice(10+h);return{sh,data:new Float32Array(d.buffer,d.byteOffset,d.byteLength/4)}}
async function loadEmap(){let r=await fetch(EMAP_URL,{cache:'force-cache'});if(!r.ok)throw Error('EMAP HTTP '+r.status);let n=npy(await r.arrayBuffer());if(n.sh[0]!==512||n.sh[1]!==512)throw Error('EMAP phải 512x512');emap=n.data}
async function loadRuntime(){if(ort)return;setStatus('Đang tải ONNX Runtime…');ort=await import('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/+esm');ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';await loadEmap()}
async function initVision(){if(!FaceLandmarker){let m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');FaceLandmarker=m.FaceLandmarker;FilesetResolver=m.FilesetResolver}if(!vision){setStatus('Đang tải Face Landmarker…');let v=await FilesetResolver.forVisionTasks(MP_WASM);vision=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1})}}
async function session(name,url){setStatus('Đang tải '+name+'…');let r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw Error(name+' HTTP '+r.status);let b=await r.arrayBuffer();for(let ep of ['webgl','wasm'])try{let s=await ort.InferenceSession.create(b,{executionProviders:[ep],graphOptimizationLevel:'all'});engine.textContent=ep;return s}catch(e){console.warn(name,ep,e)}throw Error(name+' không khởi động được trên iPhone')}
function latent(v){let n=Math.hypot(...v)||1,z=new Float32Array(512);for(let j=0;j<512;j++){let q=0;for(let i=0;i<512;i++)q+=(v[i]/n)*emap[i*512+j];z[j]=q}let n2=Math.hypot(...z)||1;for(let i=0;i<512;i++)z[i]/=n2;return z}
async function prepare(){if(!sourceImage||preparing)return;preparing=true;sourceLatent=null;try{setStatus('Đang chuẩn bị ảnh nguồn…');await loadRuntime();await initVision();await vision.setOptions({runningMode:'IMAGE'});let r=vision.detect(sourceImage),fs=r.faceLandmarks||[];if(!fs.length)throw Error('Ảnh mẫu không có khuôn mặt rõ');if(!arcSession)arcSession=await session('ArcFace',ARC_URL);let a=align(sourceImage,pts(fs[0],sourceImage.naturalWidth,sourceImage.naturalHeight,false),112),o=await arcSession.run({[arcSession.inputNames[0]]:tensor(a,112,true)}),v=o[arcSession.outputNames[0]]?.data;if(!v||v.length<512)throw Error('ArcFace không trả embedding 512');sourceLatent=latent(v);if(arcSession){try{await arcSession.release()}catch{}arcSession=null}await vision.setOptions({runningMode:'VIDEO'});if(!swapSession)swapSession=await session('InSwapper',SWAP_URL);let ins=swapSession.inputNames.map((n,i)=>n+':'+JSON.stringify(swapSession.inputMetadata[i]?.shape||[])).join(' | ');setStatus('READY — '+ins);controls.classList.remove('hide')}catch(e){sourceLatent=null;console.error(e);try{if(vision)await vision.setOptions({runningMode:'VIDEO'})}catch{}setStatus('SOURCE ERROR: '+e.message)}finally{preparing=false}}
file.onchange=()=>{let f=file.files?.[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{sourceImage=im;preview.src=u;preview.classList.remove('hide');prepare()};im.src=u}
async function swapFrame(f){if(!sourceLatent||!swapSession||busy||preparing)return;busy=true;let t=performance.now();try{let aiP=pts(f,canvas.width,canvas.height,false),displayP=pts(f,canvas.width,canvas.height,true),target=tensor(align(video,aiP,128),128,false),vals={};for(let i=0;i<swapSession.inputNames.length;i++){let n=swapSession.inputNames[i],md=swapSession.inputMetadata[i],shape=md?.shape||[],isLatent=(shape.length===2&&Number(shape[shape.length-1])===512)||/source|latent|embedding/i.test(n);vals[n]=isLatent?new ort.Tensor('float32',sourceLatent,[1,512]):target}let out=(await swapSession.run(vals))[swapSession.outputNames[0]],d=out.data,n=128*128;if(d.length<3*n)throw Error('InSwapper output lỗi');let mn=Infinity,mx=-Infinity;for(let i=0;i<3*n;i++){mn=Math.min(mn,d[i]);mx=Math.max(mx,d[i])}let scale=mx>2?255:1,off=mn<0?-1:0;let id=swapCtx.createImageData(128,128);for(let i=0;i<n;i++){id.data[4*i]=Math.max(0,Math.min(255,(d[i]-off)*255/scale));id.data[4*i+1]=Math.max(0,Math.min(255,(d[n+i]-off)*255/scale));id.data[4*i+2]=Math.max(0,Math.min(255,(d[2*n+i]-off)*255/scale));id.data[4*i+3]=255}swapCtx.putImageData(id,0,0);layerCtx.setTransform(1,0,0,1,0,0);layerCtx.clearRect(0,0,canvas.width,canvas.height);layerCtx.setTransform(...inv(sim(displayP,T112.map(q=>[q[0]*128/112,q[1]*128/112]))));layerCtx.drawImage(swapCanvas,0,0);let cx=(displayP[0][0]+displayP[1][0]+displayP[3][0]+displayP[4][0])/4,cy=(displayP[0][1]+displayP[1][1]+displayP[3][1]+displayP[4][1])/4,rx=Math.hypot(displayP[1][0]-displayP[0][0],displayP[1][1]-displayP[0][1])*.98,ry=rx*1.18;ctx.save();ctx.globalAlpha=+blend.value/100;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.clip();ctx.drawImage(layer,0,0);ctx.restore();lat.textContent=(performance.now()-t).toFixed(0);swaps++}catch(e){console.error(e);setStatus('SWAP ERROR: '+e.message)}finally{busy=false}}
function drawBase(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.scale(-1,1);ctx.drawImage(video,-canvas.width,0,canvas.width,canvas.height);ctx.restore()}
function loop(now){if(!running)return;try{frames++;if(now-t0>1000){fps.textContent=frames;sfps.textContent=swaps;frames=swaps=0;t0=now}if(video.readyState>=2&&video.currentTime!==lastVideoTime&&!preparing){lastVideoTime=video.currentTime;let fs=vision.detectForVideo(video,now).faceLandmarks||[];face.textContent=fs.length;drawBase();if(fs.length&&sourceLatent){if(now-lastSwap>160){lastSwap=now;swapFrame(fs[0])}setStatus('LIVE AI SWAP')}else if(fs.length)setStatus('Camera OK — chọn ảnh mẫu');else setStatus('Đang tìm khuôn mặt…')}}catch(e){console.error(e);setStatus('VIDEO ERROR: '+e.message);running=false}requestAnimationFrame(loop)}
start.onclick=async()=>{start.disabled=true;try{setStatus('Đang mở camera…');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:24}}});video.srcObject=s;await video.play();canvas.width=video.videoWidth||960;canvas.height=video.videoHeight||540;layer.width=canvas.width;layer.height=canvas.height;layerCtx=layer.getContext('2d');await loadRuntime();await initVision();running=true;start.textContent='CAMERA ON';$('notice').classList.add('hide');requestAnimationFrame(loop)}catch(e){console.error(e);setStatus('LỖI CAMERA/AI: '+e.message);start.disabled=false}};setStatus('Sẵn sàng — START CAMERA rồi chọn ảnh');
</script></body></html>
