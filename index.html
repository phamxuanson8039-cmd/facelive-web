<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive AI Swap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{z-index:0}canvas{z-index:1;pointer-events:none}.ui{position:fixed;inset:0;z-index:5;padding:12px;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:700}.stats{font-size:11px;line-height:1.55;text-align:right}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:auto}.button,input[type=file]{width:100%;padding:15px;border:0;border-radius:14px;margin-top:8px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}.button:disabled{opacity:.5}input[type=file]{background:#252525;font-weight:400}.notice{font-size:12px;line-height:1.45;margin-top:8px}.hide{display:none!important}#sourcePreview{position:fixed;right:12px;bottom:250px;width:82px;height:104px;object-fit:cover;border:2px solid #34c759;border-radius:12px;z-index:6}#aiPreview{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none}input[type=range]{width:100%}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="out"></canvas><img id="aiPreview" class="hide" alt="AI result"><img id="sourcePreview" class="hide" alt="Ảnh mẫu"><div class="ui"><div class="top"><div class="panel title">FaceLive AI Swap</div><div class="panel stats">Camera <b id="fps">--</b> FPS<br>AI <b id="sfps">--</b> FPS<br>AI <b id="lat">--</b> ms<br>Face <b id="face">0</b><br>Engine <b id="engine">Remote INSwapper</b></div></div><div class="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" class="button">START CAMERA</button><input id="file" type="file" accept="image/*"><button id="ai" class="button" disabled>AI SWAP CURRENT FRAME</button><div id="notice" class="panel notice">Camera chạy trực tiếp trên iPhone. AI swap xử lý từ xa để Safari không phải tải model 278MB và không bị reset.</div><div id="controls" class="panel hide">Blend <b id="bv">90</b>%<input id="blend" type="range" min="60" max="100" value="90"></div></div></div><script type="module">
const $=id=>document.getElementById(id),video=$('video'),canvas=$('out'),ctx=canvas.getContext('2d',{alpha:true}),start=$('start'),file=$('file'),aiBtn=$('ai'),status=$('status'),preview=$('sourcePreview'),aiPreview=$('aiPreview'),controls=$('controls'),blend=$('blend'),bv=$('bv'),fps=$('fps'),sfps=$('sfps'),lat=$('lat'),face=$('face');
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',GRADIO='https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js';
const IDS=[33,263,1,61,291];let FaceLandmarker,FilesetResolver,vision,sourceImage,sourcePrepared=false,running=false,preparing=false,lastVideoTime=-1,frames=0,aiCount=0,t0=performance.now(),smoothPts=null,remoteApp=null,remoteBusy=false;
const setStatus=s=>status.textContent='● '+s;blend.oninput=()=>bv.textContent=blend.value;
function pts(f,w,h){return IDS.map(i=>[f[i].x*w,f[i].y*h])}
function smoothTarget(p){if(!smoothPts){smoothPts=p.map(q=>q.slice());return smoothPts}let k=.34;for(let i=0;i<p.length;i++){smoothPts[i][0]+=((p[i][0]-smoothPts[i][0])*k);smoothPts[i][1]+=((p[i][1]-smoothPts[i][1])*k)}return smoothPts}
async function initVision(){if(!FaceLandmarker){let m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');FaceLandmarker=m.FaceLandmarker;FilesetResolver=m.FilesetResolver}if(!vision){setStatus('Đang tải Face Landmarker…');let v=await FilesetResolver.forVisionTasks(MP_WASM);vision=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1})}}
async function prepare(){if(!sourceImage||preparing)return;preparing=true;sourcePrepared=false;smoothPts=null;try{setStatus('Đang kiểm tra ảnh nguồn…');await initVision();await vision.setOptions({runningMode:'IMAGE'});let r=vision.detect(sourceImage),fs=r.faceLandmarks||[];if(!fs.length)throw Error('Ảnh nguồn không có khuôn mặt rõ');sourcePrepared=true;aiBtn.disabled=false;controls.classList.remove('hide');setStatus('Ảnh nguồn sẵn sàng — bấm AI SWAP')}catch(e){sourcePrepared=false;aiBtn.disabled=true;setStatus('SOURCE ERROR: '+e.message)}finally{preparing=false;try{await vision?.setOptions({runningMode:'VIDEO'})}catch{}}}
file.onchange=()=>{let f=file.files?.[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{sourceImage=im;preview.src=u;preview.classList.remove('hide');aiPreview.classList.add('hide');prepare()};im.src=u}
function clearLayer(){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,canvas.width,canvas.height)}
async function remoteAI(){if(!sourcePrepared||remoteBusy||!video.videoWidth)return;remoteBusy=true;aiBtn.disabled=true;let t=performance.now();try{setStatus('Đang gửi frame lên AI…');let c=document.createElement('canvas'),scale=Math.min(1,640/video.videoWidth);c.width=Math.round(video.videoWidth*scale);c.height=Math.round(video.videoHeight*scale);c.getContext('2d').drawImage(video,0,0,c.width,c.height);let blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));let mod=await import(GRADIO);remoteApp=remoteApp||await mod.Client.connect('tonyassi/face-swap');let result=await remoteApp.predict('/swap_faces',[sourceImage,blob]);let d=result?.data?.[0],url=d?.url||d?.path||d;if(!url)throw Error('AI không trả về ảnh');aiPreview.src=url;aiPreview.classList.remove('hide');aiCount++;lat.textContent=(performance.now()-t).toFixed(0);setStatus('AI FACE SWAP OK — INSwapper từ server')}catch(e){console.error(e);setStatus('REMOTE AI ERROR: '+(e.message||e))}finally{remoteBusy=false;aiBtn.disabled=!sourcePrepared}}
aiBtn.onclick=remoteAI;
function loop(now){if(!running)return;frames++;if(now-t0>1000){fps.textContent=frames;sfps.textContent=aiCount;frames=aiCount=0;t0=now}if(video.readyState>=2&&video.currentTime!==lastVideoTime&&!preparing){lastVideoTime=video.currentTime;let fs=vision.detectForVideo(video,now).faceLandmarks||[];face.textContent=fs.length;if(fs.length&&sourcePrepared){smoothTarget(pts(fs[0],canvas.width,canvas.height));if(aiPreview.classList.contains('hide'))setStatus('LIVE TRACKING — bấm AI SWAP')}else if(fs.length){smoothPts=null;clearLayer();setStatus('Camera OK — chọn ảnh nguồn')}else{smoothPts=null;clearLayer();setStatus('Đang tìm khuôn mặt…')}}requestAnimationFrame(loop)}
start.onclick=async()=>{start.disabled=true;try{setStatus('Đang mở camera…');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:24}}});video.srcObject=s;await video.play();canvas.width=video.videoWidth||960;canvas.height=video.videoHeight||540;await initVision();running=true;start.textContent='CAMERA ON';$('notice').classList.add('hide');requestAnimationFrame(loop)}catch(e){console.error(e);setStatus('LỖI CAMERA: '+e.message);start.disabled=false}};setStatus('Sẵn sàng — START CAMERA rồi chọn ảnh nguồn');
</script></body></html>
