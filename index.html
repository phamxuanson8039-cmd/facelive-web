<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive AI Swap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}video,#aiPreview{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{z-index:0}#aiPreview{z-index:2;pointer-events:none}.ui{position:fixed;inset:0;z-index:5;padding:12px;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:700}.stats{font-size:11px;line-height:1.55;text-align:right}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:auto}.button,input[type=file]{width:100%;padding:14px;border:0;border-radius:14px;margin-top:8px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}.button:disabled{opacity:.45}input[type=file]{background:#252525;font-weight:400}.notice{font-size:12px;line-height:1.45;margin-top:8px}.hide{display:none!important}#sourcePreview{position:fixed;right:12px;bottom:250px;width:82px;height:104px;object-fit:cover;border:2px solid #34c759;border-radius:12px;z-index:6}#apiInfo{max-height:110px;overflow:auto;font-size:10px;white-space:pre-wrap}</style></head><body><video id="video" autoplay playsinline muted></video><img id="aiPreview" class="hide" alt="AI result"><img id="sourcePreview" class="hide" alt="Ảnh nguồn"><div class="ui"><div class="top"><div class="panel title">FaceLive AI Swap</div><div class="panel stats">Camera <b id="fps">--</b> FPS<br>AI <b id="sfps">--</b> FPS<br>Latency <b id="lat">--</b> ms<br>Face <b id="face">0</b><br>Remote INSwapper</div></div><div class="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" class="button">START CAMERA</button><input id="file" type="file" accept="image/*"><button id="ai" class="button" disabled>START LIVE AI SWAP</button><div id="notice" class="panel notice">AI xử lý từ xa. Bản này ưu tiên ổn định trên iPhone.</div><div id="apiInfo" class="panel hide"></div></div></div><script type="module">
const $=id=>document.getElementById(id),video=$('video'),start=$('start'),file=$('file'),aiBtn=$('ai'),status=$('status'),preview=$('sourcePreview'),aiPreview=$('aiPreview'),fps=$('fps'),sfps=$('sfps'),lat=$('lat'),face=$('face'),apiInfo=$('apiInfo');
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',GRADIO='https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js';
let FaceLandmarker,FilesetResolver,vision,sourceImage,sourceFile,sourcePrepared=false,running=false,live=false,preparing=false,lastVideoTime=-1,frames=0,aiCount=0,t0=performance.now(),lastSent=0,remoteApp=null,remoteBusy=false,remoteApi=null,sourceRef=null;
const setStatus=s=>status.textContent='● '+s;
async function initVision(){if(!FaceLandmarker){let m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');FaceLandmarker=m.FaceLandmarker;FilesetResolver=m.FilesetResolver}if(!vision){setStatus('Đang tải Face Landmarker…');let v=await FilesetResolver.forVisionTasks(MP_WASM);vision=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1})}}
async function prepare(){if(!sourceImage||preparing)return;preparing=true;sourcePrepared=false;try{await initVision();await vision.setOptions({runningMode:'IMAGE'});let r=vision.detect(sourceImage);if(!(r.faceLandmarks||[]).length)throw Error('Ảnh nguồn không có khuôn mặt rõ');sourcePrepared=true;aiBtn.disabled=false;setStatus('Ảnh nguồn OK — sẵn sàng LIVE AI')}catch(e){setStatus('SOURCE ERROR: '+(e.message||e));aiBtn.disabled=true}finally{preparing=false;try{await vision.setOptions({runningMode:'VIDEO'})}catch{}}}
file.onchange=()=>{let f=file.files?.[0];if(!f)return;live=false;remoteBusy=false;sourceFile=f;sourceRef=null;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{sourceImage=im;preview.src=u;preview.classList.remove('hide');aiPreview.classList.add('hide');prepare()};im.src=u}
async function ensureRemote(){if(remoteApp)return remoteApp;setStatus('Đang kết nối AI server…');let mod=await import(GRADIO);remoteApp=await mod.Client.connect('tonyassi/face-swap');try{remoteApi=await remoteApp.view_api()}catch{remoteApi=await remoteApp.view_api(true)}let named=remoteApi?.named_endpoints||{};apiInfo.textContent='API: '+Object.keys(named).join(', ')+'\nEndpoint: '+(named['/swap_faces']?'/swap_faces':'không tìm thấy');apiInfo.classList.remove('hide');if(!named['/swap_faces'])throw Error('Không tìm thấy /swap_faces');return remoteApp}
async function makeFrame(){let c=document.createElement('canvas'),scale=Math.min(1,512/video.videoWidth);c.width=Math.max(1,Math.round(video.videoWidth*scale));c.height=Math.max(1,Math.round(video.videoHeight*scale));c.getContext('2d').drawImage(video,0,0,c.width,c.height);return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('Không tạo được frame')),'image/jpeg',.72))}
async function swapFrame(){if(!live||remoteBusy||!sourcePrepared||!video.videoWidth)return;remoteBusy=true;let t=performance.now();try{let mod=await import(GRADIO),app=await ensureRemote();if(!sourceRef)sourceRef=mod.handle_file(sourceFile);let target=await makeFrame();setStatus('AI đang xử lý frame…');let job=app.submit('/swap_faces',[sourceRef,mod.handle_file(target)]);for await(const msg of job){if(msg.type==='status'){let s=msg.stage||msg.status?.status||msg.status;if(s) setStatus('AI '+s)}if(msg.type==='data'){let d=msg.data?.[0],url=typeof d==='string'?d:(d?.url||null);if(!url&&d?.path&&/^https?:\/\//.test(d.path))url=d.path;if(!url&&d?.path)url='https://tonyassi-face-swap.hf.space/file='+encodeURIComponent(d.path);if(url){aiPreview.src=url;aiPreview.classList.remove('hide')}}}aiCount++;lat.textContent=Math.round(performance.now()-t)}catch(e){console.error(e);setStatus('REMOTE AI ERROR: '+(e?.message||e));live=false;aiBtn.textContent='START LIVE AI SWAP'}finally{remoteBusy=false}}
function tick(now){if(!running)return;frames++;if(now-t0>1000){fps.textContent=frames;sfps.textContent=aiCount;frames=0;aiCount=0;t0=now}if(video.readyState>=2&&video.currentTime!==lastVideoTime&&!preparing){lastVideoTime=video.currentTime;let fs=vision.detectForVideo(video,now).faceLandmarks||[];face.textContent=fs.length;if(live&&!remoteBusy&&fs.length&&now-lastSent>950){lastSent=now;swapFrame()}else if(fs.length&&!live)setStatus('Camera OK — LIVE AI sẵn sàng')}requestAnimationFrame(tick)}
aiBtn.onclick=()=>{if(!sourcePrepared)return;live=!live;aiBtn.textContent=live?'STOP LIVE AI SWAP':'START LIVE AI SWAP';if(live){lastSent=0;setStatus('LIVE AI đang chạy…')}else{setStatus('LIVE AI đã dừng')}};
start.onclick=async()=>{start.disabled=true;try{setStatus('Đang mở camera…');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:24}}});video.srcObject=s;await video.play();await initVision();running=true;start.textContent='CAMERA ON';$('notice').classList.add('hide');requestAnimationFrame(tick)}catch(e){setStatus('LỖI CAMERA: '+(e.message||e));start.disabled=false}};
window.addEventListener('unhandledrejection',e=>setStatus('JS ERROR: '+(e.reason?.message||e.reason||'unknown')));window.addEventListener('error',e=>setStatus('JS ERROR: '+(e.message||'unknown')));setStatus('Sẵn sàng — START CAMERA rồi chọn ảnh nguồn');
</script></body></html>
