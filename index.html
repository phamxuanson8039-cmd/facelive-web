<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>FaceLive 2.0</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

#app{
    position:fixed;
    inset:0;
    background:#000;
}

#video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    background:#000;
}

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;
}

.panel{
    background:rgba(0,0,0,.66);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border-radius:15px;
}

#top{
    position:absolute;

    top:max(15px,env(safe-area-inset-top));

    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    z-index:20;
}

#title{
    padding:12px 14px;

    font-size:19px;
    font-weight:700;
}

#stats{
    padding:11px 13px;

    text-align:right;

    font-size:12px;
    line-height:1.6;

    font-variant-numeric:tabular-nums;
}

#bottom{
    position:absolute;

    left:12px;
    right:12px;

    bottom:max(15px,env(safe-area-inset-bottom));

    z-index:20;
}

#status{
    display:inline-block;

    padding:10px 13px;

    margin-bottom:8px;

    font-size:13px;
}

button,
label{
    display:block;

    width:100%;

    padding:14px;

    border:0;

    border-radius:16px;

    background:rgba(255,255,255,.18);

    color:#fff;

    font-size:15px;
    font-weight:700;

    text-align:center;

    margin-top:7px;
}

button:disabled{
    opacity:.5;
}

input{
    display:none;
}

#message{
    position:absolute;

    left:20px;
    right:20px;

    top:50%;

    transform:translateY(-50%);

    text-align:center;

    font-size:15px;

    line-height:1.6;

    z-index:10;

    pointer-events:none;
}

.green{
    color:#34c759;
}

.red{
    color:#ff453a;
}

</style>
</head>

<body>

<div id="app">

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>

<div id="message">

<b>FaceLive 2.0</b>

<br>

<span style="opacity:.7">
Realtime Face Shape Warp
</span>

</div>


<div id="top">

<div
id="title"
class="panel">

FaceLive 2.0

</div>


<div
id="stats"
class="panel">

Camera:
<b id="cameraFPS">--</b>
FPS

<br>

AI:
<b id="aiFPS">--</b>
FPS

<br>

Inference:
<b id="latency">--</b>
ms

<br>

Faces:
<b id="faces">0</b>

<br>

Mode:
<b id="mode">Tracking</b>

</div>

</div>


<div id="bottom">

<div
id="status"
class="panel">

● Camera chưa khởi động

</div>


<button id="start">

START FACELIVE

</button>


<label for="photo">

📷 CHỌN ẢNH KHUÔN MẶT MẪU

</label>


<input
id="photo"
type="file"
accept="image/*">

</div>

</div>


<script type="module">

/*
==================================================
MEDIAPIPE
==================================================
*/

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/*
==================================================
ELEMENTS
==================================================
*/

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const photo =
document.getElementById("photo");

const cameraFPSElement =
document.getElementById("cameraFPS");

const aiFPSElement =
document.getElementById("aiFPS");

const latencyElement =
document.getElementById("latency");

const facesElement =
document.getElementById("faces");

const modeElement =
document.getElementById("mode");


/*
==================================================
STATE
==================================================
*/

let landmarker = null;

let stream = null;

let running = false;

let sourceImage = null;

let sourcePoints = null;

let lastVideoTime = -1;


/*
==================================================
FPS
==================================================
*/

let cameraFrames = 0;

let aiFrames = 0;

let fpsTime =
performance.now();


/*
==================================================
STATUS
==================================================
*/

function setStatus(text){

    status.textContent =
    "● " + text;

}


/*
==================================================
CAMERA
==================================================
*/

async function startCamera(){

    setStatus(
        "Đang mở camera..."
    );


    stream =
    await navigator
    .mediaDevices
    .getUserMedia({

        audio:false,

        video:{

            facingMode:{
                ideal:"user"
            },

            width:{
                ideal:1280
            },

            height:{
                ideal:720
            },

            frameRate:{
                ideal:30,
                max:30
            }

        }

    });


    video.srcObject =
    stream;


    await video.play();


    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;


    setStatus(
        "CAMERA OK"
    );

}


/*
==================================================
AI
==================================================
*/

async function loadAI(){

    setStatus(
        "Đang tải AI..."
    );


    const vision =
    await FilesetResolver
    .forVisionTasks(

        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

    );


    landmarker =
    await FaceLandmarker
    .createFromOptions(

        vision,

        {

            baseOptions:{

                modelAssetPath:

                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                delegate:"GPU"

            },

            runningMode:"VIDEO",

            numFaces:1,

            minFaceDetectionConfidence:.5,

            minFacePresenceConfidence:.5,

            minTrackingConfidence:.5,

            outputFaceBlendshapes:true,

            outputFacialTransformationMatrixes:true

        }

    );


    setStatus(
        "FACE MESH OK"
    );

}


/*
==================================================
SOURCE IMAGE
==================================================
*/

photo.addEventListener(
"change",
function(event){

    const file =
    event.target.files[0];

    if(!file){
        return;
    }


    const url =
    URL.createObjectURL(file);


    const img =
    new Image();


    img.onload =
    function(){

        sourceImage =
        img;


        /*
        Build a normalized
        reference face shape.

        These are the important
        anatomical regions.
        */

        sourcePoints =
        buildReferenceShape();


        modeElement.textContent =
        "Face Warp";


        message.innerHTML =

        "<b class='green'>" +
        "ẢNH MẪU OK" +
        "</b><br>" +

        "FaceLive đang lấy hình dạng khuôn mặt";


        message.style.display =
        "block";


        setStatus(
            "Ảnh mẫu đã sẵn sàng"
        );

    };


    img.src =
    url;

});


/*
==================================================
REFERENCE SHAPE
==================================================

Normalized coordinates.

The image is treated as a face
reference rather than simply
being placed over the camera.
==================================================
*/

function buildReferenceShape(){

    return {

        forehead:{
            x:.50,
            y:.18
        },

        leftEye:{
            x:.35,
            y:.38
        },

        rightEye:{
            x:.65,
            y:.38
        },

        nose:{
            x:.50,
            y:.52
        },

        leftNose:{
            x:.45,
            y:.56
        },

        rightNose:{
            x:.55,
            y:.56
        },

        leftMouth:{
            x:.39,
            y:.65
        },

        mouthCenter:{
            x:.50,
            y:.65
        },

        rightMouth:{
            x:.61,
            y:.65
        },

        chin:{
            x:.50,
            y:.82
        },

        leftFace:{
            x:.20,
            y:.53
        },

        rightFace:{
            x:.80,
            y:.53
        }

    };

}


/*
==================================================
POINT
==================================================
*/

function point(
landmarks,
index
){

    const p =
    landmarks[index];


    return {

        x:
        (1-p.x) *
        canvas.width,

        y:
        p.y *
        canvas.height

    };

}


/*
==================================================
CURRENT FACE SHAPE
==================================================
*/

function getFaceShape(
landmarks
){

    return {

        forehead:
        point(
            landmarks,
            10
        ),

        leftEye:
        point(
            landmarks,
            33
        ),

        rightEye:
        point(
            landmarks,
            263
        ),

        nose:
        point(
            landmarks,
            1
        ),

        leftNose:
        point(
            landmarks,
            98
        ),

        rightNose:
        point(
            landmarks,
            327
        ),

        leftMouth:
        point(
            landmarks,
            61
        ),

        mouthCenter:
        point(
            landmarks,
            13
        ),

        rightMouth:
        point(
            landmarks,
            291
        ),

        chin:
        point(
            landmarks,
            152
        ),

        leftFace:
        point(
            landmarks,
            234
        ),

        rightFace:
        point(
            landmarks,
            454
        )

    };

}


/*
==================================================
DISTANCE
==================================================
*/

function distance(
a,
b
){

    const dx =
    b.x-a.x;

    const dy =
    b.y-a.y;

    return Math.sqrt(
        dx*dx+
        dy*dy
    );

}


/*
==================================================
DRAW WARPED FACE
==================================================
*/

function drawWarp(
landmarks
){

    if(!sourceImage){
        return;
    }


    const face =
    getFaceShape(
        landmarks
    );


    /*
    ==============================================
    REAL FACE GEOMETRY
    ==============================================
    */

    const eyeDistance =
    distance(
        face.leftEye,
        face.rightEye
    );


    const centerX =
    (
        face.leftEye.x+
        face.rightEye.x
    )/2;


    const centerY =
    (
        face.leftEye.y+
        face.rightEye.y
    )/2;


    /*
    ==============================================
    REFERENCE SCALE
    ==============================================
    */

    const scale =
    eyeDistance /
    (
        sourceImage.naturalWidth*.30
    );


    /*
    ==============================================
    TARGET REFERENCE
    ==============================================

    The reference shape is converted
    to the current face coordinate system.
    */

    function target(
        p
    ){

        return {

            x:
            centerX+
            (
                p.x-.50
            )*
            sourceImage.naturalWidth*
            scale,

            y:
            centerY+
            (
                p.y-.38
            )*
            sourceImage.naturalWidth*
            scale

        };

    }


    /*
    ==============================================
    REFERENCE POINTS
    ==============================================
    */

    const r =
    sourcePoints;


    const t = {

        forehead:
        target(r.forehead),

        leftEye:
        target(r.leftEye),

        rightEye:
        target(r.rightEye),

        nose:
        target(r.nose),

        leftNose:
        target(r.leftNose),

        rightNose:
        target(r.rightNose),

        leftMouth:
        target(r.leftMouth),

        mouthCenter:
        target(r.mouthCenter),

        rightMouth:
        target(r.rightMouth),

        chin:
        target(r.chin),

        leftFace:
        target(r.leftFace),

        rightFace:
        target(r.rightFace)

    };


    /*
    ==============================================
    FACE MASK
    ==============================================
    */

    const mask =
    document.createElement("canvas");


    mask.width =
    canvas.width;

    mask.height =
    canvas.height;


    const m =
    mask.getContext("2d");


    const cx =
    (
        t.leftFace.x+
        t.rightFace.x
    )/2;


    const cy =
    (
        t.forehead.y+
        t.chin.y
    )/2;


    const rx =
    distance(
        t.leftFace,
        t.rightFace
    )*.55;


    const ry =
    distance(
        t.forehead,
        t.chin
    )*.56;


    const gradient =
    m.createRadialGradient(

        cx,
        cy,
        Math.min(rx,ry)*.55,

        cx,
        cy,
        Math.max(rx,ry)

    );


    gradient.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );


    gradient.addColorStop(
        .72,
        "rgba(255,255,255,.95)"
    );


    gradient.addColorStop(
        .90,
        "rgba(255,255,255,.45)"
    );


    gradient.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );


    m.fillStyle =
    gradient;


    m.beginPath();


    m.ellipse(

        cx,
        cy,
        rx,
        ry,

        0,
        0,
        Math.PI*2

    );


    m.fill();


    /*
    ==============================================
    DRAW SOURCE FACE
    ==============================================
    */

    ctx.save();


    ctx.globalAlpha =
    .94;


    ctx.globalCompositeOperation =
    "source-over";


    /*
    Reference image is placed according
    to the target eye geometry.

    This creates the first stable
    face-shape warp stage.
    */

    const sourceCX =
    sourceImage.naturalWidth*.50;


    const sourceCY =
    sourceImage.naturalHeight*.38;


    ctx.translate(
        centerX,
        centerY
    );


    ctx.scale(
        scale*.96,
        scale*.96
    );


    ctx.translate(
        -sourceCX,
        -sourceCY
    );


    ctx.drawImage(
        sourceImage,
        0,
        0
    );


    ctx.restore();


    /*
    ==============================================
    MASK
    ==============================================
    */

    ctx.save();


    ctx.globalCompositeOperation =
    "destination-in";


    ctx.drawImage(
        mask,
        0,
        0
    );


    ctx.restore();

}


/*
==================================================
TRACKING DRAW
==================================================
*/

function drawTracking(
landmarks
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(sourceImage){

        drawWarp(
            landmarks
        );


        modeElement.textContent =
        "Face Warp";


        setStatus(
            "FACE WARP OK"
        );


        return;

    }


    /*
    No source image:
    show face mesh.
    */

    ctx.fillStyle =
    "#34c759";


    for(
        let i=0;
        i<landmarks.length;
        i+=4
    ){

        const p =
        landmarks[i];


        const x =
        (1-p.x)*
        canvas.width;


        const y =
        p.y*
        canvas.height;


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            1.6,
            0,
            Math.PI*2
        );


        ctx.fill();

    }


    modeElement.textContent =
    "Tracking";


    setStatus(
        "FACE MESH OK"
    );

}


/*
==================================================
REALTIME LOOP
==================================================
*/

function processFrame(
now
){

    if(
        !running ||
        !landmarker ||
        video.readyState<2
    ){

        requestAnimationFrame(
            processFrame
        );

        return;

    }


    cameraFrames++;


    /*
    FPS
    */

    if(
        now-fpsTime>=1000
    ){

        cameraFPSElement.textContent =
        cameraFrames;


        aiFPSElement.textContent =
        aiFrames;


        cameraFrames =
        0;


        aiFrames =
        0;


        fpsTime =
        now;

    }


    /*
    NEW VIDEO FRAME
    */

    if(
        video.currentTime !==
        lastVideoTime
    ){

        lastVideoTime =
        video.currentTime;


        const t0 =
        performance.now();


        try{

            const result =
            landmarker.detectForVideo(
                video,
                now
            );


            latencyElement.textContent =
            (
                performance.now()-t0
            ).toFixed(1);


            const detected =
            result.faceLandmarks ||
            [];


            facesElement.textContent =
            detected.length;


            if(
                detected.length
            ){

                drawTracking(
                    detected[0]
                );

            }
            else{

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                setStatus(
                    "Đang tìm khuôn mặt..."
                );

            }


            aiFrames++;

        }
        catch(error){

            console.error(
                error
            );


            setStatus(
                "AI ERROR"
            );

        }

    }


    requestAnimationFrame(
        processFrame
    );

}


/*
==================================================
START
==================================================
*/

start.addEventListener(
"click",
async function(){

    start.disabled =
    true;


    try{

        await startCamera();

        await loadAI();


        running =
        true;


        start.style.display =
        "none";


        message.style.display =
        "none";


        setStatus(
            "FACE MESH OK"
        );


        requestAnimationFrame(
            processFrame
        );

    }
    catch(error){

        console.error(
            error
        );


        setStatus(
            "FACELIVE ERROR"
        );


        message.innerHTML =

        "<b class='red'>" +

        "FACELIVE ERROR" +

        "</b><br><br>" +

        error.name +

        "<br>" +

        error.message;


        message.style.display =
        "block";


        start.disabled =
        false;

    }

});

</script>

</body>
</html>
