<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive AI Swap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}#video,#out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#video{transform:scaleX(-1);visibility:hidden}#out{z-index:1}.ui{position:fixed;inset:0;z-index:5;padding:12px;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:700}.stats{font-size:11px;line-height:1.55;text-align:right}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:auto}.button,input[type=file]{width:100%;padding:15px;border:0;border-radius:14px;margin-top:8px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}.button:disabled{opacity:.5}input[type=file]{background:#252525;font-weight:400}.green{color:#34c759}.red{color:#ff453a}.notice{font-size:12px;line-height:1.45;margin-top:8px}#sourcePreview{position:fixed;right:12px;bottom:220px;width:82px;height:104px;object-fit:cover;border:2px solid #34c759;border-radius:12px;z-index:6}.hide{display:none!important}.bar{margin-top:8px;font-size:12px}input[type=range]{width:100%}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="out"></canvas><img id="sourcePreview" class="hide" alt="Ảnh mẫu"><div class="ui"><div class="top"><div class="panel title">FaceLive AI Swap</div><div class="panel stats">Camera <b id="fps">--</b> FPS<br>Swap <b id="sfps">--</b> FPS<br>AI <b id="lat">--</b> ms<br>Face <b id="face">0</b><br>Engine <b id="engine">--</b></div></div><div class="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" class="button">START AI SWAP</button><input id="file" type="file" accept="image/*"><div id="notice" class="panel notice">AI chạy trên thiết bị. Chỉ dùng ảnh bạn có quyền sử dụng.</div><div id="controls" class="panel hide"><div class="bar">Blend <b id="bv">100</b>%</div><input id="blend" type="range" min="50" max="100" value="100"></div></div></div><script>'use strict';
const $=id=>document.getElementById(id),video=$('video'),canvas=$('out'),ctx=canvas.getContext('2d'),start=$('start'),file=$('file'),status=$('status'),preview=$('sourcePreview'),controls=$('controls'),blend=$('blend'),bv=$('bv'),fps=$('fps'),sfps=$('sfps'),lat=$('lat'),face=$('face'),engine=$('engine');
let ort=null,FaceLandmarker,FilesetResolver,cameraAI,imageAI,swapSession,arcSession,emap=null,sourceImage,sourceFace,sourceLatent,running=false,lastVideoTime=-1,frameCount=0,swapCount=0,fpsTime=performance.now(),busy=false;
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const ARC_URL='https://github.com/facefusion/facefusion-assets/releases/download/models-3.0.0/arcface_w600k_r50.onnx',SWAP_URL='https://github.com/facefusion/facefusion-assets/releases/download/models-3.0.0/inswapper_128.onnx',EMAP_URL='https://raw.githubusercontent.com/somanchiu/ReSwapper/main/emap.npy';
const IDS=[33,263,1,61,291],T112=[[38.2946,51.6963],[73.5318,51.5014],[56.0252,71.7366],[41.5493,92.3655],[70.7299,92.2041]];
blend.oninput=()=>bv.textContent=blend.value;const setStatus=s=>status.textContent='● '+s;
function sim(src,dst){let sx=0,sy=0,dx=0,dy=0;for(let i=0;i<5;i++){sx+=src[i][0];sy+=src[i][1];dx+=dst[i][0];dy+=dst[i][1]}sx/=5;sy/=5;dx/=5;dy/=5;let a=0,b=0,den=0;for(let i=0;i<5;i++){let x=src[i][0]-sx,y=src[i][1]-sy,X=dst[i][0]-dx,Y=dst[i][1]-dy;a+=x*X+y*Y;b+=x*Y-y*X;den+=x*x+y*y}const c=a/den,d=b/den;return[c,d,-d,c,dx-c*sx+d*sy,dy-d*sx-c*sy]}
function inverse(m){const[a,b,c,d,e,f]=m,z=a*d-b*c;return[d/z,-b/z,-c/z,a/z,(c*f-d*e)/z,(b*e-a*f)/z]}
function face5(f,w,h){return IDS.map(i=>[(1-f[i].x)*w,f[i].y*h])}
function aligned(img,p,size){const cv=document.createElement('canvas');cv.width=cv.height=size;const dst=T112.map(q=>[q[0]*size/112,q[1]*size/112]),m=sim(p,dst),g=cv.getContext('2d');g.setTransform(...m);g.drawImage(img,0,0);return cv}
function tensor(cv,size,arc){const d=cv.getContext('2d').getImageData(0,0,size,size).data,a=new Float32Array(3*size*size),n=size*size;for(let y=0;y<size;y++)for(let x=0;x<size;x++){const k=(y*size+x)*4,r=d[k],g=d[k+1],b=d[k+2];if(arc){a[y*size+x]=(r-127.5)/127.5;a[n+y*size+x]=(g-127.5)/127.5;a[2*n+y*size+x]=(b-127.5)/127.5}else{a[y*size+x]=r/255;a[n+y*size+x]=g/255;a[2*n+y*size+x]=b/255}}return new ort.Tensor('float32',a,[1,3,size,size])}
function parseNpy(buf){const u=new Uint8Array(buf);if(u[0]!==147)throw Error('EMAP không hợp lệ');const major=u[6],hlen=major===1?u[8]+256*u[9]:u[8]+256*u[9]+65536*u[10]+16777216*u[11],head=new TextDecoder().decode(u.slice(10,10+hlen)),shape=head.match(/'shape':\s*\(([^)]*)\)/);if(!shape)throw Error('Không đọc được EMAP');const s=shape[1].split(',').filter(Boolean).map(Number),d=u.slice(10+hlen);return{s,data:new Float32Array(d.buffer,d.byteOffset,Math.floor(d.byteLength/4))}}
async function loadEmap(){setStatus('Đang tải EMAP...');const r=await fetch(EMAP_URL,{cache:'force-cache'});if(!r.ok)throw Error('Không tải được EMAP');const n=parseNpy(await r.arrayBuffer());if(n.s.length!==2||n.s[0]!==512||n.s[1]!==512)throw Error('EMAP sai kích thước');emap=n.data}
async function makeSession(name,url){setStatus('Đang khởi tạo '+name+'...');const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw Error(name+' model HTTP '+r.status);const b=await r.arrayBuffer();if(b.byteLength<1000000)throw Error(name+' model tải không đầy đủ');const eps=['wasm','webgl'];for(const ep of eps){try{const s=await ort.InferenceSession.create(b,{executionProviders:[ep],graphOptimizationLevel:'all'});engine.textContent=ep;return s}catch(e){console.warn(name,ep,e)}}throw Error(name+' không khởi động được trên iPhone')}
async function initAI(){setStatus('Đang tải Face AI...');const m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');FaceLandmarker=m.FaceLandmarker;FilesetResolver=m.FilesetResolver;const v=await FilesetResolver.forVisionTasks(MP_WASM);cameraAI=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1});imageAI=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'IMAGE',numFaces:1});ort=await import('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/+esm');ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/';await loadEmap();arcSession=await makeSession('ArcFace',ARC_URL);if(!arcSession||typeof arcSession.run!=='function')throw Error('ArcFace session không hợp lệ');swapSession=await makeSession('InSwapper',SWAP_URL);if(!swapSession||typeof swapSession.run!=='function')throw Error('InSwapper session không hợp lệ');setStatus('AI SWAP ENGINE OK')}
function makeLatent(v){let n=0;for(let i=0;i<v.length;i++)n+=v[i]*v[i];n=Math.sqrt(n)||1;const z=new Float32Array(512);for(let j=0;j<512;j++){let q=0;for(let i=0;i<512;i++)q+=(v[i]/n)*emap[i*512+j];z[j]=q}let n2=0;for(const x of z)n2+=x*x;n2=Math.sqrt(n2)||1;for(let i=0;i<512;i++)z[i]/=n2;return z}
async function prepareSource(){if(!sourceImage)return;setStatus('Đang nhận diện ảnh mẫu...');const r=imageAI.detect(sourceImage),fs=r.faceLandmarks||[];if(!fs.length)throw Error('Ảnh mẫu không thấy khuôn mặt');sourceFace=fs[0];const p=face5(sourceFace,sourceImage.naturalWidth,sourceImage.naturalHeight),a=aligned(sourceImage,p,112);const inputName=arcSession.inputNames[0];const out=await arcSession.run({[inputName]:tensor(a,112,true)});const ov=out[arcSession.outputNames[0]];if(!ov||ov.data.length<512)throw Error('ArcFace không trả embedding 512');sourceLatent=makeLatent(ov.data);controls.classList.remove('hide');setStatus('Ảnh mẫu sẵn sàng')}
file.onchange=()=>{const f=file.files&&file.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image;im.onload=async()=>{sourceImage=im;preview.src=u;preview.classList.remove('hide');try{await prepareSource()}catch(e){console.error(e);setStatus('SOURCE ERROR: '+e.message)}};im.onerror=()=>setStatus('Không đọc được ảnh');im.src=u};
async function swapFrame(tf){if(!sourceLatent||busy)return;busy=true;const t0=performance.now();try{const p=face5(tf,canvas.width,canvas.height),a=aligned(video,p,128),target=tensor(a,128,false),names=swapSession.inputNames,vals={};if(names.length<2)throw Error('InSwapper thiếu 2 input');for(const n of names){const meta=swapSession.inputMetadata?.[n],shape=meta?.dimensions||[];if(shape.length===2||String(n).toLowerCase().includes('source'))vals[n]=new ort.Tensor('float32',sourceLatent,[1,512]);else vals[n]=target}const r=await swapSession.run(vals),o=r[swapSession.outputNames[0]],d=o.data;if(d.length<3*128*128)throw Error('InSwapper output không hợp lệ');const cv=document.createElement('canvas');cv.width=cv.height=128;const g=cv.getContext('2d'),id=g.createImageData(128,128),n=16384;for(let i=0;i<n;i++){id.data[i*4]=Math.max(0,Math.min(255,d[i]*255));id.data[i*4+1]=Math.max(0,Math.min(255,d[n+i]*255));id.data[i*4+2]=Math.max(0,Math.min(255,d[2*n+i]*255));id.data[i*4+3]=255}g.putImageData(id,0,0);const M=sim(p,T112),I=inverse(M),layer=document.createElement('canvas');layer.width=canvas.width;layer.height=canvas.height;const lg=layer.getContext('2d');lg.setTransform(...I);lg.drawImage(cv,0,0);const cx=(p[0][0]+p[1][0]+p[3][0]+p[4][0])/4,cy=(p[0][1]+p[1][1]+p[3][1]+p[4][1])/4,rx=Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1])*.98,ry=rx*1.18;ctx.save();ctx.globalAlpha=Number(blend.value)/100;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.clip();ctx.drawImage(layer,0,0);ctx.restore();lat.textContent=(performance.now()-t0).toFixed(0);swapCount++}catch(e){console.error(e);setStatus('SWAP ERROR: '+e.message)}finally{busy=false}}
function loop(now){if(!running)return;frameCount++;if(now-fpsTime>=1000){fps.textContent=frameCount;sfps.textContent=swapCount;frameCount=swapCount=0;fpsTime=now}if(video.readyState>=2&&video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;const r=cameraAI.detectForVideo(video,now),fs=r.faceLandmarks||[];face.textContent=fs.length;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.scale(-1,1);ctx.drawImage(video,-canvas.width,0,canvas.width,canvas.height);ctx.restore();if(fs.length&&sourceLatent){swapFrame(fs[0]);setStatus('LIVE AI SWAP')}else if(fs.length)setStatus('Camera OK — chọn ảnh mẫu');else setStatus('Đang tìm khuôn mặt...')}requestAnimationFrame(loop)}
start.onclick=async()=>{start.disabled=true;try{setStatus('Đang mở camera...');const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}});video.srcObject=s;await video.play();if(!video.videoWidth)await new Promise(r=>video.addEventListener('loadedmetadata',r,{once:true}));canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||720;await initAI();running=true;start.classList.add('hide');$('notice').classList.add('hide');requestAnimationFrame(loop)}catch(e){console.error(e);setStatus('LỖI: '+e.message);start.disabled=false}};setStatus('Sẵn sàng — START AI SWAP rồi chọn ảnh');</script></body></html>
