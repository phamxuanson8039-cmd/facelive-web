<!doctype html>
<html lang="vi">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>FaceLive 0.8</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:-apple-system,
BlinkMacSystemFont,
"Helvetica Neue",
Arial,sans-serif;
}

#app{
position:fixed;
inset:0;
background:#000;
}

#video{
position:absolute;
inset:0;

width:100%;
height:100%;

object-fit:cover;

transform:scaleX(-1);

background:#000;
}

#canvas{
position:absolute;
inset:0;

width:100%;
height:100%;

pointer-events:none;
}

.panel{
background:rgba(0,0,0,.65);

backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border-radius:15px;
}

#top{
position:absolute;

top:max(15px,env(safe-area-inset-top));

left:12px;
right:12px;

display:flex;

justify-content:space-between;

align-items:flex-start;

z-index:20;
}

#title{
padding:12px 14px;

font-size:19px;

font-weight:700;
}

#stats{
padding:11px 13px;

font-size:12px;

line-height:1.6;

text-align:right;

font-variant-numeric:tabular-nums;
}

#bottom{
position:absolute;

left:12px;
right:12px;

bottom:max(15px,env(safe-area-inset-bottom));

z-index:20;
}

#status{
display:inline-block;

padding:10px 13px;

margin-bottom:10px;

font-size:13px;
}

button,
label{

display:block;

width:100%;

padding:16px;

border:0;

border-radius:16px;

background:rgba(255,255,255,.18);

color:#fff;

font-size:16px;

font-weight:700;

text-align:center;

margin-top:8px;
}

input{
display:none;
}

#message{

position:absolute;

left:20px;
right:20px;

top:50%;

transform:translateY(-50%);

text-align:center;

font-size:15px;

line-height:1.6;

z-index:10;

pointer-events:none;
}

.green{
color:#34c759;
}

.red{
color:#ff453a;
}

</style>

</head>


<body>

<div id="app">


<video
id="video"
autoplay
playsinline
muted>
</video>


<canvas id="canvas"></canvas>


<div id="message">

<b>FaceLive 0.8</b>

<br>

<span style="opacity:.7">
Face Overlay Test
</span>

</div>


<div id="top">

<div id="title" class="panel">
FaceLive 0.8
</div>


<div id="stats" class="panel">

Camera:
<b id="cameraFPS">--</b> FPS

<br>

AI:
<b id="aiFPS">--</b> FPS

<br>

Inference:
<b id="latency">--</b> ms

<br>

Faces:
<b id="faces">0</b>

<br>

Mode:
<b id="mode">Tracking</b>

</div>

</div>


<div id="bottom">


<div id="status" class="panel">

● Chưa khởi động

</div>


<button id="start">
START FACELIVE
</button>


<label for="photo">

📷 CHỌN ẢNH KHUÔN MẶT

</label>


<input
id="photo"
type="file"
accept="image/*">


</div>

</div>


<script type="module">


/*
==================================================
MEDIAPIPE
==================================================
*/

import {
FaceLandmarker,
FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1";


/*
==================================================
ELEMENTS
==================================================
*/

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const photo =
document.getElementById("photo");

const cameraFPS =
document.getElementById("cameraFPS");

const aiFPS =
document.getElementById("aiFPS");

const latency =
document.getElementById("latency");

const faces =
document.getElementById("faces");

const mode =
document.getElementById("mode");


/*
==================================================
STATE
==================================================
*/

let stream = null;

let landmarker = null;

let running = false;

let lastVideoTime = -1;

let sourceImage = null;

let cameraFrames = 0;

let aiFrames = 0;

let fpsStart =
performance.now();


/*
==================================================
STATUS
==================================================
*/

function setStatus(text){

status.textContent =
"● " + text;

}


/*
==================================================
LOAD AI
==================================================
*/

async function loadAI(){

setStatus(
"Đang tải AI..."
);


const vision =
await FilesetResolver
.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

);


landmarker =
await FaceLandmarker
.createFromModelPath(

vision,

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

);


await landmarker
.setOptions({

runningMode:"VIDEO",

numFaces:1,

minFaceDetectionConfidence:.5,

minFacePresenceConfidence:.5,

minTrackingConfidence:.5

});


setStatus(
"AI Face Tracking OK"
);

}


/*
==================================================
CAMERA
==================================================
*/

async function startCamera(){

setStatus(
"Đang mở camera..."
);


stream =
await navigator.mediaDevices
.getUserMedia({

audio:false,

video:{

facingMode:{
ideal:"user"
},

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30,
max:30
}

}

});


video.srcObject =
stream;


await video.play();


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


setStatus(
"Camera OK"
);

}


/*
==================================================
PHOTO
==================================================
*/

photo.onchange =
function(event){

const file =
event.target.files[0];


if(!file){

return;

}


const url =
URL.createObjectURL(file);


const img =
new Image();


img.onload =
function(){

sourceImage =
img;

mode.textContent =
"Overlay";

setStatus(
"Ảnh nguồn đã sẵn sàng"
);

message.innerHTML =

"<b class='green'>" +
"ẢNH ĐÃ TẢI" +
"</b><br>" +

"Đưa khuôn mặt vào camera";


message.style.display =
"block";

};


img.onerror =
function(){

setStatus(
"Không đọc được ảnh"
);

};


img.src =
url;

};


/*
==================================================
DRAW OVERLAY
==================================================
*/

function drawOverlay(landmarks){

if(!sourceImage){

return;

}


/*
Find face bounds
*/

let minX=1;

let minY=1;

let maxX=0;

let maxY=0;


for(
const p of landmarks
){

minX =
Math.min(
minX,
p.x
);

minY =
Math.min(
minY,
p.y
);

maxX =
Math.max(
maxX,
p.x
);

maxY =
Math.max(
maxY,
p.y
);

}


/*
Mirror coordinates
*/

const left =
(1-maxX) *
canvas.width;

const top =
minY *
canvas.height;

const width =
(maxX-minX) *
canvas.width;

const height =
(maxY-minY) *
canvas.height;


/*
Add small margin
*/

const marginX =
width * .10;

const marginY =
height * .08;


const x =
left-marginX;

const y =
top-marginY;

const w =
width+marginX*2;

const h =
height+marginY*2;


/*
Clip into oval
*/

ctx.save();


ctx.beginPath();

ctx.ellipse(

x+w/2,

y+h/2,

w/2,

h/2,

0,

0,

Math.PI*2

);

ctx.clip();


/*
Draw source image

Mirror source image so
it behaves naturally with
the mirrored camera.
*/

ctx.translate(
x+w,
y
);

ctx.scale(
-1,
1
);


ctx.drawImage(

sourceImage,

0,
0,
w,
h

);


ctx.restore();

}


/*
==================================================
DRAW TRACKING
==================================================
*/

function drawTracking(result){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const detected =
result.faceLandmarks || [];


faces.textContent =
detected.length;


if(
detected.length === 0
){

setStatus(
"Đang tìm khuôn mặt..."
);

return;

}


const landmarks =
detected[0];


if(sourceImage){

drawOverlay(
landmarks
);

setStatus(
"FACE OVERLAY OK"
);

}else{

setStatus(
"FACE TRACKING OK"
);


/*
Draw green points
only when no source
image is selected.
*/

ctx.fillStyle =
"#34c759";


for(
let i=0;
i<landmarks.length;
i+=3
){

const p =
landmarks[i];


const x =
(1-p.x) *
canvas.width;

const y =
p.y *
canvas.height;


ctx.beginPath();

ctx.arc(
x,
y,
1.6,
0,
Math.PI*2
);

ctx.fill();

}

}

}


/*
==================================================
REALTIME LOOP
==================================================
*/

function processFrame(now){

if(
!running ||
!landmarker ||
video.readyState<2
){

requestAnimationFrame(
processFrame
);

return;

}


cameraFrames++;


if(
now-fpsStart>=1000
){

cameraFPS.textContent =
cameraFrames;

aiFPS.textContent =
aiFrames;

cameraFrames=0;

aiFrames=0;

fpsStart=now;

}


if(
video.currentTime !==
lastVideoTime
){

lastVideoTime =
video.currentTime;


const t =
performance.now();


try{

const result =
landmarker
.detectForVideo(
video,
now
);


latency.textContent =
(
performance.now()-t
).toFixed(1);


drawTracking(
result
);


aiFrames++;


}catch(error){

console.error(error);

setStatus(
"AI ERROR"
);

}

}


requestAnimationFrame(
processFrame
);

}


/*
==================================================
START
==================================================
*/

start.onclick =
async function(){

start.disabled=true;


try{

await startCamera();

await loadAI();


running=true;


start.style.display =
"none";


message.style.display =
"none";


requestAnimationFrame(
processFrame
);


}catch(error){

console.error(error);


setStatus(
"LỖI: " +
error.name
);


message.innerHTML =

"<b class='red'>" +
"FACELIVE ERROR" +
"</b><br><br>" +

error.name +
"<br>" +

error.message;


message.style.display =
"block";


start.disabled=false;

}

};

</script>

</body>

</html>
