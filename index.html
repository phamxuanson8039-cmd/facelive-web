<script type="module">


/* =========================================
   MEDIAPIPE
========================================= */

let FaceLandmarker = null;

let FilesetResolver = null;


/* =========================================
   ELEMENTS
========================================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const cameraFPS =
document.getElementById("cameraFPS");

const aiFPS =
document.getElementById("aiFPS");

const latency =
document.getElementById("latency");

const faces =
document.getElementById("faces");

const photoFaces =
document.getElementById("photoFaces");

const photoState =
document.getElementById("photoState");

const mode =
document.getElementById("mode");

const photoInput =
document.getElementById("photoInput");

const photoPreview =
document.getElementById("photoPreview");

const blendBox =
document.getElementById("blendBox");

const blend =
document.getElementById("blend");


/* =========================================
   STATE
========================================= */

let stream = null;

let landmarker = null;

let running = false;

let lastVideoTime = -1;

let cameraFrames = 0;

let aiFrames = 0;

let fpsTime =
performance.now();


/*
ẢNH MẪU
*/

let sourceImage = null;


/*
Landmark của ảnh mẫu.
*/

let sourceLandmarks = null;


/* =========================================
   STATUS
========================================= */

function setStatus(text){

status.textContent =
"● " + text;

}


/* =========================================
   PHOTO
========================================= */

photoInput.addEventListener(
"change",
async function(event){

const file =
event.target.files &&
event.target.files[0];


if(!file){
return;
}


if(
!file.type.startsWith("image/")
){

setStatus(
"File không phải ảnh"
);

return;

}


/*
Đọc ảnh.
*/

const reader =
new FileReader();


reader.onload =
async function(e){

const img =
new Image();


img.onload =
async function(){

sourceImage =
img;


/*
Hiện preview.
*/

photoPreview.src =
e.target.result;

photoPreview.style.display =
"block";


photoState.textContent =
"ON";


setStatus(
"Đang nhận diện ảnh mẫu..."
);


/*
Nếu AI đã sẵn sàng,
nhận diện ngay.
*/

if(landmarker){

await detectSourceFace();

}else{

setStatus(
"Ảnh đã tải - hãy START"
);

}


};


/*
Lỗi ảnh.
*/

img.onerror =
function(){

setStatus(
"LỖI ĐỌC ẢNH"
);

};


img.src =
e.target.result;

};


reader.onerror =
function(){

setStatus(
"LỖI ĐỌC FILE"
);

};


reader.readAsDataURL(file);

}
);


/* =========================================
   SOURCE FACE
========================================= */

async function detectSourceFace(){

if(
!sourceImage ||
!landmarker
){

return;

}


/*
Canvas tạm để MediaPipe đọc ảnh.
*/

const temp =
document.createElement("canvas");


temp.width =
sourceImage.naturalWidth;

temp.height =
sourceImage.naturalHeight;


const tc =
temp.getContext("2d");


tc.drawImage(
sourceImage,
0,
0
);


try{

const result =
landmarker.detect(temp);


const detected =
result.faceLandmarks || [];


photoFaces.textContent =
detected.length;


if(
!detected.length
){

sourceLandmarks =
null;

setStatus(
"Không tìm thấy mặt trong ảnh mẫu"
);

return;

}


sourceLandmarks =
detected[0];


blendBox.style.display =
"block";


mode.textContent =
"Alignment";


setStatus(
"ẢNH MẪU FACE OK"
);


message.innerHTML =

"<b class='green'>" +

"ẢNH MẪU FACE OK" +

"</b><br>" +

"Đưa mặt vào camera";


message.style.display =
"block";


setTimeout(
function(){

message.style.display =
"none";

},
1800
);

}catch(error){

console.error(
"Source face:",
error
);

setStatus(
"LỖI NHẬN DIỆN ẢNH"
);

}

}


/* =========================================
   CAMERA
========================================= */

async function startCamera(){

setStatus(
"Đang mở camera..."
);


const media =
navigator.mediaDevices;


if(
!media ||
!media.getUserMedia
){

throw new Error(
"Camera API không được hỗ trợ"
);

}


stream =
await media.getUserMedia({

audio:false,

video:{

facingMode:"user",

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30
}

}

});


video.srcObject =
stream;


await video.play();


await new Promise(
resolve => {

if(
video.videoWidth > 0
){

resolve();

}else{

video.onloadedmetadata =
resolve;

}

}
);


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


setStatus(
"CAMERA OK"
);

}


/* =========================================
   LOAD MEDIAPIPE
========================================= */

async function loadMediaPipe(){

setStatus(
"Đang tải MediaPipe..."
);


try{

const module =
await import(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm"

);


FaceLandmarker =
module.FaceLandmarker;

FilesetResolver =
module.FilesetResolver;


if(
!FaceLandmarker ||
!FilesetResolver
){

throw new Error(
"MediaPipe module không đầy đủ"
);

}

}catch(error){

throw new Error(

"Không tải được MediaPipe: " +
error.message

);

}


setStatus(
"MediaPipe JavaScript OK"
);

}


/* =========================================
   CREATE LANDMARKER
========================================= */

async function createFaceLandmarker(){

setStatus(
"Đang khởi tạo Face Mesh..."
);


const vision =
await FilesetResolver.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

);


landmarker =
await FaceLandmarker.createFromOptions(

vision,

{

baseOptions:{

modelAssetPath:

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

delegate:"GPU"

},

runningMode:"VIDEO",

numFaces:1,

minFaceDetectionConfidence:.5,

minFacePresenceConfidence:.5,

minTrackingConfidence:.5,

outputFaceBlendshapes:true,

outputFacialTransformationMatrixes:true

}

);


setStatus(
"MEDIAPIPE OK"
);


/*
Nếu ảnh đã được chọn
trước khi START.
*/

if(sourceImage){

await detectSourceFace();

}

}


/* =========================================
   POINT
========================================= */

function point(
landmarks,
index,
width,
height
){

const p =
landmarks[index];

return {

x:
(1-p.x)*width,

y:
p.y*height

};

}


/* =========================================
   DRAW ALIGNED PHOTO
========================================= */

function drawAlignedFace(
cameraLandmarks
){

if(
!sourceImage ||
!sourceLandmarks
){

return;

}


/*
Camera points.
*/

const targetLeftEye =
point(
cameraLandmarks,
33,
canvas.width,
canvas.height
);


const targetRightEye =
point(
cameraLandmarks,
263,
canvas.width,
canvas.height
);


const targetNose =
point(
cameraLandmarks,
1,
canvas.width,
canvas.height
);


const sourceW =
sourceImage.naturalWidth;

const sourceH =
sourceImage.naturalHeight;


/*
Source points.
*/

const sourceLeftEye =
point(
sourceLandmarks,
33,
sourceW,
sourceH
);


const sourceRightEye =
point(
sourceLandmarks,
263,
sourceW,
sourceH
);


const sourceNose =
point(
sourceLandmarks,
1,
sourceW,
sourceH
);


/*
Tính scale theo khoảng cách mắt.
*/

const sx =
sourceRightEye.x -
sourceLeftEye.x;

const sy =
sourceRightEye.y -
sourceLeftEye.y;

const tx =
targetRightEye.x -
targetLeftEye.x;

const ty =
targetRightEye.y -
targetLeftEye.y;


const sourceEyeDistance =
Math.sqrt(
sx*sx+
sy*sy
);


const targetEyeDistance =
Math.sqrt(
tx*tx+
ty*ty
);


if(
sourceEyeDistance < 1
){

return;

}


const scale =
targetEyeDistance /
sourceEyeDistance;


/*
Góc quay.
*/

const sourceAngle =
Math.atan2(
sy,
sx
);

const targetAngle =
Math.atan2(
ty,
tx
);


const angle =
targetAngle -
sourceAngle;


/*
Tâm mắt ảnh mẫu.
*/

const sourceCenterX =
(
sourceLeftEye.x+
sourceRightEye.x
)/2;


const sourceCenterY =
(
sourceLeftEye.y+
sourceRightEye.y
)/2;


/*
Tâm mắt camera.
*/

const targetCenterX =
(
targetLeftEye.x+
targetRightEye.x
)/2;


const targetCenterY =
(
targetLeftEye.y+
targetRightEye.y
)/2;


/*
Vị trí mũi để kiểm tra
độ lệch.
*/

const sourceNoseRelativeX =
sourceNose.x -
sourceCenterX;

const sourceNoseRelativeY =
sourceNose.y -
sourceCenterY;


const targetNoseExpectedX =
targetCenterX +
(
sourceNoseRelativeX*
scale*
Math.cos(angle)
-
sourceNoseRelativeY*
scale*
Math.sin(angle)
);


const targetNoseExpectedY =
targetCenterY +
(
sourceNoseRelativeX*
scale*
Math.sin(angle)
+
sourceNoseRelativeY*
scale*
Math.cos(angle)
);


/*
Dịch ảnh.
*/

const translateX =
targetCenterX -
(
sourceCenterX*
scale*
Math.cos(angle)
-
sourceCenterY*
scale*
Math.sin(angle)
);


const translateY =
targetCenterY -
(
sourceCenterX*
scale*
Math.sin(angle)
+
sourceCenterY*
scale*
Math.cos(angle)
);


/*
Vẽ ảnh với độ trong suốt.
*/

ctx.save();


ctx.globalAlpha =
Number(blend.value)/100;


/*
Clip hình oval quanh mặt.
*/

const faceWidth =
targetEyeDistance*2.25;

const faceHeight =
targetEyeDistance*3.0;


ctx.beginPath();


ctx.ellipse(

targetCenterX,

targetCenterY +
targetEyeDistance*.35,

faceWidth/2,

faceHeight/2,

angle,

0,
Math.PI*2

);


ctx.clip();


ctx.setTransform(

scale*Math.cos(angle),

scale*Math.sin(angle),

-scale*Math.sin(angle),

scale*Math.cos(angle),

translateX,

translateY

);


ctx.drawImage(
sourceImage,
0,
0
);


ctx.restore();


/*
Điểm kiểm tra mũi.
*/

ctx.save();

ctx.fillStyle =
"#ffcc00";

ctx.beginPath();

ctx.arc(
targetNoseExpectedX,
targetNoseExpectedY,
4,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

}


/* =========================================
   DRAW CAMERA MESH
========================================= */

function drawMesh(
result
){

ctx.setTransform(
1,0,0,1,0,0
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const detected =
result.faceLandmarks || [];


faces.textContent =
detected.length;


if(
!detected.length
){

setStatus(
"Đang tìm khuôn mặt..."
);

return;

}


const landmarks =
detected[0];


/*
Nếu có ảnh mẫu,
căn ảnh.

Nếu chưa có,
chỉ mesh.
*/

if(
sourceImage &&
sourceLandmarks
){

drawAlignedFace(
landmarks
);

mode.textContent =
"ALIGNMENT";

setStatus(
"FACE ALIGNMENT OK"
);

}else{

/*
Mesh xanh.
*/

ctx.fillStyle =
"#34c759";


for(

let i=0;
i<landmarks.length;
i+=3

){

const p =
landmarks[i];


const x =
(1-p.x) *
canvas.width;


const y =
p.y *
canvas.height;


ctx.beginPath();


ctx.arc(
x,
y,
1.6,
0,
Math.PI*2
);


ctx.fill();

}


mode.textContent =
"Tracking";

setStatus(
"FACE MESH OK"
);

}

}


/* =========================================
   REALTIME
========================================= */

function processFrame(now){

if(
!running
){

return;

}


cameraFrames++;


if(
now-fpsTime >= 1000
){

cameraFPS.textContent =
cameraFrames;

aiFPS.textContent =
aiFrames;


cameraFrames = 0;

aiFrames = 0;

fpsTime = now;

}


if(

landmarker &&
video.readyState >= 2 &&
video.currentTime !== lastVideoTime

){

lastVideoTime =
video.currentTime;


const t =
performance.now();


try{

const result =
landmarker.detectForVideo(

video,
now

);


latency.textContent =

(
performance.now()-t
).toFixed(1);


drawMesh(
result
);


aiFrames++;


}catch(error){

console.error(
error
);

setStatus(
"FACE MESH ERROR"
);

}

}


requestAnimationFrame(
processFrame
);

}


/* =========================================
   START
========================================= */

start.onclick =
async function(){

start.disabled =
true;


try{

/*
Giữ nguyên thứ tự
bản 2.2.
*/

await startCamera();

await loadMediaPipe();

await createFaceLandmarker();


running =
true;


message.style.display =
"none";

start.style.display =
"none";


requestAnimationFrame(
processFrame
);


}catch(error){

console.error(
"FaceLive:",
error
);


setStatus(
"LỖI: " +
error.message
);


message.innerHTML =

"<b class='red'>" +

"FACELIVE ERROR" +

"</b><br><br>" +

error.message;


message.style.display =
"block";


start.disabled =
false;

}

};

</script>

</body>
</html>
```
