<!doctype html>
<html lang="vi">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,
maximum-scale=1,viewport-fit=cover">

<title>FaceLive CAMERA OK</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
}

#video{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
background:#000;
}

#ui{
position:fixed;
left:15px;
right:15px;
bottom:20px;
z-index:10;
}

#status{
background:rgba(0,0,0,.7);
border-radius:15px;
padding:14px;
margin-bottom:10px;
font-size:15px;
}

button{
width:100%;
padding:18px;
border:0;
border-radius:16px;
background:#333;
color:#fff;
font-size:17px;
font-weight:bold;
}

#info{
position:fixed;
top:15px;
left:15px;
right:15px;
z-index:10;
background:rgba(0,0,0,.65);
border-radius:15px;
padding:12px;
font-size:13px;
line-height:1.6;
}

.green{
color:#34c759;
}

.red{
color:#ff453a;
}

</style>

</head>

<body>

<video
id="video"
autoplay
playsinline
muted>
</video>

<div id="info">

<b>FaceLive CAMERA TEST</b>

<br>

Resolution:
<span id="resolution">--</span>

</div>


<div id="ui">

<div id="status">
● Camera chưa khởi động
</div>

<button id="start">
START CAMERA
</button>

</div>


<script>

const video =
document.getElementById("video");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const resolution =
document.getElementById("resolution");


function setStatus(text){

status.textContent =
"● " + text;

}


start.onclick =
async function(){

start.disabled = true;

setStatus(
"Đang xin quyền camera..."
);

try{

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){

throw new Error(
"Trình duyệt không hỗ trợ Camera API"
);

}


const stream =
await navigator.mediaDevices.getUserMedia({

audio:false,

video:{
facingMode:{
ideal:"user"
},

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30
}

}

});


video.srcObject =
stream;


await video.play();


await new Promise(
resolve => {

if(
video.videoWidth > 0
){

resolve();

}else{

video.onloadedmetadata =
resolve;

}

});


resolution.textContent =
video.videoWidth +
" × " +
video.videoHeight;


setStatus(
"CAMERA OK"
);


status.classList.add(
"green"
);


start.style.display =
"none";


}catch(error){

console.error(
"Camera error:",
error
);


setStatus(
"LỖI: " +
error.name
);


status.classList.add(
"red"
);


start.disabled =
false;

}

};

</script>

</body>
</html>
