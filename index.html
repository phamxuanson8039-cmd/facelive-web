<!doctype html>
<html lang="vi">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>FaceLive 0.7</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:-apple-system,
BlinkMacSystemFont,
"Helvetica Neue",
Arial,
sans-serif;
}

#app{
position:fixed;
inset:0;
background:#000;
}

#video{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
background:#000;
}

#canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
pointer-events:none;
}

.panel{
background:rgba(0,0,0,.65);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
border-radius:15px;
}

#top{
position:absolute;
top:max(15px,env(safe-area-inset-top));
left:12px;
right:12px;
display:flex;
justify-content:space-between;
align-items:flex-start;
z-index:10;
}

#title{
padding:12px 14px;
font-size:19px;
font-weight:700;
}

#stats{
padding:11px 13px;
font-size:12px;
line-height:1.6;
text-align:right;
font-variant-numeric:tabular-nums;
}

#bottom{
position:absolute;
left:12px;
right:12px;
bottom:max(15px,env(safe-area-inset-bottom));
z-index:10;
}

#status{
display:inline-block;
padding:10px 13px;
margin-bottom:10px;
font-size:13px;
}

#start{
width:100%;
padding:17px;
border:0;
border-radius:17px;
background:rgba(255,255,255,.18);
color:#fff;
font-size:17px;
font-weight:700;
}

#message{
position:absolute;
left:20px;
right:20px;
top:50%;
transform:translateY(-50%);
text-align:center;
font-size:15px;
line-height:1.6;
z-index:5;
pointer-events:none;
}

.error{
color:#ff453a;
}

.ok{
color:#34c759;
}

</style>

</head>


<body>

<div id="app">

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>


<div id="message">

<b>FaceLive 0.7</b>

<br>

<span style="opacity:.65">
Realtime AI Face Tracking
</span>

</div>


<div id="top">

<div id="title" class="panel">
FaceLive 0.7
</div>


<div id="stats" class="panel">

Camera:
<b id="cameraFPS">--</b> FPS

<br>

AI:
<b id="aiFPS">--</b> FPS

<br>

Inference:
<b id="latency">--</b> ms

<br>

Faces:
<b id="faces">0</b>

<br>

Resolution:
<b id="resolution">--</b>

</div>

</div>


<div id="bottom">

<div id="status" class="panel">
● Chưa khởi động
</div>

<button id="start">
START FACELIVE
</button>

</div>

</div>


<script type="module">

/*
================================================
FACELIVE 0.7
MediaPipe Tasks Vision 1.0.1
================================================
*/


import {
FaceLandmarker,
FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1";


/*
ELEMENTS
*/

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const cameraFPS =
document.getElementById("cameraFPS");

const aiFPS =
document.getElementById("aiFPS");

const latency =
document.getElementById("latency");

const faces =
document.getElementById("faces");

const resolution =
document.getElementById("resolution");


/*
STATE
*/

let stream = null;

let faceLandmarker = null;

let running = false;

let lastVideoTime = -1;

let cameraFrames = 0;

let aiFrames = 0;

let fpsStart =
performance.now();


/*
STATUS
*/

function setStatus(text){

status.textContent =
"● " + text;

}


/*
CAMERA
*/

async function startCamera(){

setStatus(
"Đang mở camera..."
);


stream =
await navigator.mediaDevices
.getUserMedia({

audio:false,

video:{

facingMode:{
ideal:"user"
},

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30,
max:30
}

}

});


video.srcObject =
stream;


await video.play();


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


resolution.textContent =
video.videoWidth +
" × " +
video.videoHeight;


setStatus(
"Camera OK"
);

}


/*
MEDIAPIPE
*/

async function loadAI(){

setStatus(
"Đang tải MediaPipe 1.0.1..."
);


const vision =
await FilesetResolver
.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

);


setStatus(
"MediaPipe OK — tải model..."
);


faceLandmarker =
await FaceLandmarker
.createFromModelPath(

vision,

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

);


await faceLandmarker
.setOptions({

runningMode:"VIDEO",

numFaces:1,

minFaceDetectionConfidence:0.5,

minFacePresenceConfidence:0.5,

minTrackingConfidence:0.5,

outputFaceBlendshapes:true,

outputFacialTransformationMatrixes:true

});


setStatus(
"AI Face Landmarker OK"
);

}


/*
DRAW
*/

function drawFace(result){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const detected =
result.faceLandmarks || [];


faces.textContent =
detected.length;


if(
detected.length === 0
){

setStatus(
"Đang tìm khuôn mặt..."
);

return;

}


setStatus(
"FACE TRACKING OK"
);


for(
const landmarks of detected
){


ctx.fillStyle =
"#34c759";


/*
LANDMARKS
*/

for(
let i=0;
i<landmarks.length;
i+=3
){

const p =
landmarks[i];


const x =
(1-p.x) *
canvas.width;

const y =
p.y *
canvas.height;


ctx.beginPath();

ctx.arc(
x,
y,
1.6,
0,
Math.PI*2
);

ctx.fill();

}


/*
BOUNDING BOX
*/

let minX=1;
let minY=1;

let maxX=0;
let maxY=0;


for(
const p of landmarks
){

minX =
Math.min(minX,p.x);

minY =
Math.min(minY,p.y);

maxX =
Math.max(maxX,p.x);

maxY =
Math.max(maxY,p.y);

}


const left =
(1-maxX) *
canvas.width;

const top =
minY *
canvas.height;

const width =
(maxX-minX) *
canvas.width;

const height =
(maxY-minY) *
canvas.height;


ctx.strokeStyle =
"#34c759";

ctx.lineWidth=3;


ctx.beginPath();

ctx.ellipse(

left+width/2,

top+height/2,

Math.abs(width)/2,

height/2,

0,

0,

Math.PI*2

);

ctx.stroke();

}

}


/*
REALTIME LOOP
*/

function processFrame(now){

if(
!running ||
!faceLandmarker ||
video.readyState < 2
){

requestAnimationFrame(
processFrame
);

return;

}


cameraFrames++;


if(
now-fpsStart >= 1000
){

cameraFPS.textContent =
cameraFrames;

aiFPS.textContent =
aiFrames;

cameraFrames=0;

aiFrames=0;

fpsStart=now;

}


if(
video.currentTime !==
lastVideoTime
){

lastVideoTime =
video.currentTime;


const t =
performance.now();


try{

const result =
faceLandmarker
.detectForVideo(
video,
now
);


latency.textContent =
(
performance.now()-t
).toFixed(1);


drawFace(
result
);


aiFrames++;


}catch(error){

console.error(error);

setStatus(
"AI ERROR"
);

message.innerHTML =

"<b class='error'>" +
"AI ERROR" +
"</b><br><br>" +

error.name +
"<br>" +

error.message;

message.style.display =
"block";

}

}


requestAnimationFrame(
processFrame
);

}


/*
START
*/

start.onclick =
async function(){

start.disabled=true;


try{

await startCamera();

await loadAI();


running=true;

start.style.display =
"none";

message.style.display =
"none";


requestAnimationFrame(
processFrame
);


}catch(error){

console.error(error);


setStatus(
"LỖI: " +
error.name
);


message.innerHTML =

"<b class='error'>" +
"FACELIVE ERROR" +
"</b><br><br>" +

error.name +
"<br>" +

error.message;


message.style.display =
"block";


start.disabled=false;

}

};

</script>

</body>

</html>
