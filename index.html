<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>FaceLive 0.6</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:-apple-system,
BlinkMacSystemFont,
"Helvetica Neue",
Arial,sans-serif;
}

#app{
position:fixed;
inset:0;
background:#000;
}

#video{
position:absolute;
inset:0;

width:100%;
height:100%;

object-fit:cover;

transform:scaleX(-1);

background:#000;
}

#canvas{
position:absolute;
inset:0;

width:100%;
height:100%;

pointer-events:none;
}

.panel{
background:rgba(0,0,0,.62);

backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border-radius:15px;
}

#top{
position:absolute;

top:max(15px,env(safe-area-inset-top));

left:12px;
right:12px;

display:flex;
justify-content:space-between;
align-items:flex-start;

z-index:10;
}

#title{
padding:12px 14px;

font-size:19px;
font-weight:700;
}

#stats{
padding:11px 13px;

font-size:12px;

line-height:1.6;

text-align:right;

font-variant-numeric:tabular-nums;
}

#bottom{
position:absolute;

left:12px;
right:12px;

bottom:max(15px,env(safe-area-inset-bottom));

z-index:10;
}

#status{
display:inline-block;

padding:10px 13px;

margin-bottom:10px;

font-size:13px;
}

#start{
width:100%;

padding:17px;

border:0;

border-radius:17px;

background:rgba(255,255,255,.18);

color:#fff;

font-size:17px;

font-weight:700;

-webkit-appearance:none;
}

#start:active{
transform:scale(.98);
}

#message{
position:absolute;

left:20px;
right:20px;

top:50%;

transform:translateY(-50%);

text-align:center;

font-size:15px;

line-height:1.6;

z-index:5;

pointer-events:none;
}

.error{
color:#ff453a;
}

</style>
</head>

<body>

<div id="app">

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>


<div id="message">

<b>FaceLive 0.6</b>

<br>

<span style="opacity:.65">
AI Face Tracking
</span>

</div>


<div id="top">

<div id="title" class="panel">
FaceLive
</div>


<div id="stats" class="panel">

Camera:
<b id="cameraFPS">--</b> FPS

<br>

AI:
<b id="aiFPS">--</b> FPS

<br>

Inference:
<b id="latency">--</b> ms

<br>

Faces:
<b id="faces">0</b>

<br>

Resolution:
<b id="resolution">--</b>

</div>

</div>


<div id="bottom">

<div id="status" class="panel">

● Chưa khởi động

</div>


<button id="start">
START FACELIVE
</button>

</div>

</div>


<script>

/*
==================================================
FACE LIVE 0.6
==================================================
*/


var video =
document.getElementById("video");

var canvas =
document.getElementById("canvas");

var ctx =
canvas.getContext("2d");

var start =
document.getElementById("start");

var status =
document.getElementById("status");

var message =
document.getElementById("message");

var cameraFPS =
document.getElementById("cameraFPS");

var aiFPS =
document.getElementById("aiFPS");

var latency =
document.getElementById("latency");

var faces =
document.getElementById("faces");

var resolution =
document.getElementById("resolution");


var landmarker = null;

var stream = null;

var running = false;

var lastVideoTime = -1;


/*
FPS
*/

var cameraFrames = 0;

var aiFrames = 0;

var fpsStart =
performance.now();


/*
==================================================
STATUS
==================================================
*/

function setStatus(text){

status.innerHTML =
"● " + text;

}


/*
==================================================
LOAD MEDIAPIPE
==================================================
*/

async function loadMediaPipe(){

setStatus(
"Đang tải AI..."
);


/*
Load official MediaPipe
bundle.
*/

await new Promise(
function(resolve,reject){

var script =
document.createElement("script");

script.src =
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.js";

script.onload =
function(){

resolve();

};

script.onerror =
function(){

reject(
new Error(
"Không tải được MediaPipe"
)
);

};

document.head.appendChild(
script
);

});


/*
Check library
*/

if(
!window.vision
){

throw new Error(
"MediaPipe library không tồn tại"
);

}


setStatus(
"MediaPipe OK — tải WASM..."
);


var vision =
await window.vision
.FilesetResolver
.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

);


setStatus(
"Tải Face Landmarker..."
);


landmarker =
await window.vision
.FaceLandmarker
.createFromOptions(

vision,

{

baseOptions:{

modelAssetPath:

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

delegate:"GPU"

},

runningMode:"VIDEO",

numFaces:1,

minFaceDetectionConfidence:0.5,

minFacePresenceConfidence:0.5,

minTrackingConfidence:0.5,

outputFaceBlendshapes:true,

outputFacialTransformationMatrixes:true

}

);


setStatus(
"AI đã sẵn sàng"
);

}


/*
==================================================
CAMERA
==================================================
*/

async function startCamera(){

setStatus(
"Đang mở camera..."
);


stream =
await navigator.mediaDevices
.getUserMedia({

video:{

facingMode:{
ideal:"user"
},

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30,
max:30
}

},

audio:false

});


video.srcObject =
stream;


await video.play();


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


resolution.textContent =
video.videoWidth +
"×" +
video.videoHeight;


setStatus(
"Camera OK"
);

}


/*
==================================================
DRAW FACE
==================================================
*/

function drawFace(result){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


var list =
result.faceLandmarks || [];


faces.textContent =
list.length;


if(
list.length === 0
){

setStatus(
"Đang tìm khuôn mặt..."
);

return;

}


setStatus(
"● FACE TRACKING OK"
);


for(
var f=0;
f<list.length;
f++
){

var landmarks =
list[f];


ctx.fillStyle =
"#34c759";


/*
Draw landmarks
*/

for(
var i=0;
i<landmarks.length;
i+=3
){

var p =
landmarks[i];


/*
Mirror X
*/

var x =
(1-p.x) *
canvas.width;

var y =
p.y *
canvas.height;


ctx.beginPath();

ctx.arc(
x,
y,
1.6,
0,
Math.PI*2
);

ctx.fill();

}


/*
Face outline
*/

var minX=1;
var minY=1;

var maxX=0;
var maxY=0;


for(
var j=0;
j<landmarks.length;
j++
){

var q =
landmarks[j];

minX =
Math.min(
minX,
q.x
);

minY =
Math.min(
minY,
q.y
);

maxX =
Math.max(
maxX,
q.x
);

maxY =
Math.max(
maxY,
q.y
);

}


var left =
(1-maxX) *
canvas.width;

var top =
minY *
canvas.height;

var width =
(maxX-minX) *
canvas.width;

var height =
(maxY-minY) *
canvas.height;


ctx.strokeStyle =
"#34c759";

ctx.lineWidth=3;


ctx.beginPath();

ctx.ellipse(

left + width/2,

top + height/2,

Math.abs(width)/2,

height/2,

0,

0,

Math.PI*2

);

ctx.stroke();

}

}


/*
==================================================
REALTIME
==================================================
*/

function processFrame(now){

if(
!running ||
!landmarker ||
video.readyState < 2
){

requestAnimationFrame(
processFrame
);

return;

}


cameraFrames++;


if(
now-fpsStart >= 1000
){

cameraFPS.textContent =
cameraFrames;

aiFPS.textContent =
aiFrames;

cameraFrames=0;

aiFrames=0;

fpsStart=now;

}


if(
video.currentTime !==
lastVideoTime
){

lastVideoTime =
video.currentTime;


var startTime =
performance.now();


try{

var result =
landmarker
.detectForVideo(
video,
now
);


latency.textContent =
(
performance.now() -
startTime
).toFixed(1);


drawFace(
result
);


aiFrames++;


}catch(error){

console.error(
error
);

setStatus(
"AI ERROR: " +
error.message
);

}

}


requestAnimationFrame(
processFrame
);

}


/*
==================================================
START
==================================================
*/

start.onclick =
async function(){

start.disabled=true;


try{


/*
Camera first
*/

await startCamera();


/*
Then AI
*/

await loadMediaPipe();


/*
Start realtime
*/

running=true;

start.style.display =
"none";

message.style.display =
"none";


requestAnimationFrame(
processFrame
);


}catch(error){

console.error(
error
);

setStatus(
"LỖI: " +
error.name
);


message.innerHTML =

"<b class='error'>" +
"FACELIVE ERROR" +
"</b>" +

"<br><br>" +

error.name +

"<br>" +

error.message;


message.style.display =
"block";


start.disabled=false;

}

};

</script>

</body>
</html>
