<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>FaceLive 1.2</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

#app{
    position:fixed;
    inset:0;
    background:#000;
}

#video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    background:#000;
}

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;
}

.panel{
    background:rgba(0,0,0,.65);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border-radius:15px;
}

#top{
    position:absolute;

    top:max(15px,env(safe-area-inset-top));

    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    z-index:20;
}

#title{
    padding:12px 14px;

    font-size:19px;
    font-weight:700;
}

#stats{
    padding:11px 13px;

    text-align:right;

    font-size:12px;
    line-height:1.6;

    font-variant-numeric:tabular-nums;
}

#bottom{
    position:absolute;

    left:12px;
    right:12px;

    bottom:max(15px,env(safe-area-inset-bottom));

    z-index:20;
}

#status{
    display:inline-block;

    padding:10px 13px;

    margin-bottom:8px;

    font-size:13px;
}

button,
label{
    display:block;

    width:100%;

    padding:15px;

    border:0;

    border-radius:16px;

    background:rgba(255,255,255,.18);

    color:#fff;

    font-size:16px;
    font-weight:700;

    text-align:center;

    margin-top:7px;
}

button:disabled{
    opacity:.5;
}

input{
    display:none;
}

#message{
    position:absolute;

    left:20px;
    right:20px;

    top:50%;

    transform:translateY(-50%);

    text-align:center;

    font-size:15px;

    line-height:1.6;

    z-index:10;

    pointer-events:none;
}

.green{
    color:#34c759;
}

.red{
    color:#ff453a;
}

</style>
</head>

<body>

<div id="app">

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>

<div id="message">

<b>FaceLive 1.2</b>

<br>

<span style="opacity:.7">
Eye Anchored Face Mesh
</span>

</div>


<div id="top">

<div
id="title"
class="panel">

FaceLive 1.2

</div>


<div
id="stats"
class="panel">

Camera:
<b id="cameraFPS">--</b>
FPS

<br>

AI:
<b id="aiFPS">--</b>
FPS

<br>

Inference:
<b id="latency">--</b>
ms

<br>

Faces:
<b id="faces">0</b>

<br>

Mode:
<b id="mode">Tracking</b>

</div>

</div>


<div id="bottom">

<div
id="status"
class="panel">

● Camera chưa khởi động

</div>


<button id="start">

START FACELIVE

</button>


<label for="photo">

📷 CHỌN ẢNH KHUÔN MẶT

</label>


<input
id="photo"
type="file"
accept="image/*">

</div>

</div>


<script type="module">

/*
==================================================
MEDIAPIPE
==================================================
*/

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/*
==================================================
ELEMENTS
==================================================
*/

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const photo =
document.getElementById("photo");

const cameraFPSElement =
document.getElementById("cameraFPS");

const aiFPSElement =
document.getElementById("aiFPS");

const latencyElement =
document.getElementById("latency");

const facesElement =
document.getElementById("faces");

const modeElement =
document.getElementById("mode");


/*
==================================================
STATE
==================================================
*/

let faceLandmarker = null;

let stream = null;

let sourceImage = null;

let running = false;

let lastVideoTime = -1;


/*
==================================================
FPS
==================================================
*/

let cameraFrames = 0;

let aiFrames = 0;

let fpsStart =
performance.now();


/*
==================================================
STATUS
==================================================
*/

function setStatus(text){

    status.textContent =
    "● " + text;

}


/*
==================================================
CAMERA
==================================================
*/

async function startCamera(){

    setStatus(
        "Đang mở camera..."
    );


    stream =
    await navigator
    .mediaDevices
    .getUserMedia({

        audio:false,

        video:{

            facingMode:{
                ideal:"user"
            },

            width:{
                ideal:1280
            },

            height:{
                ideal:720
            },

            frameRate:{
                ideal:30,
                max:30
            }

        }

    });


    video.srcObject =
    stream;


    await video.play();


    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;


    setStatus(
        "CAMERA OK"
    );

}


/*
==================================================
LOAD AI
==================================================
*/

async function loadAI(){

    setStatus(
        "Đang tải AI..."
    );


    const vision =
    await FilesetResolver
    .forVisionTasks(

        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

    );


    faceLandmarker =
    await FaceLandmarker
    .createFromOptions(

        vision,

        {

            baseOptions:{

                modelAssetPath:

                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                delegate:"GPU"

            },

            runningMode:"VIDEO",

            numFaces:1,

            minFaceDetectionConfidence:.5,

            minFacePresenceConfidence:.5,

            minTrackingConfidence:.5,

            outputFaceBlendshapes:true,

            outputFacialTransformationMatrixes:true

        }

    );


    setStatus(
        "AI FACE MESH OK"
    );

}


/*
==================================================
LOAD IMAGE
==================================================
*/

photo.addEventListener(
"change",
function(event){

    const file =
    event.target.files[0];

    if(!file){
        return;
    }


    const url =
    URL.createObjectURL(file);


    const img =
    new Image();


    img.onload =
    function(){

        sourceImage =
        img;


        modeElement.textContent =
        "Mesh Warp";


        message.innerHTML =

        "<b class='green'>" +
        "ẢNH ĐÃ TẢI" +
        "</b><br>" +

        "Đưa khuôn mặt vào camera";


        message.style.display =
        "block";


        setStatus(
            "Ảnh nguồn đã sẵn sàng"
        );

    };


    img.onerror =
    function(){

        setStatus(
            "Không đọc được ảnh"
        );

    };


    img.src =
    url;

});


/*
==================================================
LANDMARK
==================================================
*/

function getPoint(
    landmarks,
    index
){

    const p =
    landmarks[index];


    return {

        x:
        (1-p.x) *
        canvas.width,

        y:
        p.y *
        canvas.height

    };

}


/*
==================================================
FACE BOUNDS
==================================================
*/

function getBounds(
    landmarks
){

    let minX =
    canvas.width;

    let minY =
    canvas.height;

    let maxX = 0;

    let maxY = 0;


    for(
        const p of landmarks
    ){

        const x =
        (1-p.x) *
        canvas.width;

        const y =
        p.y *
        canvas.height;


        minX =
        Math.min(
            minX,
            x
        );


        minY =
        Math.min(
            minY,
            y
        );


        maxX =
        Math.max(
            maxX,
            x
        );


        maxY =
        Math.max(
            maxY,
            y
        );

    }


    return {

        left:minX,

        top:minY,

        right:maxX,

        bottom:maxY,

        width:
        maxX-minX,

        height:
        maxY-minY

    };

}


/*
==================================================
DRAW FACE OVERLAY
==================================================
*/

function drawFaceOverlay(
landmarks
){

    if(!sourceImage){
        return;
    }


    const bounds =
    getBounds(
        landmarks
    );


    /*
    ==============================================
    ANCHOR POINTS
    ==============================================
    */

    const leftEye =
    getPoint(
        landmarks,
        33
    );


    const rightEye =
    getPoint(
        landmarks,
        263
    );


    const nose =
    getPoint(
        landmarks,
        1
    );


    const mouthLeft =
    getPoint(
        landmarks,
        61
    );


    const mouthRight =
    getPoint(
        landmarks,
        291
    );


    const chin =
    getPoint(
        landmarks,
        152
    );


    /*
    ==============================================
    EYE DISTANCE
    ==============================================
    */

    const dx =
    rightEye.x -
    leftEye.x;


    const dy =
    rightEye.y -
    leftEye.y;


    const eyeDistance =
    Math.sqrt(
        dx*dx +
        dy*dy
    );


    /*
    ==============================================
    SOURCE IMAGE
    ==============================================
    */

    const sw =
    sourceImage.naturalWidth;


    const sh =
    sourceImage.naturalHeight;


    /*
    ==============================================
    SOURCE FACE POSITION
    ==============================================
    */

    const sourceLeftEye = {

        x:sw*.35,
        y:sh*.38

    };


    const sourceRightEye = {

        x:sw*.65,
        y:sh*.38

    };


    const sourceNose = {

        x:sw*.50,
        y:sh*.52

    };


    /*
    ==============================================
    SOURCE SCALE
    ==============================================
    */

    const sourceEyeDistance =
    sourceRightEye.x -
    sourceLeftEye.x;


    const scale =
    eyeDistance /
    sourceEyeDistance;


    /*
    ==============================================
    TARGET CENTER
    ==============================================
    */

    const targetCenterX =
    (
        leftEye.x +
        rightEye.x
    ) / 2;


    const targetCenterY =
    (
        leftEye.y +
        rightEye.y
    ) / 2;


    /*
    ==============================================
    IMPORTANT FIX 1.2
    ==============================================

    Previous version was too LOW.

    Move the whole source face
    UP relative to the real eyes.

    Increase this number if needed.
    */

    const verticalOffset =
    eyeDistance * 0.18;


    /*
    ==============================================
    SOURCE CENTER
    ==============================================
    */

    const sourceCenterX =
    (
        sourceLeftEye.x +
        sourceRightEye.x
    ) / 2;


    const sourceCenterY =
    (
        sourceLeftEye.y +
        sourceRightEye.y
    ) / 2;


    /*
    ==============================================
    TRANSFORM
    ==============================================
    */

    ctx.save();


    ctx.globalAlpha =
    .92;


    ctx.translate(

        targetCenterX,

        targetCenterY -
        verticalOffset

    );


    ctx.rotate(
        Math.atan2(
            dy,
            dx
        )
    );


    ctx.scale(
        scale*.96,
        scale*.96
    );


    ctx.translate(
        -sourceCenterX,
        -sourceCenterY
    );


    /*
    ==============================================
    DRAW SOURCE IMAGE
    ==============================================
    */

    ctx.drawImage(

        sourceImage,

        0,
        0,
        sw,
        sh

    );


    ctx.restore();


    /*
    ==============================================
    FACE FEATHER
    ==============================================
    */

    ctx.save();


    ctx.globalCompositeOperation =
    "destination-out";


    const cx =
    bounds.left +
    bounds.width/2;


    const cy =
    bounds.top +
    bounds.height/2 -
    verticalOffset;


    const rx =
    bounds.width*.58;


    const ry =
    bounds.height*.58;


    const gradient =
    ctx.createRadialGradient(

        cx,
        cy,

        Math.min(
            rx,
            ry
        )*.55,

        cx,
        cy,

        Math.max(
            rx,
            ry
        )

    );


    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );


    gradient.addColorStop(
        .75,
        "rgba(0,0,0,.05)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,1)"
    );


    ctx.fillStyle =
    gradient;


    ctx.beginPath();


    ctx.ellipse(

        cx,
        cy,

        rx,
        ry,

        0,
        0,
        Math.PI*2

    );


    ctx.fill();


    ctx.restore();

}


/*
==================================================
DRAW TRACKING
==================================================
*/

function drawTracking(
landmarks
){

    ctx.clearRect(

        0,
        0,
        canvas.width,
        canvas.height

    );


    if(
        sourceImage
    ){

        drawFaceOverlay(
            landmarks
        );


        modeElement.textContent =
        "Mesh Warp";


        setStatus(
            "FACE MESH OK"
        );


        return;

    }


    /*
    ==============================================
    LANDMARK DOTS
    ==============================================
    */

    ctx.fillStyle =
    "#34c759";


    for(
        let i=0;
        i<landmarks.length;
        i+=4
    ){

        const p =
        landmarks[i];


        const x =
        (1-p.x) *
        canvas.width;


        const y =
        p.y *
        canvas.height;


        ctx.beginPath();


        ctx.arc(

            x,
            y,
            1.7,
            0,
            Math.PI*2

        );


        ctx.fill();

    }


    modeElement.textContent =
    "Tracking";


    setStatus(
        "FACE TRACKING OK"
    );

}


/*
==================================================
PROCESS
==================================================
*/

function processFrame(
now
){

    if(
        !running ||
        !faceLandmarker ||
        video.readyState < 2
    ){

        requestAnimationFrame(
            processFrame
        );

        return;

    }


    cameraFrames++;


    /*
    ==============================================
    FPS
    ==============================================
    */

    if(
        now-fpsStart>=1000
    ){

        cameraFPSElement.textContent =
        cameraFrames;


        aiFPSElement.textContent =
        aiFrames;


        cameraFrames =
        0;


        aiFrames =
        0;


        fpsStart =
        now;

    }


    /*
    ==============================================
    NEW VIDEO FRAME
    ==============================================
    */

    if(
        video.currentTime !==
        lastVideoTime
    ){

        lastVideoTime =
        video.currentTime;


        const startTime =
        performance.now();


        try{

            const result =
            faceLandmarker
            .detectForVideo(
                video,
                now
            );


            latencyElement.textContent =
            (
                performance.now() -
                startTime
            ).toFixed(1);


            const detected =
            result.faceLandmarks ||
            [];


            facesElement.textContent =
            detected.length;


            if(
                detected.length>0
            ){

                drawTracking(
                    detected[0]
                );

            }
            else{

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                facesElement.textContent =
                "0";


                setStatus(
                    "Đang tìm khuôn mặt..."
                );

            }


            aiFrames++;

        }
        catch(error){

            console.error(
                "FaceLive AI error:",
                error
            );


            setStatus(
                "AI ERROR"
            );

        }

    }


    requestAnimationFrame(
        processFrame
    );

}


/*
==================================================
START FACELIVE
==================================================
*/

start.addEventListener(
"click",
async function(){

    start.disabled =
    true;


    try{

        /*
        CAMERA FIRST
        */

        await startCamera();


        /*
        AI SECOND
        */

        await loadAI();


        running =
        true;


        start.style.display =
        "none";


        message.style.display =
        "none";


        setStatus(
            "FACE MESH READY"
        );


        requestAnimationFrame(
            processFrame
        );

    }
    catch(error){

        console.error(
            error
        );


        setStatus(
            "FACELIVE ERROR"
        );


        message.innerHTML =

        "<b class='red'>" +

        "FACELIVE ERROR" +

        "</b><br><br>" +

        error.name +

        "<br>" +

        error.message;


        message.style.display =
        "block";


        start.disabled =
        false;

    }

});

</script>

</body>
</html>
