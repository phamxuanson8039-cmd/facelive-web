<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FaceLive AI Swap</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}video{visibility:visible;z-index:0}canvas{z-index:1;pointer-events:none}.ui{position:fixed;inset:0;z-index:5;padding:12px;pointer-events:none}.panel{background:rgba(0,0,0,.78);border-radius:14px;padding:10px}.top{display:flex;justify-content:space-between;gap:8px}.title{font-size:18px;font-weight:700}.stats{font-size:11px;line-height:1.55;text-align:right}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));pointer-events:auto}.button,input[type=file]{width:100%;padding:15px;border:0;border-radius:14px;margin-top:8px;background:#1769ff;color:#fff;font-size:16px;font-weight:700}.button:disabled{opacity:.5}input[type=file]{background:#252525;font-weight:400}.notice{font-size:12px;line-height:1.45;margin-top:8px}.hide{display:none!important}#sourcePreview{position:fixed;right:12px;bottom:220px;width:82px;height:104px;object-fit:cover;border:2px solid #34c759;border-radius:12px;z-index:6}input[type=range]{width:100%}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="out"></canvas><img id="sourcePreview" class="hide" alt="Ảnh mẫu"><div class="ui"><div class="top"><div class="panel title">FaceLive AI Swap</div><div class="panel stats">Camera <b id="fps">--</b> FPS<br>Swap <b id="sfps">--</b> FPS<br>AI <b id="lat">--</b> ms<br>Face <b id="face">0</b><br>Engine <b id="engine">Lite</b></div></div><div class="bottom"><div id="status" class="panel">● Sẵn sàng</div><button id="start" class="button">START CAMERA</button><input id="file" type="file" accept="image/*"><div id="notice" class="panel notice">Chọn ảnh khuôn mặt sau khi camera hoạt động. Bản Lite chạy trực tiếp trên iPhone, không tải model swap 500+ MB.</div><div id="controls" class="panel hide">Blend <b id="bv">85</b>%<input id="blend" type="range" min="50" max="100" value="85"></div></div></div><script type="module">
const $=id=>document.getElementById(id),video=$('video'),canvas=$('out'),ctx=canvas.getContext('2d',{alpha:true}),start=$('start'),file=$('file'),status=$('status'),preview=$('sourcePreview'),controls=$('controls'),blend=$('blend'),bv=$('bv'),fps=$('fps'),sfps=$('sfps'),lat=$('lat'),face=$('face');
const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',MP_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const IDS=[33,263,1,61,291],T112=[[38.2946,51.6963],[73.5318,51.5014],[56.0252,71.7366],[41.5493,92.3655],[70.7299,92.2041]];
let FaceLandmarker,FilesetResolver,vision,sourceImage,sourceFace,sourcePrepared=false,running=false,preparing=false,lastVideoTime=-1,lastSwap=0,frames=0,swaps=0,t0=performance.now();
const layer=document.createElement('canvas');let lg;
const setStatus=s=>status.textContent='● '+s;blend.oninput=()=>bv.textContent=blend.value;
function sim(src,dst){let sx=0,sy=0,dx=0,dy=0;for(let i=0;i<5;i++){sx+=src[i][0];sy+=src[i][1];dx+=dst[i][0];dy+=dst[i][1]}sx/=5;sy/=5;dx/=5;dy/=5;let a=0,b=0,n=0;for(let i=0;i<5;i++){let x=src[i][0]-sx,y=src[i][1]-sy,X=dst[i][0]-dx,Y=dst[i][1]-dy;a+=x*X+y*Y;b+=x*Y-y*X;n+=x*x+y*y}let c=a/n,d=b/n;return[c,d,-d,c,dx-c*sx+d*sy,dy-d*sx-c*sy]}
function pts(f,w,h){return IDS.map(i=>[f[i].x*w,f[i].y*h])}
function align(img,p,size){let c=document.createElement('canvas');c.width=c.height=size;let g=c.getContext('2d');g.setTransform(...sim(p,T112.map(q=>[q[0]*size/112,q[1]*size/112])));g.drawImage(img,0,0);return c}
function makeMaskedSource(c){let out=document.createElement('canvas');out.width=out.height=256;let g=out.getContext('2d');g.drawImage(c,0,0);let id=g.getImageData(0,0,256,256),d=id.data;for(let y=0;y<256;y++)for(let x=0;x<256;x++){let dx=(x-128)/105,dy=(y-137)/120,r=Math.sqrt(dx*dx+dy*dy),a=r<.72?255:r>1?0:Math.round(255*(1-r)/.28);d[(y*256+x)*4+3]=a}g.putImageData(id,0,0);return out}
async function initVision(){if(!FaceLandmarker){let m=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');FaceLandmarker=m.FaceLandmarker;FilesetResolver=m.FilesetResolver}if(!vision){setStatus('Đang tải Face Landmarker…');let v=await FilesetResolver.forVisionTasks(MP_WASM);vision=await FaceLandmarker.createFromOptions(v,{baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numFaces:1})}}
async function prepare(){if(!sourceImage||preparing)return;preparing=true;sourcePrepared=false;try{setStatus('Đang nhận diện ảnh mẫu…');await initVision();await vision.setOptions({runningMode:'IMAGE'});let r=vision.detect(sourceImage),fs=r.faceLandmarks||[];if(!fs.length)throw Error('Ảnh mẫu không có khuôn mặt rõ');let crop=align(sourceImage,pts(fs[0],sourceImage.naturalWidth,sourceImage.naturalHeight),256);sourceFace=makeMaskedSource(crop);sourcePrepared=true;await vision.setOptions({runningMode:'VIDEO'});controls.classList.remove('hide');setStatus('Ảnh mẫu sẵn sàng — LIVE LITE SWAP')}catch(e){sourcePrepared=false;console.error(e);try{await vision.setOptions({runningMode:'VIDEO'})}catch{}setStatus('SOURCE ERROR: '+e.message)}finally{preparing=false}}
file.onchange=()=>{let f=file.files?.[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image;im.onload=()=>{sourceImage=im;preview.src=u;preview.classList.remove('hide');prepare()};im.src=u}
function clearLayer(){lg.setTransform(1,0,0,1,0,0);lg.globalAlpha=1;lg.clearRect(0,0,layer.width,layer.height)}
function swapFrame(f){if(!sourcePrepared||!sourceFace||preparing)return;let t=performance.now();let p=pts(f,canvas.width,canvas.height),dst=T112.map(q=>[q[0]*256/112,q[1]*256/112]),m=sim(dst,p);clearLayer();lg.setTransform(...m);lg.globalAlpha=+blend.value/100;lg.drawImage(sourceFace,0,0,256,256);lat.textContent=(performance.now()-t).toFixed(0);swaps++}
function loop(now){if(!running)return;try{frames++;if(now-t0>1000){fps.textContent=frames;sfps.textContent=swaps;frames=swaps=0;t0=now}if(video.readyState>=2&&video.currentTime!==lastVideoTime&&!preparing){lastVideoTime=video.currentTime;let fs=vision.detectForVideo(video,now).faceLandmarks||[];face.textContent=fs.length;if(fs.length&&sourcePrepared){if(now-lastSwap>140){lastSwap=now;swapFrame(fs[0])}setStatus('LIVE LITE SWAP')}else if(fs.length){clearLayer();setStatus('Camera OK — chọn ảnh mẫu')}else{clearLayer();setStatus('Đang tìm khuôn mặt…')}}}catch(e){console.error(e);clearLayer();setStatus('VIDEO ERROR: '+e.message);running=false}requestAnimationFrame(loop)}
start.onclick=async()=>{start.disabled=true;try{setStatus('Đang mở camera…');let s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:24}}});video.srcObject=s;await video.play();canvas.width=video.videoWidth||960;canvas.height=video.videoHeight||540;layer.width=canvas.width;layer.height=canvas.height;lg=layer.getContext('2d');await initVision();running=true;start.textContent='CAMERA ON';$('notice').classList.add('hide');requestAnimationFrame(loop)}catch(e){console.error(e);setStatus('LỖI CAMERA/AI: '+e.message);start.disabled=false}};setStatus('Sẵn sàng — START CAMERA rồi chọn ảnh');
</script></body></html>
