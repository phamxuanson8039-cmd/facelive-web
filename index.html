<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>FaceLive 0.9</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:-apple-system,
BlinkMacSystemFont,
"Helvetica Neue",
Arial,sans-serif;
}

#app{
position:fixed;
inset:0;
background:#000;
}

#video{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
}

#canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
pointer-events:none;
}

.panel{
background:rgba(0,0,0,.65);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
border-radius:15px;
}

#top{
position:absolute;
top:max(15px,env(safe-area-inset-top));
left:12px;
right:12px;
display:flex;
justify-content:space-between;
align-items:flex-start;
z-index:20;
}

#title{
padding:12px 14px;
font-size:19px;
font-weight:700;
}

#stats{
padding:11px 13px;
font-size:12px;
line-height:1.6;
text-align:right;
font-variant-numeric:tabular-nums;
}

#bottom{
position:absolute;
left:12px;
right:12px;
bottom:max(15px,env(safe-area-inset-bottom));
z-index:20;
}

#status{
display:inline-block;
padding:10px 13px;
margin-bottom:8px;
font-size:13px;
}

button,label{
display:block;
width:100%;
padding:15px;
border:0;
border-radius:16px;
background:rgba(255,255,255,.18);
color:#fff;
font-size:16px;
font-weight:700;
text-align:center;
margin-top:7px;
}

input{
display:none;
}

#message{
position:absolute;
left:20px;
right:20px;
top:50%;
transform:translateY(-50%);
text-align:center;
font-size:15px;
line-height:1.6;
z-index:10;
pointer-events:none;
}

.green{
color:#34c759;
}

.red{
color:#ff453a;
}

</style>
</head>

<body>

<div id="app">

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>

<div id="message">

<b>FaceLive 0.9</b>
<br>

<span style="opacity:.7">
Realtime Face Warp
</span>

</div>

<div id="top">

<div id="title" class="panel">
FaceLive 0.9
</div>

<div id="stats" class="panel">

Camera:
<b id="cameraFPS">--</b> FPS

<br>

AI:
<b id="aiFPS">--</b> FPS

<br>

Inference:
<b id="latency">--</b> ms

<br>

Faces:
<b id="faces">0</b>

<br>

Mode:
<b id="mode">Tracking</b>

</div>

</div>

<div id="bottom">

<div id="status" class="panel">
● Chưa khởi động
</div>

<button id="start">
START FACELIVE
</button>

<label for="photo">
📷 CHỌN ẢNH KHUÔN MẶT
</label>

<input
id="photo"
type="file"
accept="image/*">

</div>

</div>

<script type="module">

import {
FaceLandmarker,
FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1";


const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const photo =
document.getElementById("photo");

const cameraFPS =
document.getElementById("cameraFPS");

const aiFPS =
document.getElementById("aiFPS");

const latency =
document.getElementById("latency");

const faces =
document.getElementById("faces");

const mode =
document.getElementById("mode");


let landmarker=null;
let stream=null;
let running=false;
let lastVideoTime=-1;
let sourceImage=null;

let cameraFrames=0;
let aiFrames=0;
let fpsStart=performance.now();


function setStatus(text){

status.textContent="● "+text;

}


/*
=========================================
CAMERA
=========================================
*/

async function startCamera(){

setStatus("Đang mở camera...");

stream=
await navigator.mediaDevices
.getUserMedia({

audio:false,

video:{

facingMode:{
ideal:"user"
},

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30,
max:30
}

}

});

video.srcObject=stream;

await video.play();

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

setStatus("Camera OK");

}


/*
=========================================
AI
=========================================
*/

async function loadAI(){

setStatus("Đang tải AI...");

const vision=
await FilesetResolver
.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

);

landmarker=
await FaceLandmarker
.createFromModelPath(

vision,

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

);

await landmarker.setOptions({

runningMode:"VIDEO",

numFaces:1,

minFaceDetectionConfidence:.5,

minFacePresenceConfidence:.5,

minTrackingConfidence:.5

});

setStatus("AI Face Tracking OK");

}


/*
=========================================
SOURCE IMAGE
=========================================
*/

photo.onchange=function(e){

const file=e.target.files[0];

if(!file)return;

const url=
URL.createObjectURL(file);

const img=new Image();

img.onload=function(){

sourceImage=img;

mode.textContent="Face Warp";

message.innerHTML=
"<b class='green'>ẢNH ĐÃ TẢI</b><br>" +
"Đưa khuôn mặt vào camera";

message.style.display="block";

setStatus("Ảnh nguồn đã sẵn sàng");

};

img.src=url;

};


/*
=========================================
AFFINE TRANSFORM
=========================================
*/

/*
MediaPipe target points:

33  = mắt trái
263 = mắt phải
1   = mũi

Source image giả định khuôn mặt
nằm gần giữa ảnh.
*/

function affineFrom3Points(
sx1,sy1,
sx2,sy2,
sx3,sy3,
dx1,dy1,
dx2,dy2,
dx3,dy3
){

const den=
sx1*(sy2-sy3)+
sx2*(sy3-sy1)+
sx3*(sy1-sy2);

if(Math.abs(den)<0.00001){
return null;
}

const a=
(
dx1*(sy2-sy3)+
dx2*(sy3-sy1)+
dx3*(sy1-sy2)
)/den;

const c=
(
dx1*(sx3-sx2)+
dx2*(sx1-sx3)+
dx3*(sx2-sx1)
)/den;

const e=
(
dx1*(sx2*sy3-sx3*sy2)+
dx2*(sx3*sy1-sx1*sy3)+
dx3*(sx1*sy2-sx2*sy1)
)/den;

const b=
(
dy1*(sy2-sy3)+
dy2*(sy3-sy1)+
dy3*(sy1-sy2)
)/den;

const d=
(
dy1*(sx3-sx2)+
dy2*(sx1-sx3)+
dy3*(sx2-sx1)
)/den;

const f=
(
dy1*(sx2*sy3-sx3*sy2)+
dy2*(sx3*sy1-sx1*sy3)+
dy3*(sx1*sy2-sx2*sy1)
)/den;

return {a,b,c,d,e,f};

}


/*
=========================================
FACE WARP
=========================================
*/

function drawWarp(landmarks){

if(!sourceImage)return;


/*
Target points
*/

const pLeft=landmarks[33];

const pRight=landmarks[263];

const pNose=landmarks[1];


/*
Convert target to mirrored
canvas coordinates
*/

const dx1=
(1-pLeft.x)*canvas.width;

const dy1=
pLeft.y*canvas.height;

const dx2=
(1-pRight.x)*canvas.width;

const dy2=
pRight.y*canvas.height;

const dx3=
(1-pNose.x)*canvas.width;

const dy3=
pNose.y*canvas.height;


/*
Source anchors.

Assume the selected portrait
has face approximately centered.
*/

const sw=sourceImage.naturalWidth;

const sh=sourceImage.naturalHeight;


/*
Source eye/nose positions.
These are deliberately approximate
for this prototype.
*/

const sx1=sw*.35;
const sy1=sh*.38;

const sx2=sw*.65;
const sy2=sh*.38;

const sx3=sw*.50;
const sy3=sh*.53;


const matrix=
affineFrom3Points(

sx1,sy1,
sx2,sy2,
sx3,sy3,

dx1,dy1,
dx2,dy2,
dx3,dy3

);


if(!matrix)return;


/*
Face boundary
*/

let minX=1;
let minY=1;
let maxX=0;
let maxY=0;


/*
Use outer face landmarks
*/

for(const p of landmarks){

minX=Math.min(minX,p.x);
minY=Math.min(minY,p.y);
maxX=Math.max(maxX,p.x);
maxY=Math.max(maxY,p.y);

}


const left=
(1-maxX)*canvas.width;

const top=
minY*canvas.height;

const right=
(1-minX)*canvas.width;

const bottom=
maxY*canvas.height;


/*
Mask
*/

ctx.save();

ctx.beginPath();

ctx.ellipse(

(left+right)/2,

(top+bottom)/2,

(right-left)/2,

(bottom-top)/2,

0,

0,

Math.PI*2

);

ctx.clip();


/*
Apply affine transform
*/

ctx.setTransform(

matrix.a,
matrix.b,
matrix.c,
matrix.d,
matrix.e,
matrix.f

);

ctx.drawImage(

sourceImage,

0,
0

);


/*
Restore
*/

ctx.restore();

}


/*
=========================================
TRACKING
=========================================
*/

function drawResult(result){

ctx.setTransform(1,0,0,1,0,0);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const detected=
result.faceLandmarks||[];

faces.textContent=
detected.length;


if(!detected.length){

setStatus("Đang tìm khuôn mặt...");

return;

}


const landmarks=
detected[0];


if(sourceImage){

drawWarp(landmarks);

setStatus("FACE WARP OK");

}else{

setStatus("FACE TRACKING OK");

ctx.fillStyle="#34c759";

for(
let i=0;
i<landmarks.length;
i+=3
){

const p=landmarks[i];

const x=
(1-p.x)*canvas.width;

const y=
p.y*canvas.height;

ctx.beginPath();

ctx.arc(
x,
y,
1.6,
0,
Math.PI*2
);

ctx.fill();

}

}

}


/*
=========================================
REALTIME LOOP
=========================================
*/

function processFrame(now){

if(
!running ||
!landmarker ||
video.readyState<2
){

requestAnimationFrame(processFrame);

return;

}


cameraFrames++;


if(now-fpsStart>=1000){

cameraFPS.textContent=
cameraFrames;

aiFPS.textContent=
aiFrames;

cameraFrames=0;
aiFrames=0;

fpsStart=now;

}


if(
video.currentTime!==lastVideoTime
){

lastVideoTime=
video.currentTime;


const t=
performance.now();


try{

const result=
landmarker.detectForVideo(
video,
now
);


latency.textContent=
(
performance.now()-t
).toFixed(1);


drawResult(result);

aiFrames++;

}catch(error){

console.error(error);

setStatus("AI ERROR");

}

}


requestAnimationFrame(processFrame);

}


/*
=========================================
START
=========================================
*/

start.onclick=
async function(){

start.disabled=true;

try{

await startCamera();

await loadAI();

running=true;

start.style.display="none";

message.style.display="none";

requestAnimationFrame(processFrame);

}catch(error){

console.error(error);

setStatus(
"LỖI: "+error.name
);

message.innerHTML=
"<b class='red'>FACELIVE ERROR</b><br><br>"+
error.name+"<br>"+
error.message;

message.style.display="block";

start.disabled=false;

}

};

</script>

</body>
</html>
