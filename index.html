<!doctype html>
<html lang="vi">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>FaceLive 1.3</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:
-apple-system,
BlinkMacSystemFont,
"Helvetica Neue",
Arial,
sans-serif;
}

#app{
position:fixed;
inset:0;
background:#000;
}

#video{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
background:#000;
}

#canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
pointer-events:none;
}

.panel{
background:rgba(0,0,0,.66);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
border-radius:15px;
}

#top{
position:absolute;
top:max(15px,env(safe-area-inset-top));
left:12px;
right:12px;
display:flex;
justify-content:space-between;
align-items:flex-start;
z-index:20;
}

#title{
padding:12px 14px;
font-size:19px;
font-weight:700;
}

#stats{
padding:11px 13px;
font-size:12px;
line-height:1.6;
text-align:right;
font-variant-numeric:tabular-nums;
}

#bottom{
position:absolute;
left:12px;
right:12px;
bottom:max(15px,env(safe-area-inset-bottom));
z-index:20;
}

#status{
display:inline-block;
padding:10px 13px;
margin-bottom:8px;
font-size:13px;
}

button,label{
display:block;
width:100%;
padding:15px;
border:0;
border-radius:16px;
background:rgba(255,255,255,.18);
color:#fff;
font-size:16px;
font-weight:700;
text-align:center;
margin-top:7px;
}

button:disabled{
opacity:.5;
}

input{
display:none;
}

#message{
position:absolute;
left:20px;
right:20px;
top:50%;
transform:translateY(-50%);
text-align:center;
font-size:15px;
line-height:1.6;
z-index:10;
pointer-events:none;
}

.green{
color:#34c759;
}

.red{
color:#ff453a;
}

.yellow{
color:#ffd60a;
}

</style>

</head>

<body>

<div id="app">

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>

<div id="message">

<b>FaceLive 1.3</b>

<br>

<span style="opacity:.7">
Eye Anchored Face Warp
</span>

</div>


<div id="top">

<div id="title" class="panel">
FaceLive 1.3
</div>

<div id="stats" class="panel">

Camera:
<b id="cameraFPS">--</b>
FPS

<br>

AI:
<b id="aiFPS">--</b>
FPS

<br>

Inference:
<b id="latency">--</b>
ms

<br>

Faces:
<b id="faces">0</b>

<br>

Resolution:
<b id="resolution">--</b>

<br>

Mode:
<b id="mode">Tracking</b>

</div>

</div>


<div id="bottom">

<div id="status" class="panel">
● Camera chưa khởi động
</div>

<button id="start">
START FACELIVE
</button>

<label for="photo">
📷 CHỌN ẢNH KHUÔN MẶT MẪU
</label>

<input
id="photo"
type="file"
accept="image/*">

</div>

</div>


<script type="module">

/* =================================================
   MEDIAPIPE
================================================= */

import {
FaceLandmarker,
FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/* =================================================
   ELEMENTS
================================================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const photo =
document.getElementById("photo");

const cameraFPS =
document.getElementById("cameraFPS");

const aiFPS =
document.getElementById("aiFPS");

const latency =
document.getElementById("latency");

const faces =
document.getElementById("faces");

const mode =
document.getElementById("mode");

const resolution =
document.getElementById("resolution");


/* =================================================
   STATE
================================================= */

let landmarker = null;
let stream = null;
let running = false;
let lastVideoTime = -1;

let sourceImage = null;

let cameraFrames = 0;
let aiFrames = 0;

let fpsStart = performance.now();


/* =================================================
   STATUS
================================================= */

function setStatus(text){

status.textContent =
"● " + text;

}


/* =================================================
   CAMERA
================================================= */

async function startCamera(){

setStatus(
"Đang mở camera..."
);

stream =
await navigator.mediaDevices.getUserMedia({

audio:false,

video:{

facingMode:{
ideal:"user"
},

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30,
max:30
}

}

});

video.srcObject =
stream;

await video.play();


/*
Đợi kích thước camera thực sự
sẵn sàng.
*/

await new Promise(resolve => {

if(
video.videoWidth &&
video.videoHeight
){

resolve();

return;

}

video.onloadedmetadata =
resolve;

});


canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;


resolution.textContent =
video.videoWidth +
" × " +
video.videoHeight;


setStatus(
"CAMERA OK"
);

}


/* =================================================
   AI
================================================= */

async function loadAI(){

setStatus(
"Đang tải AI..."
);


const vision =
await FilesetResolver
.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

);


landmarker =
await FaceLandmarker
.createFromOptions(

vision,

{

baseOptions:{

modelAssetPath:

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

delegate:"GPU"

},

runningMode:"VIDEO",

numFaces:1,

minFaceDetectionConfidence:.5,

minFacePresenceConfidence:.5,

minTrackingConfidence:.5,

outputFaceBlendshapes:true,

outputFacialTransformationMatrixes:true

}

);


setStatus(
"AI FACE MESH OK"
);

}


/* =================================================
   LOAD PHOTO
================================================= */

photo.addEventListener(
"change",
function(event){

const file =
event.target.files[0];

if(!file){
return;
}


const url =
URL.createObjectURL(file);

const img =
new Image();


img.onload =
function(){

sourceImage =
img;

mode.textContent =
"Photo Warp";


message.innerHTML =

"<b class='green'>" +
"ẢNH MẪU OK" +
"</b><br>" +
"Đã sẵn sàng biến dạng khuôn mặt";


message.style.display =
"block";


setStatus(
"Ảnh mẫu đã sẵn sàng"
);

};


img.onerror =
function(){

setStatus(
"Không đọc được ảnh"
);

};


img.src =
url;

});


/* =================================================
   POINT
================================================= */

function point(
landmarks,
index
){

const p =
landmarks[index];

return {

x:
(1-p.x) *
canvas.width,

y:
p.y *
canvas.height

};

}


/* =================================================
   FACE BOUNDS
================================================= */

function getBounds(
landmarks
){

let minX =
canvas.width;

let minY =
canvas.height;

let maxX = 0;
let maxY = 0;


for(
const p of landmarks
){

const x =
(1-p.x) *
canvas.width;

const y =
p.y *
canvas.height;


minX =
Math.min(minX,x);

minY =
Math.min(minY,y);

maxX =
Math.max(maxX,x);

maxY =
Math.max(maxY,y);

}


return {

left:minX,
top:minY,
right:maxX,
bottom:maxY,

width:
maxX-minX,

height:
maxY-minY

};

}


/* =================================================
   AFFINE MATRIX
================================================= */

function affine(
s1,s2,s3,
d1,d2,d3
){

const den =

s1.x*(s2.y-s3.y) +
s2.x*(s3.y-s1.y) +
s3.x*(s1.y-s2.y);


if(
Math.abs(den)<0.000001
){
return null;
}


const a =

(
d1.x*(s2.y-s3.y) +
d2.x*(s3.y-s1.y) +
d3.x*(s1.y-s2.y)
)/den;


const c =

(
d1.x*(s3.x-s2.x) +
d2.x*(s1.x-s3.x) +
d3.x*(s2.x-s1.x)
)/den;


const e =

(
d1.x*(s2.x*s3.y-s3.x*s2.y) +
d2.x*(s3.x*s1.y-s1.x*s3.y) +
d3.x*(s1.x*s2.y-s2.x*s1.y)
)/den;


const b =

(
d1.y*(s2.y-s3.y) +
d2.y*(s3.y-s1.y) +
d3.y*(s1.y-s2.y)
)/den;


const d =

(
d1.y*(s3.x-s2.x) +
d2.y*(s1.x-s3.x) +
d3.y*(s2.x-s1.x)
)/den;


const f =

(
d1.y*(s2.x*s3.y-s3.x*s2.y) +
d2.y*(s3.x*s1.y-s1.x*s3.y) +
d3.y*(s1.x*s2.y-s2.x*s1.y)
)/den;


return {
a,b,c,d,e,f
};

}


/* =================================================
   TRIANGLE
================================================= */

function drawTriangle(
image,
s1,s2,s3,
d1,d2,d3
){

const m =
affine(
s1,s2,s3,
d1,d2,d3
);

if(!m){
return;
}


ctx.save();


ctx.beginPath();

ctx.moveTo(
d1.x,
d1.y
);

ctx.lineTo(
d2.x,
d2.y
);

ctx.lineTo(
d3.x,
d3.y
);

ctx.closePath();

ctx.clip();


ctx.setTransform(
m.a,
m.b,
m.c,
m.d,
m.e,
m.f
);


ctx.drawImage(
image,
0,
0
);


ctx.restore();

}


/* =================================================
   PHOTO WARP
================================================= */

function drawPhotoWarp(
landmarks
){

if(!sourceImage){
return;
}


const bounds =
getBounds(
landmarks
);


/*
Camera landmarks
*/

const leftEye =
point(landmarks,33);

const rightEye =
point(landmarks,263);

const nose =
point(landmarks,1);

const mouthLeft =
point(landmarks,61);

const mouthRight =
point(landmarks,291);

const chin =
point(landmarks,152);

const leftFace =
point(landmarks,234);

const rightFace =
point(landmarks,454);

const forehead =
point(landmarks,10);


/*
Ảnh mẫu.

Các điểm này là tỉ lệ tương đối
của khuôn mặt trong ảnh.

Ảnh càng chính diện càng tốt.
*/

const w =
sourceImage.naturalWidth;

const h =
sourceImage.naturalHeight;


const S = {

forehead:{
x:w*.50,
y:h*.20
},

leftEye:{
x:w*.35,
y:h*.38
},

rightEye:{
x:w*.65,
y:h*.38
},

nose:{
x:w*.50,
y:h*.52
},

mouthLeft:{
x:w*.40,
y:h*.65
},

mouthRight:{
x:w*.60,
y:h*.65
},

chin:{
x:w*.50,
y:h*.82
},

leftFace:{
x:w*.18,
y:h*.52
},

rightFace:{
x:w*.82,
y:h*.52
}

};


/*
Khoảng cách hai mắt.

Dùng làm scale realtime.
*/

const dx =
rightEye.x-leftEye.x;

const dy =
rightEye.y-leftEye.y;

const eyeDistance =
Math.sqrt(
dx*dx+dy*dy
);


/*
Nhấc mesh lên một chút.

Bản trước của bạn bị thấp.
*/

const lift =
eyeDistance*.055;


/*
Target.
*/

const T = {

forehead:{
x:forehead.x,
y:forehead.y-lift
},

leftEye:{
x:leftEye.x,
y:leftEye.y
},

rightEye:{
x:rightEye.x,
y:rightEye.y
},

nose:{
x:nose.x,
y:nose.y-lift*.2
},

mouthLeft:{
x:mouthLeft.x,
y:mouthLeft.y-lift*.35
},

mouthRight:{
x:mouthRight.x,
y:mouthRight.y-lift*.35
},

chin:{
x:chin.x,
y:chin.y-lift*.4
},

leftFace:{
x:leftFace.x,
y:leftFace.y-lift*.5
},

rightFace:{
x:rightFace.x,
y:rightFace.y-lift*.5
}

};


/*
Thu hẹp nhẹ để không tràn khỏi mặt.
*/

const centerX =
(
T.leftEye.x+
T.rightEye.x
)/2;


const widthScale = .97;


for(
const key in T
){

T[key].x =

centerX +
(
T[key].x-centerX
) *
widthScale;

}


/*
Padding.
*/

T.leftFace.x -=
bounds.width*.02;

T.rightFace.x +=
bounds.width*.02;

T.forehead.y -=
bounds.height*.015;

T.chin.y +=
bounds.height*.015;


/*
Xóa canvas.
*/

ctx.setTransform(
1,0,0,1,0,0
);

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);


/*
9 vùng warp.
*/

drawTriangle(
sourceImage,

S.forehead,
S.leftEye,
S.leftFace,

T.forehead,
T.leftEye,
T.leftFace
);


drawTriangle(
sourceImage,

S.forehead,
S.rightFace,
S.rightEye,

T.forehead,
T.rightFace,
T.rightEye
);


drawTriangle(
sourceImage,

S.leftEye,
S.nose,
S.leftFace,

T.leftEye,
T.nose,
T.leftFace
);


drawTriangle(
sourceImage,

S.nose,
S.rightEye,
S.rightFace,

T.nose,
T.rightEye,
T.rightFace
);


drawTriangle(
sourceImage,

S.nose,
S.leftFace,
S.mouthLeft,

T.nose,
T.leftFace,
T.mouthLeft
);


drawTriangle(
sourceImage,

S.nose,
S.mouthRight,
S.rightFace,

T.nose,
T.mouthRight,
T.rightFace
);


drawTriangle(
sourceImage,

S.mouthLeft,
S.chin,
S.leftFace,

T.mouthLeft,
T.chin,
T.leftFace
);


drawTriangle(
sourceImage,

S.chin,
S.rightFace,
S.mouthRight,

T.chin,
T.rightFace,
T.mouthRight
);


drawTriangle(
sourceImage,

S.leftEye,
S.rightEye,
S.nose,

T.leftEye,
T.rightEye,
T.nose
);


/*
Status.
*/

mode.textContent =
"Photo Warp";

setStatus(
"FACE WARP OK"
);

}


/* =================================================
   NORMAL MESH
================================================= */

function drawMesh(
landmarks
){

ctx.setTransform(
1,0,0,1,0,0
);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


ctx.fillStyle =
"#34c759";


for(
let i=0;
i<landmarks.length;
i+=3
){

const p =
landmarks[i];


const x =
(1-p.x) *
canvas.width;

const y =
p.y *
canvas.height;


ctx.beginPath();

ctx.arc(
x,y,
1.5,
0,
Math.PI*2
);

ctx.fill();

}


mode.textContent =
"Tracking";

setStatus(
"FACE MESH OK"
);

}


/* =================================================
   DRAW
================================================= */

function drawResult(
result
){

const detected =
result.faceLandmarks ||
[];


faces.textContent =
detected.length;


if(
detected.length===0
){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

setStatus(
"Đang tìm khuôn mặt..."
);

return;

}


const landmarks =
detected[0];


if(sourceImage){

drawPhotoWarp(
landmarks
);

}else{

drawMesh(
landmarks
);

}

}


/* =================================================
   REALTIME
================================================= */

function processFrame(
now
){

if(
!running ||
!landmarker ||
video.readyState<2
){

requestAnimationFrame(
processFrame
);

return;

}


cameraFrames++;


if(
now-fpsStart>=1000
){

cameraFPS.textContent =
cameraFrames;

aiFPS.textContent =
aiFrames;

cameraFrames=0;
aiFrames=0;

fpsStart=now;

}


if(
video.currentTime !==
lastVideoTime
){

lastVideoTime =
video.currentTime;


const t =
performance.now();


try{

const result =
landmarker.detectForVideo(
video,
now
);


latency.textContent =
(
performance.now()-t
).toFixed(1);


drawResult(
result
);


aiFrames++;

}
catch(error){

console.error(
error
);

setStatus(
"AI ERROR"
);

}

}


requestAnimationFrame(
processFrame
);

}


/* =================================================
   START
================================================= */

start.addEventListener(
"click",
async function(){

start.disabled =
true;


try{

/*
QUAN TRỌNG:

Camera trước.
AI sau.

Không thay đổi thứ tự này.
*/

await startCamera();

await loadAI();

running =
true;

start.style.display =
"none";

message.style.display =
"none";

requestAnimationFrame(
processFrame
);

}
catch(error){

console.error(
"FACELIVE ERROR:",
error
);

setStatus(
"Lỗi: " +
error.name
);


message.innerHTML =

"<b class='red'>" +
"FACELIVE ERROR" +
"</b><br><br>" +

error.name +
"<br>" +

error.message;


message.style.display =
"block";


start.disabled =
false;

}

});

</script>

</body>
</html>
