<title>FaceLive 2.2</title>

<style>
*{box-sizing:border-box}

html,body{

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<div id="message">
<b>FaceLive 2.2</b><br>
<span style="opacity:.7">
Camera + Face Mesh
</span>
</div>

<div id="top">

<div id="title" class="panel">
FaceLive 2.2
</div>

<div id="stats" class="panel">

Camera:
<b id="cameraFPS">--</b> FPS<br>

AI:
<b id="aiFPS">--</b> FPS<br>

Inference:
<b id="latency">--</b> ms<br>

Faces:
<b id="faces">0</b><br>

Resolution:
<b id="resolution">--</b>

</div>

<div id="status" class="panel">
● Chưa khởi động
</div>

START FACELIVE
</button>

</div>

<script type="module">

/* =========================================
   MEDIAPIPE
========================================= */

let FaceLandmarker = null;
let FilesetResolver = null;


/* =========================================
   ELEMENTS
========================================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const start =
document.getElementById("start");

const status =
document.getElementById("status");

const message =
document.getElementById("message");

const cameraFPS =
document.getElementById("cameraFPS");

const aiFPS =
document.getElementById("aiFPS");

const latency =
document.getElementById("latency");

const faces =
document.getElementById("faces");

const resolution =
document.getElementById("resolution");


/* =========================================
   STATE
========================================= */

let stream = null;
let landmarker = null;
let running = false;
let lastVideoTime = -1;

let cameraFrames = 0;
let aiFrames = 0;
let fpsTime = performance.now();


/* =========================================
   STATUS
========================================= */

function setStatus(text){
status.textContent = "● " + text;
}


/* =========================================
   CAMERA
========================================= */

async function startCamera(){

setStatus("Đang mở camera...");

const media =
navigator.mediaDevices;

if(
!media ||
!media.getUserMedia
){
throw new Error(
"Camera API không được hỗ trợ"
);
}

stream =
await media.getUserMedia({

audio:false,

video:{
facingMode:"user",

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30
}
}

});

video.srcObject = stream;

await video.play();

await new Promise(resolve => {

if(video.videoWidth > 0){
resolve();
}else{
video.onloadedmetadata = resolve;
}

});

canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;

resolution.textContent =
video.videoWidth +
" × " +
video.videoHeight;

setStatus("CAMERA OK");
}


/* =========================================
   LOAD MEDIAPIPE MODULE
========================================= */

async function loadMediaPipe(){

setStatus("Đang tải MediaPipe...");

try{

const module =
await import(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm"
);

FaceLandmarker =
module.FaceLandmarker;

FilesetResolver =
module.FilesetResolver;

if(
!FaceLandmarker ||
!FilesetResolver
){

throw new Error(
"MediaPipe module không đầy đủ"
);

}

}catch(error){

throw new Error(
"Không tải được MediaPipe: " +
error.message
);

}

setStatus("MediaPipe JavaScript OK");
}


/* =========================================
   CREATE FACE LANDMARKER
========================================= */

async function createFaceLandmarker(){

setStatus("Đang khởi tạo Face Mesh...");

const vision =
await FilesetResolver.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

);

landmarker =
await FaceLandmarker.createFromOptions(

vision,

{

baseOptions:{

modelAssetPath:

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

delegate:"GPU"

},

runningMode:"VIDEO",

numFaces:1,

minFaceDetectionConfidence:.5,

minFacePresenceConfidence:.5,

minTrackingConfidence:.5,

outputFaceBlendshapes:true,

outputFacialTransformationMatrixes:true

}

);

setStatus("MEDIAPIPE OK");
}


/* =========================================
   DRAW MESH
========================================= */

function drawMesh(result){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

const detected =
result.faceLandmarks || [];

faces.textContent =
detected.length;

if(!detected.length){

setStatus("Đang tìm khuôn mặt...");
return;
}

const landmarks =
detected[0];

ctx.fillStyle =
"#34c759";

for(
let i=0;
i<landmarks.length;
i+=3
){

const p =
landmarks[i];

const x =
(1-p.x) *
canvas.width;

const y =
p.y *
canvas.height;

ctx.beginPath();

ctx.arc(
x,
y,
1.6,
0,
Math.PI*2
);

ctx.fill();
}

setStatus("FACE MESH OK");
}


/* =========================================
   LOOP
========================================= */

function processFrame(now){

if(!running){
return;
}

cameraFrames++;

if(now-fpsTime >= 1000){

cameraFPS.textContent =
cameraFrames;

aiFPS.textContent =
aiFrames;

cameraFrames = 0;
aiFrames = 0;

fpsTime = now;
}

if(
landmarker &&
video.readyState >= 2 &&
video.currentTime !== lastVideoTime
){

lastVideoTime =
video.currentTime;

const t =
performance.now();

try{

const result =
landmarker.detectForVideo(
video,
now
);

latency.textContent =
(
performance.now()-t
).toFixed(1);

drawMesh(result);

aiFrames++;

}catch(error){

console.error(error);

setStatus(
"FACE MESH ERROR"
);

}

}

requestAnimationFrame(
processFrame
);
}


/* =========================================
   START
========================================= */

start.onclick =
async function(){

start.disabled = true;

try{

/*
Camera trước.
*/

await startCamera();

/*
MediaPipe sau.
*/

await loadMediaPipe();

/*
Face Mesh.
*/

await createFaceLandmarker();

/*
Chạy realtime.
*/

running = true;

message.style.display =
"none";

start.style.display =
"none";

requestAnimationFrame(
processFrame
);

}catch(error){

console.error(
"FaceLive:",
error
);

/*
Camera vẫn giữ nguyên nếu AI lỗi.
*/

setStatus(
"LỖI: " +
error.message
);

message.innerHTML =

"<b class='red'>" +
"FACELIVE ERROR" +
"</b><br><br>" +

error.message;

message.style.display =
"block";

start.disabled = false;

}

};

</script>

</body>
</html>
