<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,
maximum-scale=1,viewport-fit=cover">

<title>FaceLive 2.9.1</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:Arial,sans-serif
}

#video{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
background:#000
}

#canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
pointer-events:none
}

#top{
position:fixed;
top:15px;
left:12px;
right:12px;
z-index:10;
display:flex;
justify-content:space-between;
align-items:flex-start
}

.panel{
background:rgba(0,0,0,.72);
border-radius:15px;
padding:12px
}

#title{
font-size:19px;
font-weight:bold
}

#stats{
font-size:12px;
line-height:1.7;
text-align:right
}

#bottom{
position:fixed;
left:12px;
right:12px;
bottom:15px;
z-index:20
}

#status{
display:inline-block;
font-size:14px;
margin-bottom:8px
}

button{
display:block;
width:100%;
padding:17px;
border:0;
border-radius:16px;
background:#333;
color:#fff;
font-size:17px;
font-weight:bold;
margin-top:8px
}

button:disabled{
opacity:.5
}

#photoInput{
display:block;
width:100%;
margin-top:8px;
padding:12px;
border-radius:14px;
background:#222;
color:#fff;
font-size:15px
}

#controls{
display:none;
background:rgba(0,0,0,.72);
border-radius:14px;
padding:10px;
margin-top:8px;
font-size:13px
}

.controlRow{
margin-top:5px;
margin-bottom:8px
}

#controls input{
width:100%
}

#photoPreview{
display:none;
position:fixed;
right:12px;
bottom:230px;
width:95px;
height:120px;
object-fit:cover;
border-radius:14px;
border:2px solid #34c759;
z-index:25
}

#message{
position:fixed;
top:50%;
left:20px;
right:20px;
transform:translateY(-50%);
text-align:center;
font-size:16px;
line-height:1.6;
z-index:5
}

.green{color:#34c759}
.red{color:#ff453a}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="canvas"></canvas>

<img id="photoPreview" alt="Ảnh mẫu">

<div id="message">
<b>FaceLive 2.9.1</b><br>
<span style="opacity:.7">
Natural Face Morph
</span>
</div>

<div id="top">

<div id="title" class="panel">
FaceLive 2.9.1
</div>

<div id="stats" class="panel">

Camera:
<b id="cameraFPS">--</b> FPS
<br>

AI:
<b id="aiFPS">--</b> FPS
<br>

Inference:
<b id="latency">--</b> ms
<br>

Camera Face:
<b id="faces">0</b>
<br>

Photo Face:
<b id="photoFaces">0</b>
<br>

Photo:
<b id="photoState">OFF</b>
<br>

Mode:
<b id="mode">Tracking</b>

</div>

</div>

<div id="bottom">

<div id="status" class="panel">
● Chưa khởi động
</div>

<button id="start" type="button">
START FACELIVE
</button>

<input
id="photoInput"
type="file"
accept="image/*">

<div id="controls">

<div class="controlRow">
Warp:
<b id="warpValue">72</b>%
</div>

<input
id="warp"
type="range"
min="0"
max="100"
value="72">

<div class="controlRow">
Blend:
<b id="blendValue">82</b>%
</div>

<input
id="blend"
type="range"
min="40"
max="100"
value="82">

<div class="controlRow">
Feather:
<b id="featherValue">78</b>%
</div>

<input
id="feather"
type="range"
min="30"
max="100"
value="78">

</div>

</div>


<script type="module">


/* =========================================
   MEDIAPIPE
========================================= */

let FaceLandmarker=null;
let FilesetResolver=null;

let cameraLandmarker=null;
let imageLandmarker=null;


/* =========================================
   ELEMENTS
========================================= */

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const start=document.getElementById("start");
const status=document.getElementById("status");
const message=document.getElementById("message");

const cameraFPS=document.getElementById("cameraFPS");
const aiFPS=document.getElementById("aiFPS");
const latency=document.getElementById("latency");
const faces=document.getElementById("faces");
const photoFaces=document.getElementById("photoFaces");
const photoState=document.getElementById("photoState");
const mode=document.getElementById("mode");

const photoInput=document.getElementById("photoInput");
const photoPreview=document.getElementById("photoPreview");

const controls=document.getElementById("controls");

const warp=document.getElementById("warp");
const blend=document.getElementById("blend");
const feather=document.getElementById("feather");

const warpValue=document.getElementById("warpValue");
const blendValue=document.getElementById("blendValue");
const featherValue=document.getElementById("featherValue");


/* =========================================
   STATE
========================================= */

let stream=null;
let running=false;
let lastVideoTime=-1;

let cameraFrames=0;
let aiFrames=0;
let fpsTime=performance.now();

let sourceImage=null;
let sourceLandmarks=null;


/* =========================================
   CONTROLS
========================================= */

warp.oninput=()=>{
warpValue.textContent=warp.value;
};

blend.oninput=()=>{
blendValue.textContent=blend.value;
};

feather.oninput=()=>{
featherValue.textContent=feather.value;
};


/* =========================================
   STATUS
========================================= */

function setStatus(text){
status.textContent="● "+text;
}


/* =========================================
   CAMERA
========================================= */

async function startCamera(){

setStatus("Đang mở camera...");

if(
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
){
throw new Error(
"Camera API không được hỗ trợ"
);
}

stream=await navigator.mediaDevices.getUserMedia({

audio:false,

video:{
facingMode:"user",
width:{ideal:1280},
height:{ideal:720},
frameRate:{ideal:30}
}

});

video.srcObject=stream;

await video.play();

await new Promise(resolve=>{

if(video.videoWidth>0){
resolve();
}else{
video.onloadedmetadata=resolve;
}

});

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

setStatus("CAMERA OK");
}


/* =========================================
   MEDIAPIPE
========================================= */

async function loadMediaPipe(){

setStatus("Đang tải MediaPipe...");

const module=await import(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm"
);

FaceLandmarker=module.FaceLandmarker;
FilesetResolver=module.FilesetResolver;

if(
!FaceLandmarker ||
!FilesetResolver
){
throw new Error(
"MediaPipe module không đầy đủ"
);
}

setStatus("MediaPipe JavaScript OK");
}


/* =========================================
   CAMERA LANDMARKER
========================================= */

async function createCameraLandmarker(){

setStatus(
"Đang khởi tạo Camera Face Mesh..."
);

const vision=
await FilesetResolver.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

);

cameraLandmarker=
await FaceLandmarker.createFromOptions(
vision,
{

baseOptions:{

modelAssetPath:

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

delegate:"GPU"

},

runningMode:"VIDEO",
numFaces:1,

minFaceDetectionConfidence:.5,
minFacePresenceConfidence:.5,
minTrackingConfidence:.5,

outputFaceBlendshapes:true,
outputFacialTransformationMatrixes:true

}
);

setStatus("CAMERA FACEMESH OK");
}


/* =========================================
   IMAGE LANDMARKER
========================================= */

async function createImageLandmarker(){

setStatus(
"Đang khởi tạo Photo Face AI..."
);

const vision=
await FilesetResolver.forVisionTasks(

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

);

imageLandmarker=
await FaceLandmarker.createFromOptions(
vision,
{

baseOptions:{

modelAssetPath:

"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

delegate:"GPU"

},

runningMode:"IMAGE",
numFaces:1,

minFaceDetectionConfidence:.4,
minFacePresenceConfidence:.4,
minTrackingConfidence:.4,

outputFaceBlendshapes:true,
outputFacialTransformationMatrixes:true

}
);

setStatus("PHOTO FACE AI OK");
}


/* =========================================
   PHOTO
========================================= */

photoInput.addEventListener(
"change",
async event=>{

const file=
event.target.files &&
event.target.files[0];

if(!file)return;

const url=
URL.createObjectURL(file);

const img=new Image();

img.onload=async()=>{

sourceImage=img;

photoPreview.src=url;
photoPreview.style.display="block";

photoState.textContent="ON";

if(imageLandmarker){
await detectPhotoFace();
}

};

img.onerror=()=>{
setStatus("LỖI ĐỌC ẢNH");
};

img.src=url;

}
);


/* =========================================
   PHOTO FACE
========================================= */

async function detectPhotoFace(){

if(
!sourceImage ||
!imageLandmarker
){
return;
}

setStatus("Đang nhận diện mặt ảnh...");

try{

const result=
imageLandmarker.detect(
sourceImage
);

const detected=
result.faceLandmarks || [];

photoFaces.textContent=
detected.length;

if(!detected.length){

sourceLandmarks=null;

setStatus(
"KHÔNG THẤY MẶT TRONG ẢNH"
);

return;

}

sourceLandmarks=
detected[0];

controls.style.display="block";

mode.textContent="ALIGNMENT";

setStatus("PHOTO FACE OK");

message.innerHTML=
"<b class='green'>PHOTO FACE OK</b><br>"+
"Ảnh mẫu đã sẵn sàng";

message.style.display="block";

setTimeout(()=>{
message.style.display="none";
},1000);

}catch(error){

console.error(error);

setStatus("PHOTO AI ERROR");

}

}


/* =========================================
   POINT
========================================= */

function point(
landmarks,
index,
w,
h
){

const p=landmarks[index];

return{
x:(1-p.x)*w,
y:p.y*h
};

}


/* =========================================
   AFFINE
========================================= */

function affine(
s1,s2,s3,
d1,d2,d3
){

const den=
s1.x*(s2.y-s3.y)+
s2.x*(s3.y-s1.y)+
s3.x*(s1.y-s2.y);

if(Math.abs(den)<0.00001){
return null;
}

const a=
(
d1.x*(s2.y-s3.y)+
d2.x*(s3.y-s1.y)+
d3.x*(s1.y-s2.y)
)/den;

const c=
(
d1.x*(s3.x-s2.x)+
d2.x*(s1.x-s3.x)+
d3.x*(s2.x-s1.x)
)/den;

const e=
(
d1.x*(s2.x*s3.y-s3.x*s2.y)+
d2.x*(s3.x*s1.y-s1.x*s3.y)+
d3.x*(s1.x*s2.y-s2.x*s1.y)
)/den;

const b=
(
d1.y*(s2.y-s3.y)+
d2.y*(s3.y-s1.y)+
d3.y*(s1.y-s2.y)
)/den;

const d=
(
d1.y*(s3.x-s2.x)+
d2.y*(s1.x-s3.x)+
d3.y*(s2.x-s1.x)
)/den;

const f=
(
d1.y*(s2.x*s3.y-s3.x*s2.y)+
d2.y*(s3.x*s1.y-s1.x*s3.y)+
d3.y*(s1.x*s2.y-s2.x*s1.y)
)/den;

return{a,b,c,d,e,f};

}


/* =========================================
   TRIANGLE
========================================= */

function drawTriangle(
image,
s1,s2,s3,
d1,d2,d3,
alpha
){

const m=
affine(
s1,s2,s3,
d1,d2,d3
);

if(!m)return;

ctx.save();

ctx.globalAlpha=alpha;

ctx.beginPath();

ctx.moveTo(d1.x,d1.y);
ctx.lineTo(d2.x,d2.y);
ctx.lineTo(d3.x,d3.y);

ctx.closePath();

ctx.clip();

ctx.setTransform(
m.a,m.b,m.c,m.d,m.e,m.f
);

ctx.drawImage(
image,
0,
0
);

ctx.restore();

}


/* =========================================
   SAFE WARP
========================================= */

function faceWarp(
camera
){

if(
!sourceImage ||
!sourceLandmarks
){
return;
}


/*
Source image is kept in the
same coordinate orientation
as MediaPipe.
*/

const sw=
sourceImage.naturalWidth;

const sh=
sourceImage.naturalHeight;

const S=[];

const T=[];

for(
let i=0;
i<sourceLandmarks.length;
i++
){

S.push(
point(
sourceLandmarks,
i,
sw,
sh
)
);

T.push(
point(
camera,
i,
canvas.width,
canvas.height
);

}


/*
Eye geometry.
*/

const sl=S[33];
const sr=S[263];

const tl=T[33];
const tr=T[263];

const se=
Math.hypot(
sr.x-sl.x,
sr.y-sl.y
);

const te=
Math.hypot(
tr.x-tl.x,
tr.y-tl.y
);

if(
se<1 ||
te<1
){
return;
}

const scale=te/se;

const scx=(sl.x+sr.x)/2;
const scy=(sl.y+sr.y)/2;

const tcx=(tl.x+tr.x)/2;
const tcy=(tl.y+tr.y)/2;

const strength=
Number(warp.value)/100;

const D={};


/*
Create target coordinates.
*/

for(
let i=0;
i<S.length;
i++
){

const s=S[i];
const t=T[i];

const predicted={

x:
tcx+(s.x-scx)*scale,

y:
tcy+(s.y-scy)*scale

};

D[i]={

x:
predicted.x*(1-strength)+
t.x*strength,

y:
predicted.y*(1-strength)+
t.y*strength

};

}


/*
Important facial landmarks.
*/

const tri=[

/* forehead */

[10,33,234],
[10,234,93],
[10,93,109],
[10,109,338],
[10,338,297],
[10,297,454],
[10,454,263],

/* eyes */

[33,160,1],
[160,158,1],
[158,133,1],

[263,385,1],
[385,362,1],
[362,387,1],

/* cheeks */

[234,93,132],
[93,162,132],
[132,58,172],

[454,323,361],
[323,327,361],
[361,288,397],

/* nose */

[33,1,234],
[263,454,1],

/* mouth */

[61,91,1],
[91,181,1],
[181,84,17],

[314,405,291],
[405,321,291],
[291,17,314],

/* lower face */

[61,152,234],
[291,454,152],

[152,234,172],
[152,172,397],
[152,397,454]

];

const alpha=
Number(blend.value)/100;


/*
Draw triangles.
*/

for(
const q of tri
){

drawTriangle(

sourceImage,

S[q[0]],
S[q[1]],
S[q[2]],

D[q[0]],
D[q[1]],
D[q[2]],

alpha

);

}


/*
Soft edge.
*/

applyFeather(camera);

}


/* =========================================
   FEATHER
========================================= */

function applyFeather(
landmarks
){

let minX=canvas.width;
let minY=canvas.height;

let maxX=0;
let maxY=0;

for(
const p of landmarks
){

const x=
(1-p.x)*canvas.width;

const y=
p.y*canvas.height;

minX=Math.min(minX,x);
minY=Math.min(minY,y);

maxX=Math.max(maxX,x);
maxY=Math.max(maxY,y);

}

const cx=(minX+maxX)/2;
const cy=(minY+maxY)/2;

const rx=(maxX-minX)*.56;
const ry=(maxY-minY)*.58;

const amount=
Number(feather.value)/100;

ctx.save();

ctx.globalCompositeOperation=
"destination-out";

const g=
ctx.createRadialGradient(

cx,cy,
Math.min(rx,ry)*.60,

cx,cy,
Math.max(rx,ry)

);

g.addColorStop(
0,
"rgba(0,0,0,0)"
);

g.addColorStop(
.70,
"rgba(0,0,0,0)"
);

g.addColorStop(
.86,
`rgba(0,0,0,${.22*amount})`
);

g.addColorStop(
.94,
`rgba(0,0,0,${.65*amount})`
);

g.addColorStop(
1,
"rgba(0,0,0,1)"
);

ctx.fillStyle=g;

ctx.beginPath();

ctx.ellipse(
cx,
cy,
rx,
ry,
0,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

}


/* =========================================
   RESULT
========================================= */

function drawResult(
landmarks
){

ctx.setTransform(
1,0,0,1,0,0
);

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

faces.textContent="1";

if(
sourceImage &&
sourceLandmarks
){

faceWarp(landmarks);

photoFaces.textContent="1";
photoState.textContent="ON";
mode.textContent="FACE WARP";

setStatus("FACE WARP OK");

return;

}


/*
Tracking only.
*/

ctx.fillStyle="#34c759";

for(
let i=0;
i<landmarks.length;
i+=3
){

const p=landmarks[i];

const x=
(1-p.x)*canvas.width;

const y=
p.y*canvas.height;

ctx.beginPath();

ctx.arc(
x,y,
1.5,
0,
Math.PI*2
);

ctx.fill();

}

mode.textContent="Tracking";

setStatus("FACE MESH OK");

}


/* =========================================
   REALTIME
========================================= */

function processFrame(now){

if(!running)return;

cameraFrames++;

if(
now-fpsTime>=1000
){

cameraFPS.textContent=
cameraFrames;

aiFPS.textContent=
aiFrames;

cameraFrames=0;
aiFrames=0;
fpsTime=now;

}

if(
cameraLandmarker &&
video.readyState>=2 &&
video.currentTime!==lastVideoTime
){

lastVideoTime=
video.currentTime;

const t=
performance.now();

try{

const result=
cameraLandmarker.detectForVideo(
video,
now
);

latency.textContent=
(
performance.now()-t
).toFixed(1);

const detected=
result.faceLandmarks || [];

faces.textContent=
detected.length;

if(detected.length){

drawResult(
detected[0]
);

}else{

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

faces.textContent="0";

setStatus(
"Đang tìm khuôn mặt..."
);

}

aiFrames++;

}catch(error){

console.error(
"FaceLive:",
error
);

setStatus(
"FACE WARP ERROR"
);

}

}

requestAnimationFrame(
processFrame
);

}


/* =========================================
   START
========================================= */

start.onclick=async function(){

start.disabled=true;

try{

await startCamera();

await loadMediaPipe();

await createCameraLandmarker();

await createImageLandmarker();

running=true;

message.style.display="none";

start.style.display="none";

requestAnimationFrame(
processFrame
);

}catch(error){

console.error(
"FaceLive:",
error
);

setStatus(
"LỖI: "+error.message
);

message.innerHTML=

"<b class='red'>" +
"FACELIVE ERROR" +
"</b><br><br>" +

error.message;

message.style.display="block";

start.disabled=false;

}

};


/* =========================================
   READY
========================================= */

setStatus(
"Sẵn sàng - START rồi chọn ảnh"
);

</script>

</body>
</html>
```
