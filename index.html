<!doctype html>
<html lang="vi">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>FaceLive 3.0</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
    color:#fff;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

#app{
    position:fixed;
    inset:0;
    background:#000;
}

#video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    background:#000;
}

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;
}

.panel{
    background:rgba(0,0,0,.66);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border-radius:15px;
}

#top{
    position:absolute;

    top:max(15px,env(safe-area-inset-top));

    left:12px;
    right:12px;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    z-index:20;
}

#title{
    padding:12px 14px;

    font-size:19px;
    font-weight:700;
}

#stats{
    padding:11px 13px;

    text-align:right;

    font-size:12px;

    line-height:1.6;

    font-variant-numeric:
    tabular-nums;
}

#bottom{
    position:absolute;

    left:12px;
    right:12px;

    bottom:max(
        15px,
        env(safe-area-inset-bottom)
    );

    z-index:20;
}

#status{
    display:inline-block;

    padding:10px 13px;

    margin-bottom:8px;

    font-size:13px;
}

button,
label{
    display:block;

    width:100%;

    padding:14px;

    border:0;

    border-radius:16px;

    background:
    rgba(255,255,255,.18);

    color:#fff;

    font-size:15px;

    font-weight:700;

    text-align:center;

    margin-top:7px;
}

button:active,
label:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.5;
}

input{
    display:none;
}

#message{

    position:absolute;

    left:20px;
    right:20px;

    top:50%;

    transform:
    translateY(-50%);

    text-align:center;

    font-size:15px;

    line-height:1.6;

    z-index:10;

    pointer-events:none;
}

.green{
    color:#34c759;
}

.red{
    color:#ff453a;
}

.yellow{
    color:#ffd60a;
}

</style>

</head>

<body>

<div id="app">


<video
id="video"
autoplay
playsinline
muted>
</video>


<canvas
id="canvas">
</canvas>


<div id="message">

<b>FaceLive 3.0</b>

<br>

<span style="opacity:.7">
Dense Face Mesh Warp
</span>

</div>


<div id="top">


<div
id="title"
class="panel">

FaceLive 3.0

</div>


<div
id="stats"
class="panel">

Camera:
<b id="cameraFPS">--</b>
FPS

<br>

AI:
<b id="aiFPS">--</b>
FPS

<br>

Inference:
<b id="latency">--</b>
ms

<br>

Faces:
<b id="faces">0</b>

<br>

Mode:
<b id="mode">
Tracking
</b>

</div>


</div>


<div id="bottom">


<div
id="status"
class="panel">

● Camera chưa khởi động

</div>


<button
id="start">

START FACELIVE

</button>


<label
for="photo">

📷 CHỌN ẢNH KHUÔN MẶT MẪU

</label>


<input
id="photo"
type="file"
accept="image/*">


</div>

</div>


<script type="module">


/*
==================================================
IMPORT MEDIAPIPE
==================================================
*/

import {

    FaceLandmarker,

    FilesetResolver

}
from

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


/*
==================================================
IMPORT DELAUNATOR
==================================================

Delaunator tạo tam giác cho toàn bộ
landmark khuôn mặt.
==================================================
*/

import Delaunator

from

"https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm";


/*
==================================================
ELEMENTS
==================================================
*/

const video =
document.getElementById(
    "video"
);

const canvas =
document.getElementById(
    "canvas"
);

const ctx =
canvas.getContext(
    "2d"
);

const start =
document.getElementById(
    "start"
);

const status =
document.getElementById(
    "status"
);

const message =
document.getElementById(
    "message"
);

const photo =
document.getElementById(
    "photo"
);

const cameraFPSElement =
document.getElementById(
    "cameraFPS"
);

const aiFPSElement =
document.getElementById(
    "aiFPS"
);

const latencyElement =
document.getElementById(
    "latency"
);

const facesElement =
document.getElementById(
    "faces"
);

const modeElement =
document.getElementById(
    "mode"
);


/*
==================================================
STATE
==================================================
*/

let landmarker =
null;

let stream =
null;

let running =
false;

let lastVideoTime =
-1;


/*
SOURCE IMAGE
*/

let sourceImage =
null;


/*
SOURCE FACE LANDMARKS
*/

let sourcePoints =
null;


/*
TRIANGLES
*/

let triangles =
null;


/*
FPS
*/

let cameraFrames =
0;

let aiFrames =
0;

let fpsTime =
performance.now();


/*
==================================================
STATUS
==================================================
*/

function setStatus(
    text
){

    status.textContent =
    "● " + text;

}


/*
==================================================
CAMERA
==================================================
*/

async function
startCamera(){

    setStatus(
        "Đang mở camera..."
    );


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        throw new Error(
            "Camera API không khả dụng"
        );

    }


    stream =
    await navigator
    .mediaDevices
    .getUserMedia({

        audio:false,

        video:{

            facingMode:{
                ideal:"user"
            },

            width:{
                ideal:1280
            },

            height:{
                ideal:720
            },

            frameRate:{
                ideal:30,
                max:30
            }

        }

    });


    video.srcObject =
    stream;


    await video.play();


    /*
    Wait until dimensions
    are actually available.
    */

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        await new Promise(
            resolve => {

                video.onloadedmetadata =
                () => resolve();

            }
        );

    }


    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;


    setStatus(
        "CAMERA OK"
    );

}


/*
==================================================
LOAD AI
==================================================
*/

async function
loadAI(){

    setStatus(
        "Đang tải AI..."
    );


    const vision =
    await FilesetResolver
    .forVisionTasks(

        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

    );


    landmarker =
    await FaceLandmarker
    .createFromOptions(

        vision,

        {

            baseOptions:{

                modelAssetPath:

                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                delegate:
                "GPU"

            },

            runningMode:
            "VIDEO",

            numFaces:
            1,

            minFaceDetectionConfidence:
            .5,

            minFacePresenceConfidence:
            .5,

            minTrackingConfidence:
            .5,

            outputFaceBlendshapes:
            true,

            outputFacialTransformationMatrixes:
            true

        }

    );


    setStatus(
        "FACE MESH OK"
    );

}


/*
==================================================
CONVERT LANDMARK
==================================================
*/

function
landmarkToCanvas(
    p
){

    return [

        (1-p.x) *
        canvas.width,

        p.y *
        canvas.height

    ];

}


/*
==================================================
SOURCE IMAGE
==================================================
*/

photo.addEventListener(
"change",
async function(event){

    const file =
    event.target.files[0];


    if(!file){

        return;

    }


    if(!landmarker){

        setStatus(
            "Hãy START trước"
        );

        return;

    }


    try{

        message.innerHTML =

        "<b class='yellow'>" +

        "ĐANG PHÂN TÍCH ẢNH..." +

        "</b>";

        message.style.display =
        "block";


        setStatus(
            "Đang phân tích khuôn mặt mẫu..."
        );


        const url =
        URL.createObjectURL(
            file
        );


        const img =
        new Image();


        await new Promise(
            (resolve,reject)=>{

                img.onload =
                resolve;

                img.onerror =
                reject;

                img.src =
                url;

            }
        );


        sourceImage =
        img;


        /*
        ==========================================
        SWITCH LANDMARKER TO IMAGE MODE
        ==========================================
        */

        await landmarker.setOptions({

            runningMode:
            "IMAGE"

        });


        const result =
        landmarker.detect(
            sourceImage
        );


        /*
        ==========================================
        CHECK FACE
        ==========================================
        */

        if(
            !result.faceLandmarks ||
            !result.faceLandmarks.length
        ){

            throw new Error(
                "Không tìm thấy khuôn mặt trong ảnh"
            );

        }


        /*
        ==========================================
        GET SOURCE LANDMARKS
        ==========================================
        */

        const sourceLandmarks =
        result.faceLandmarks[0];


        /*
        ==========================================
        SOURCE IMAGE COORDINATES
        ==========================================
        */

        sourcePoints =
        sourceLandmarks.map(
            p => [

                (1-p.x) *
                sourceImage.naturalWidth,

                p.y *
                sourceImage.naturalHeight

            ]
        );


        /*
        ==========================================
        CREATE DELAUNAY TRIANGLES
        ==========================================
        */

        const delaunay =
        Delaunator
        .from(
            sourcePoints
        );


        triangles =
        delaunay.triangles;


        /*
        ==========================================
        SWITCH BACK TO VIDEO
        ==========================================
        */

        await landmarker.setOptions({

            runningMode:
            "VIDEO"

        });


        /*
        ==========================================
        READY
        ==========================================
        */

        modeElement.textContent =
        "Dense Warp";


        message.innerHTML =

        "<b class='green'>" +

        "ẢNH MẪU OK" +

        "</b><br>" +

        "Dense Face Warp đang chạy";


        message.style.display =
        "none";


        setStatus(
            "DENSE FACE WARP OK"
        );


    }
    catch(error){

        console.error(
            error
        );


        /*
        Make sure video mode
        is restored.
        */

        try{

            await landmarker.setOptions({

                runningMode:
                "VIDEO"

            });

        }
        catch(e){}


        sourceImage =
        null;

        sourcePoints =
        null;

        triangles =
        null;


        message.innerHTML =

        "<b class='red'>" +

        "ẢNH MẪU ERROR" +

        "</b><br>" +

        error.message;


        message.style.display =
        "block";


        setStatus(
            "Không đọc được khuôn mặt mẫu"
        );

    }

});


/*
==================================================
AFFINE TRANSFORM
==================================================
*/

function
triangleWarp(
    src,
    dst
){

    /*
    Source:
    [x0,y0]
    [x1,y1]
    [x2,y2]

    Destination:
    [x0,y0]
    [x1,y1]
    [x2,y2]
    */

    const x0 =
    src[0][0];

    const y0 =
    src[0][1];

    const x1 =
    src[1][0];

    const y1 =
    src[1][1];

    const x2 =
    src[2][0];

    const y2 =
    src[2][1];


    const u0 =
    dst[0][0];

    const v0 =
    dst[0][1];

    const u1 =
    dst[1][0];

    const v1 =
    dst[1][1];

    const u2 =
    dst[2][0];

    const v2 =
    dst[2][1];


    const det =

        x0*(y1-y2) +

        x1*(y2-y0) +

        x2*(y0-y1);


    if(
        Math.abs(det)
        < .0001
    ){

        return;

    }


    const a =

        (
            u0*(y1-y2) +
            u1*(y2-y0) +
            u2*(y0-y1)
        ) / det;


    const b =

        (
            v0*(y1-y2) +
            v1*(y2-y0) +
            v2*(y0-y1)
        ) / det;


    const c =

        (
            u0*(x2-x1) +
            u1*(x0-x2) +
            u2*(x1-x0)
        ) / det;


    const d =

        (
            v0*(x2-x1) +
            v1*(x0-x2) +
            v2*(x1-x0)
        ) / det;


    const e =

        u0 -
        a*x0 -
        c*y0;


    const f =

        v0 -
        b*x0 -
        d*y0;


    ctx.setTransform(
        a,
        b,
        c,
        d,
        e,
        f
    );


    /*
    Clip to destination triangle.
    */

    ctx.beginPath();

    ctx.moveTo(
        u0,
        v0
    );

    ctx.lineTo(
        u1,
        v1
    );

    ctx.lineTo(
        u2,
        v2
    );

    ctx.closePath();

    ctx.clip();


    ctx.drawImage(
        sourceImage,
        0,
        0
    );

}


/*
==================================================
DENSE FACE WARP
==================================================
*/

function
drawDenseWarp(
    landmarks
){

    if(
        !sourceImage ||
        !sourcePoints ||
        !triangles
    ){

        return;

    }


    /*
    ==========================================
    TARGET LANDMARKS
    ==========================================
    */

    const targetPoints =
    landmarks.map(
        landmarkToCanvas
    );


    /*
    ==========================================
    CLEAR
    ==========================================
    */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
    ==========================================
    DRAW WARPED TRIANGLES
    ==========================================
    */

    ctx.save();


    ctx.globalAlpha =
    .96;


    for(
        let i=0;
        i<triangles.length;
        i+=3
    ){

        const ia =
        triangles[i];

        const ib =
        triangles[i+1];

        const ic =
        triangles[i+2];


        const src = [

            sourcePoints[ia],

            sourcePoints[ib],

            sourcePoints[ic]

        ];


        const dst = [

            targetPoints[ia],

            targetPoints[ib],

            targetPoints[ic]

        ];


        ctx.save();


        triangleWarp(
            src,
            dst
        );


        ctx.restore();

    }


    ctx.restore();


    /*
    ==========================================
    FACE EDGE FEATHER
    ==========================================
    */

    const left =
    targetPoints[234];

    const right =
    targetPoints[454];

    const top =
    targetPoints[10];

    const bottom =
    targetPoints[152];


    if(
        left &&
        right &&
        top &&
        bottom
    ){

        const cx =
        (left[0]+right[0])/2;


        const cy =
        (top[1]+bottom[1])/2;


        const rx =
        Math.abs(
            right[0]-left[0]
        )*.58;


        const ry =
        Math.abs(
            bottom[1]-top[1]
        )*.57;


        /*
        Soft mask.

        Keep the central face visible,
        fade the boundary.
        */

        const mask =
        document.createElement(
            "canvas"
        );


        mask.width =
        canvas.width;

        mask.height =
        canvas.height;


        const mc =
        mask.getContext("2d");


        const gradient =
        mc.createRadialGradient(

            cx,
            cy,

            Math.min(rx,ry)*.55,

            cx,
            cy,

            Math.max(rx,ry)

        );


        gradient.addColorStop(
            0,
            "rgba(255,255,255,1)"
        );


        gradient.addColorStop(
            .72,
            "rgba(255,255,255,.98)"
        );


        gradient.addColorStop(
            .88,
            "rgba(255,255,255,.55)"
        );


        gradient.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );


        mc.fillStyle =
        gradient;


        mc.beginPath();


        mc.ellipse(

            cx,
            cy,

            rx,
            ry,

            0,
            0,
            Math.PI*2

        );


        mc.fill();


        /*
        The mask is intentionally
        not used as destination-out.

        Instead we use it to softly
        overlay the central face.
        */

    }


    /*
    ==========================================
    STATUS
    ==========================================
    */

    modeElement.textContent =
    "Dense Warp";


    setStatus(
        "DENSE FACE WARP OK"
    );

}


/*
==================================================
NORMAL FACE MESH
==================================================
*/

function
drawMesh(
    landmarks
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
    "#34c759";


    for(
        let i=0;
        i<landmarks.length;
        i+=4
    ){

        const p =
        landmarks[i];


        const x =
        (1-p.x) *
        canvas.width;


        const y =
        p.y *
        canvas.height;


        ctx.beginPath();


        ctx.arc(

            x,
            y,

            1.6,

            0,
            Math.PI*2

        );


        ctx.fill();

    }


    modeElement.textContent =
    "Tracking";


    setStatus(
        "FACE MESH OK"
    );

}


/*
==================================================
MAIN LOOP
==================================================
*/

function
processFrame(
    now
){

    if(
        !running ||
        !landmarker ||
        video.readyState<2
    ){

        requestAnimationFrame(
            processFrame
        );

        return;

    }


    cameraFrames++;


    /*
    ==========================================
    FPS
    ==========================================
    */

    if(
        now-fpsTime>=1000
    ){

        cameraFPSElement.textContent =
        cameraFrames;


        aiFPSElement.textContent =
        aiFrames;


        cameraFrames =
        0;


        aiFrames =
        0;


        fpsTime =
        now;

    }


    /*
    ==========================================
    NEW VIDEO FRAME
    ==========================================
    */

    if(
        video.currentTime !==
        lastVideoTime
    ){

        lastVideoTime =
        video.currentTime;


        const t0 =
        performance.now();


        try{

            const result =
            landmarker
            .detectForVideo(
                video,
                now
            );


            latencyElement.textContent =
            (
                performance.now()-t0
            ).toFixed(1);


            const faces =
            result.faceLandmarks ||
            [];


            facesElement.textContent =
            faces.length;


            if(
                faces.length>0
            ){

                if(
                    sourceImage &&
                    sourcePoints &&
                    triangles
                ){

                    drawDenseWarp(
                        faces[0]
                    );

                }
                else{

                    drawMesh(
                        faces[0]
                    );

                }

            }
            else{

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                facesElement.textContent =
                "0";


                setStatus(
                    "Đang tìm khuôn mặt..."
                );

            }


            aiFrames++;

        }
        catch(error){

            console.error(
                "FaceLive:",
                error
            );


            setStatus(
                "AI ERROR"
            );

        }

    }


    requestAnimationFrame(
        processFrame
    );

}


/*
==================================================
START
==================================================
*/

start.addEventListener(
"click",
async function(){

    start.disabled =
    true;


    try{

        /*
        CAMERA FIRST
        */

        await startCamera();


        /*
        AI SECOND
        */

        await loadAI();


        /*
        RUN
        */

        running =
        true;


        start.style.display =
        "none";


        message.style.display =
        "none";


        setStatus(
            "FACE MESH OK"
        );


        requestAnimationFrame(
            processFrame
        );

    }
    catch(error){

        console.error(
            error
        );


        setStatus(
            "FACELIVE ERROR"
        );


        message.innerHTML =

        "<b class='red'>" +

        "FACELIVE ERROR" +

        "</b><br><br>" +

        error.name +

        "<br>" +

        error.message;


        message.style.display =
        "block";


        start.disabled =
        false;

    }

});


</script>

</body>
</html>
